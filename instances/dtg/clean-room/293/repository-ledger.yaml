    revision: 6425a74136c1d2dfa7115889abe0b3521700e887
    role: normative-specification
    authority: canonical
    judgment: PASS_BOUNDED
    evidence:
      - Normative document defines unique non-reused task ids, explicit request/success/failure/continuation semantics, acceptance expiry, duplicate-execution handling and document lifecycle.
      - External citations are bound to the innermost attesting exchange and to a task digest; taskDigest and stepDigest semantics are explicitly separated.
      - Transport bindings are required to map framework lifecycle states rather than infer semantic state from transport facts.
      - threadId, parentThreadId and ceremony identifiers may be used for routing, correlation, aggregation or audit.
    specialist_assurance: required-at-composition-for-correlation-surfaces
    composition: required
    runtime: required-for-privacy-and-transport-equivalence-claims
    upstream: none-local
    residual: Strong framework semantics do not prove runtime privacy or multi-transport behavioural equivalence.

