  - repository: trustoverip/dtgwg-cred-spec
    revision: 2b403b607aaec9d84f78189a55337c677f3cd2ed
    role: normative-specification
    authority: canonical
    judgment: AMBER
    evidence:
      - Specification separates cryptographic proof verification, validity windows, issuer authorization, digest integrity and Trust Task context binding.
      - PHC qualification is explicitly a governance determination, not a schema property.
      - Current text states that withdrawal/revocation/re-issuance of the member-issued VMC acknowledgement and its member-controlled status discovery are deferred; until that mechanism exists a verifier cannot learn that a matching acknowledgement was subsequently withdrawn.
    specialist_assurance: required-for-status-privacy-at-composition
    composition: required
    runtime: required-for-status-discovery-behaviour
    upstream: DTG-spec-upstream
    residual: Current consent/currentness for member-issued VMC acknowledgement cannot be assumed solely from a valid matching credential pair.

  - repository: trustoverip/dtgwg-zkp-tf
    revision: 3b6b3f2e76005d6f579d076ee2833ef56d599b65
    role: implementation-guidance
    authority: upstream-task-force
    judgment: AMBER
    evidence:
      - README states that cryptography carries privacy while accreditation/governance carries assurance.
      - Requirements distinguish liveness, personhood, holder binding, human continuity and scoped uniqueness.
      - Scoped nullifiers can enforce one action per enrolled secret/scope/epoch but do not imply one natural person globally.
      - Unlinkability claims are context-dependent and must name adversary and horizon.
    specialist_assurance: required
    composition: required
    runtime: required-for-deployed-proof-privacy
    upstream: DTG-spec-upstream
    residual: Working-draft semantics are appropriately bounded, but a final deployable interoperable proof profile is not established by this source review.

