    role: reference-implementation
    authority: non-normative-reference
    judgment: AMBER
    evidence:
      - Personhood implementation explicitly distinguishes real-human evidence from one-membership-per-person and states cross-community personhood is a wider property.
      - singleMembership requires accepted IDVPs and uses a per-community pseudonym/deduplication control; the guarantee is explicitly attributed to the IDVP.
      - Relationship graph distinguishes half-edges from complete reciprocal edges and re-evaluates in-force lifecycle state; suspend/restore/supersede/withdraw semantics are documented.
      - Task consent binds approval to exact task payload, uses single-use grants and re-checks current policy/enrolment/state before execution.
      - TSP is experimental/off by default and its runtime message paths are stated to require validation against a live mediator before production.
    specialist_assurance: required
    composition: required
    runtime: required
    upstream: OpenVTC/reference-implementation
    residual: Source semantics are materially stronger than a naive implementation, but fresh #293 runtime privacy and multi-transport evidence is absent.

