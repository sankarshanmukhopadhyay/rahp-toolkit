version: 1
schema: rahp-finding-normalization-profile/v1

# These extraction rules are DTG instance data. They translate raw repository/title
# language into the portable semantics consumed by RAHP core routing.
mapping_rules:
  - id: relationship-correlation-privacy
    repository_regex: '^(OpenVTC/|trustoverip/dtgwg-cred-spec$)'
    title_regex: '(relationship DID|relationship edge|correlation scope|deliberate-correlation|policy discovery)'
    semantics:
      dimensions: [privacy]
      concerns: [correlation, persistent-identifier]
      affected_surfaces: [relationship-identifier, status-policy-discovery, retained-evidence]
      change_kind: [behavior-change]

  - id: device-metadata-privacy
    repository_regex: '^OpenVTC/'
    title_regex: '(device|install).*(name|label|heartbeat)|(heartbeat).*(name|label|device|install)'
    semantics:
      dimensions: [privacy]
      concerns: [metadata, correlation]
      affected_surfaces: [protocol-envelope, retained-state, device-presence]
      change_kind: [behavior-change]

  - id: rp-wallet-origin-binding
    repository_regex: '^OpenVTC/(vta-browser-plugin|verifiable-trust-infrastructure|openvtc)$'
    title_regex: '(walletProfile|wallet profile|RP[- ]login|relying party.*wallet|site knows you as|origin[- ]bound|persona.*site)'
    semantics:
      dimensions: [privacy, authorization]
      concerns: [data-minimization, origin-binding]
      affected_surfaces: [wallet-interface, relying-party-binding, persona-disclosure]
      change_kind: [behavior-change]

  - id: delegation-credential-composition
    title_regex: '(delegation credential|delegation.*credential|\bVDC\b)'
    semantics:
      dimensions: [authorization, lifecycle, composition]
      concerns: [delegation]
      affected_surfaces: [credential, authority-state]
      change_kind: [behavior-change]

  - id: redress-contestability-combined
    title_regex: '(rejected applicant|refusal.*reason|reason.*refusal|redress|contestab)'
    semantics:
      dimensions: [redress, governance]
      concerns: [contestability]
      affected_surfaces: [decision-outcome]
      change_kind: [behavior-change]

  - id: spec-dependency-alignment
    title_regex: '(trust-tasks-rs|specification dependency|spec dependency|specs now define|schema dependency)'
    semantics:
      dimensions: [composition, lifecycle]
      concerns: [dependency-alignment]
      affected_surfaces: [specification-interface]
      change_kind: [dependency-change]

  - id: persona-provenance-boundary
    repository_regex: '^(OpenVTC/|trustoverip/dtgwg-trust-tasks-tf$)'
    title_regex: '(persona).*(present|operator surface|preview|projection|provenance|context-local)|(resolved entry is a projection)'
    semantics:
      dimensions: [composition, security, privacy]
      concerns: [provenance, context-boundary]
      affected_surfaces: [persona-projection, operator-surface, presentation-boundary]
      change_kind: [behavior-change]

  - id: admin-scope-authority
    repository_regex: '^(OpenVTC/verifiable-trust-infrastructure|trustoverip/dtgwg-trust-tasks-tf)$'
    title_regex: '(provision).*(unrestricted admin|admin lives|how far it reaches|admin.*reach)'
    semantics:
      dimensions: [authorization, security, composition]
      concerns: [admin-scope, authority-boundary]
      affected_surfaces: [provisioning, administrative-authority]
      change_kind: [behavior-change]

  - id: credential-retrieval-disclosure
    repository_regex: '^(OpenVTC/verifiable-trust-infrastructure|trustoverip/dtgwg-trust-tasks-tf)$'
    title_regex: '(credentials/list|vault/credentials|returns a member.s credential bodies|credential bodies)'
    semantics:
      dimensions: [authorization, privacy, composition]
      concerns: [credential-disclosure, retrieval-authority]
      affected_surfaces: [credential-store, trust-task-response]
      change_kind: [behavior-change]

  - id: data-room-custody-lifecycle
    repository_regex: '^(OpenVTC/|trustoverip/dtgwg-trust-tasks-tf$)'
    title_regex: '(rooms|data rooms|epoch key chain|epoch link|group custody|presentation oracle)'
    semantics:
      dimensions: [authorization, lifecycle, composition, security]
      concerns: [data-room-custody, key-lifecycle, membership-authority]
      affected_surfaces: [room-membership, epoch-key-chain, room-storage, presentation-boundary]
      change_kind: [behavior-change]

  - id: backup-evidence-integrity
    repository_regex: '^OpenVTC/verifiable-trust-infrastructure$'
    title_regex: '(backup).*(spec debt|audit|evidence|family)'
    semantics:
      dimensions: [lifecycle, security]
      concerns: [evidence-integrity, recovery-boundary]
      affected_surfaces: [backup, retained-state, audit-evidence]
      change_kind: [behavior-change]

  - id: untrusted-input-fail-closed
    repository_regex: '^OpenVTC/'
    title_regex: '(recalled memory as untrusted data|unaddressed consent request is refused|page-task refusal)'
    semantics:
      dimensions: [security, authorization]
      concerns: [untrusted-input, fail-closed]
      affected_surfaces: [agent-memory, inbound-request, consent-boundary]
      change_kind: [behavior-change]

  - id: binder-enumerability-privacy
    repository_regex: '^trustoverip/dtgwg-cred-spec$'
    title_regex: '(binder).*(unsalted|enumerable|blinding)|(unsalted).*(digest|binder)'
    semantics:
      dimensions: [privacy, security]
      concerns: [enumerability, correlation]
      affected_surfaces: [credential-binder, digest-reference]
      change_kind: [behavior-change]

  - id: routine-release-or-plan
    repository_regex: '^trustoverip/'
    title_regex: '(chore: release v[0-9]+\.[0-9]+\.[0-9]+|WD02 merge plan)'
    semantics:
      dimensions: [release]
      concerns: [aggregation]
      affected_surfaces: [release-artifact, editorial-plan]
      change_kind: [release-change]

  # Judgment-derived semantic coverage from controller #629 (2026-09-12).
  # These rules classify proposition families, not snapshot-specific finding IDs.
  - id: vac-presenter-binding
    repository_regex: '^OpenVTC/dtg-credentials$'
    title_regex: '(VAC).*(bearer credential|audience|presenter)|(bearer credential).*(VAC|audience)'
    semantics:
      dimensions: [authorization, security, composition]
      concerns: [presenter-binding, bearer-authority, invocation-binding]
      affected_surfaces: [credential, presentation-boundary, authority-state]
      change_kind: [behavior-change]

  - id: credential-status-lifecycle
    repository_regex: '^OpenVTC/dtg-credentials$'
    title_regex: 'credentialStatus'
    semantics:
      dimensions: [lifecycle, security]
      concerns: [credential-status, revocation-enforcement]
      affected_surfaces: [credential, status-discovery, verification-decision]
      change_kind: [behavior-change]

  - id: ci-supply-chain-hardening
    repository_regex: '^OpenVTC/'
    title_regex: '(pin actions to commit SHAs|scope the publish token|Dependabot)'
    semantics:
      dimensions: [repository-security]
      concerns: [ci-hardening]
      affected_surfaces: [ci-workflow, release-pipeline]
      change_kind: [security-hardening]

  - id: vec-vetting-profile-evidence
    repository_regex: '^trustoverip/dtgwg-cred-spec$'
    title_regex: '(informative).*(identity-vetting|vetting).*(VEC)|(identity-vetting profile).*(VEC)'
    semantics:
      dimensions: [composition]
      concerns: [vetting-profile-evidence]
      affected_surfaces: [specification-interface]
      change_kind: [documentation-change]

  - id: vetting-admission-composition
    repository_regex: '^(OpenVTC/(openvtc|verifiable-trust-infrastructure)|trustoverip/dtgwg-cred-spec)$'
    title_regex: '(vetted admission|peer identity vetting|guided join|vetter directory|vetter registry|automatic vetter grants|identity-vetting profile|identity vetting|QR tickets|grant resend)'
    semantics:
      dimensions: [authorization, governance, privacy, composition, lifecycle]
      concerns: [admission-authority, vetting, disclosure, grant-lifecycle]
      affected_surfaces: [admission-flow, vetter-registry, profile, ticket, grant-state]
      change_kind: [behavior-change]

  - id: key-custody-service-authority
    repository_regex: '^OpenVTC/verifiable-trust-infrastructure$'
    title_regex: '(never leaving the VTA|never leaves the VTA|service can fetch the keys|export one key|retire seeds|export-mnemonic)'
    semantics:
      dimensions: [security, authorization, lifecycle, composition]
      concerns: [key-custody, key-export, service-authority]
      affected_surfaces: [key-store, key-export, service-authority]
      change_kind: [behavior-change]

  - id: dependency-version-covered
    repository_regex: '^OpenVTC/verifiable-trust-infrastructure$'
    title_regex: 'dtg-credentials.*[0-9]+\.[0-9]+.*[0-9]+\.[0-9]+'
    semantics:
      dimensions: [composition, release]
      concerns: [dependency-version]
      affected_surfaces: [dependency-interface, release-artifact]
      change_kind: [dependency-change]

  - id: defensive-did-resolution
    repository_regex: '^OpenVTC/vta-browser-plugin$'
    title_regex: '(refuse to resolve).*did:webvh.*(local-only|non-public address)'
    semantics:
      dimensions: [security]
      concerns: [defensive-resolution, fail-closed]
      affected_surfaces: [did-resolution, network-boundary]
      change_kind: [security-hardening]

  - id: openvtc-security-combined
    repository_regex: '^OpenVTC/'
    title_regex: '(auth|keyId|internal key|signed|proof|personhood|conformance|invitation|lifecycle|cache)'
    semantics:
      dimensions: [security, lifecycle]
      concerns: [authorization]
      affected_surfaces: [protocol-envelope]
      change_kind: [behavior-change]

  - id: openvtc-routine-alignment
    repository_regex: '^OpenVTC/'
    title_regex: '(release|SDK|sdk|design note|removal notice|tell a member|drift reaches zero|(^|[- ])v[0-9]+\.[0-9]+\.[0-9]+$)'
    semantics:
      dimensions: [release]
      concerns: [aggregation]
      affected_surfaces: [release-artifact]
      change_kind: [release-change]

  - id: trust-tasks-framework-covered
    repository_regex: '^trustoverip/dtgwg-trust-tasks-(tf|spec)$'
    title_regex: '(framework|registry|generated types|typed signing|dispatch|application-state|refusal|removal|publish|registered acl/change-role task)'
    semantics:
      dimensions: [composition, lifecycle]
      concerns: [framework-alignment]
      affected_surfaces: [trust-task]
      change_kind: [behavior-change]
