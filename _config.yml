title: RAHP Toolkit
description: Portable assurance execution and monitoring for pressure-testing trust systems, specifications, implementations, changes and compositions.
theme: just-the-docs
url: "https://sankarshanmukhopadhyay.github.io"
baseurl: "/rahp-toolkit"
repository: sankarshanmukhopadhyay/rahp-toolkit
search_enabled: true
heading_anchors: true
color_scheme: rahp
aux_links:
  "View on GitHub":
    - "https://github.com/sankarshanmukhopadhyay/rahp-toolkit"
aux_links_new_tab: true
callouts:
  warning:
    title: Risk or harm warning
    color: red
  governance:
    title: Governance dependency
    color: yellow
  evidence:
    title: Assurance evidence
    color: blue
  decision:
    title: Review decision
    color: green
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
exclude:
  - vendor
  - "*.zip"
  - Gemfile.lock
  - tools
  - requirements.txt
