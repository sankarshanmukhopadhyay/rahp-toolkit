release_thesis: >-
  v2.2.0 packages additive evidence-production and realization-assurance capabilities
  developed after v2.1.0: semantic assurance obligations, deterministic evidence-producer
  ownership and dispatch, provenance routing, bounded assurance invariants, current-portfolio
  clean-room execution, and explicit normative-versus-realization separation. The qualified
  property is evidence-conservative execution and accountable residual ownership, not a
  universal PASS/GREEN claim for any assessed consumer portfolio.
