contract_id: rahp-policy-subject-v1
status: experimental
issue: 662
purpose: >-
  Define the source-preservation and authority boundary for policy documents used
  as bounded assurance subjects. This contract does not extend RAHP authority to
  legal advice, regulatory certification, or runtime-conformance claims.

source:
  required:
    - uri
    - version
    - sha256
    - length
  optional:
    - retrieved_at
  invariants:
    - source identity and version are explicit
    - the SHA-256 digest is calculated over the complete assessment-source UTF-8 text
    - upstream repository/blob identity is recorded separately when a bounded research snapshot is used
    - a revised source creates a new source digest and assessment lineage

structure:
  status: experimental
  supported:
    - YAML front matter preserved as metadata and excluded from propositions
    - Markdown heading hierarchy
    - paragraph boundaries
    - list-item boundaries
    - exact source offsets and source-span hashes
    - referenced Markdown links recorded without traversal
    - quoted definition terms recorded as review candidates
    - textual Section references recorded unresolved
    - incorporated-document candidates distinguished from ordinary links
    - lexical definition-use candidates
    - cross-document same-term definition-conflict candidates
    - precedence-language candidates
  invariants:
    - structural metadata MUST NOT silently become a policy proposition
    - source spans MUST reconstruct exact retained source bytes
    - incorporated or linked documents MUST NOT be silently traversed
    - definition candidates MUST NOT silently rewrite proposition meaning
    - Section references MUST remain unresolved until an explicit resolver/reviewer confirms the target
    - precedence/conflict candidates MUST remain judgment-required until explicit review
    - reviewed precedence is a research interpretation, not a legal conclusion
  deferred:
    - complete table semantics
    - semantic definition propagation beyond lexical candidates
    - remote acquisition and verification
    - scanned or OCR document handling

proposition:
  required:
    - id
    - type
    - source_span
    - normalized_proposition
    - derivation
    - ambiguity_signals
    - judgment_required
  types:
    - obligation
    - permission
    - prohibition
    - discretion
    - condition
    - exception
    - representation
    - retention
    - disclosure
    - remedy
    - termination
    - delegation
  source_span:
    required:
      - start
      - end
      - text
      - sha256
    invariants:
      - offsets address the exact source text
      - span digest matches the exact preserved span
      - normalization never replaces or mutates the preserved source span
  derivation:
    ingestion_value: direct-source-statement
    inferred_records_must_be_separate: true
  experimental_facets:
    status: review-candidate-only
    fields:
      - actors
      - temporal_scope_candidates
      - consequence_candidates
      - section_references
    derivation_value: deterministic-facet-candidate
    invariants:
      - facet candidates are never treated as reviewed facts
      - absence of a facet is not evidence that the semantic element is absent
      - facet candidates do not change terminal assurance semantics

review:
  contract: rahp-policy-review/v2
  supported_actions:
    - accept
    - amend
    - reject
    - split
    - merge
  invariants:
    - machine/source propositions and source spans are immutable lineage
    - amend, reject, split and merge require explicit rationale
    - split children retain the source parent identifier
    - merge records retain every source parent identifier
    - rejected propositions MUST NOT enter reviewed RAHP analysis
    - unresolved ambiguous propositions MUST NOT enter reviewed RAHP analysis
    - risk/harm hypotheses MUST be generated from the reviewed proposition set

relationships:
  contract: rahp-policy-relationships/v1
  automatic_document_traversal: false
  supported:
    - lexical definition-use candidates
    - incorporated-document relationship review
    - cross-document definition-conflict candidates
    - precedence-language candidates
    - explicit reviewer precedence decisions
  invariants:
    - accepting an incorporated-document relationship does not fetch or traverse it
    - cross-document conflicts remain judgment-required without explicit review
    - precedence decisions require a reviewer rationale and selected subject digest
    - precedence decisions are non-terminal and do not claim legal validity

boundary:
  policy_evidence_class: governance-source
  policy_is_runtime_evidence: false
  legal_advice: false
  regulatory_conformance: false
  ai_output_is_assurance_evidence: false
  ambiguous_source_becomes_deterministic_finding: false
  missing_remedy_text_proves_no_redress: false
  facet_candidates_are_reviewed_facts: false
  references_are_silently_traversed: false
  rejected_propositions_enter_analysis: false
  unreviewed_ambiguous_propositions_enter_analysis: false

research_outputs:
  risk_hypotheses:
    contract: rahp-policy-reviewed-risk-hypotheses/v1
    source: reviewed proposition set
    terminal_assurance: false
  relationships:
    contract: rahp-policy-relationships/v1
    terminal_assurance: false
  assessment:
    contract: rahp-policy-assessment-research/v2
    terminal_assurance: false
  delta:
    contract: rahp-policy-delta/v1
    changed_policy_requires_reassessment: true
  runtime_comparison:
    contract: rahp-policy-runtime-comparison/v1
    required_runtime_evidence_class: runtime-observation
    terminal_assurance: false
  evidence_work_queue:
    contract: rahp-policy-evidence-obligation/v1
    required_fields:
      - obligation_id
      - proposition_id
      - source_proposition_ids
      - evidence_class
      - question
      - why_required
      - materiality
      - route
      - state
      - terminal_effect
    invariants:
      - obligation identifiers are deterministic for the same proposition, evidence class, route and question
      - every obligation explains why the requested evidence or judgment is required
      - materiality is explicit and may remain context-dependent
      - an unevaluated obligation has no terminal assurance effect
      - source proposition lineage is retained across amended, split and merged reviewed propositions
  evidence_obligation_lifecycle:
    contract: rahp-policy-evidence-obligation-lifecycle/v1
    states:
      - OPEN
      - EVIDENCE_SUPPLIED
      - SATISFIED
      - CONTRADICTED
      - INDETERMINATE
      - SUPERSEDED
    invariants:
      - lifecycle evaluation never creates terminal assurance in the research adapter
      - SATISFIED, CONTRADICTED and INDETERMINATE require explicit rationale
      - supplied evidence is referenced rather than silently converted into policy-source evidence
      - a changed or removed source proposition supersedes prior obligations tied to that source lineage
      - superseded obligations require reassessment and MUST NOT silently carry prior evidence forward

graduation_gates:
  - demonstrate lossless clause/source traceability on at least two materially different policies
  - distinguish source statements from reviewed propositions and RAHP inferences
  - preserve ambiguity as judgment-required or indeterminate
  - demonstrate accept/amend/reject/split/merge lineage without source mutation
  - demonstrate that rejected and unresolved ambiguous propositions cannot drive RAHP hypotheses
  - reuse portable RAHP patterns without policy-specific changes to the stable controller
  - demonstrate deterministic policy-change reassessment impact
  - preserve governance-source versus runtime-observation evidence separation
  - pressure-test representative real policy structure and provenance
  - demonstrate reviewed definition/cross-reference/incorporation semantics without hidden traversal
  - demonstrate cross-document definition conflicts and precedence decisions without automatic legal resolution
  - demonstrate that richer proposition facets improve review without becoming unreviewed assurance facts
  - record specialist routing for jurisdiction-dependent legal interpretation before any stable merge
