catalogue_version: 1.1.0
record_type: guardrail_pattern
records:
- id: GRP-AUTH-01
  name: No authority by inference
  protected_interest: principal agency
  prohibited_state: A consequential action is authorized solely from authentication, possession, credential validity,
    discovery metadata or registry presence.
  risk_patterns:
  - RKP-AUTH-01
  - RKP-CRD-01
  - RKP-DISC-01
  - RKP-AUTH-04
  - RKP-AUTH-06
  control_patterns:
  - CTP-AUTH-01
  - CTP-DISC-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-AUTH-02
  name: Current authority required
  protected_interest: principal agency
  prohibited_state: A consequential action proceeds when required authority, revocation or status state cannot be
    established at the action boundary.
  risk_patterns:
  - RKP-AUTH-02
  - RKP-DEL-03
  - RKP-CRD-02
  - RKP-AUTH-04
  - RKP-AUTH-05
  - RKP-AUTH-07
  control_patterns:
  - CTP-AUTH-02
  - CTP-DEL-02
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-DEL-01
  name: Delegation cannot silently expand
  protected_interest: principal agency
  prohibited_state: A delegate or downstream actor receives materially broader scope than was granted by the accountable
    principal.
  risk_patterns:
  - RKP-DEL-01
  - RKP-AUTH-03
  control_patterns:
  - CTP-AUTH-03
  - CTP-DEL-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-GOV-01
  name: No unilateral irreversible governance action
  protected_interest: due process
  prohibited_state: One actor can make an irreversible high-impact governance decision without defined independent
    check or later remedy.
  risk_patterns:
  - RKP-GOV-01
  - RKP-GOV-02
  control_patterns:
  - CTP-GOV-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-ID-01
  name: No role substitution
  protected_interest: identity integrity
  prohibited_state: A verifier substitutes one identity/role layer for another without an explicit binding rule.
  risk_patterns:
  - RKP-ID-01
  control_patterns:
  - CTP-ID-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-PRV-01
  name: No unnecessary disclosure
  protected_interest: privacy
  prohibited_state: A required flow discloses information not necessary for the stated decision or function.
  risk_patterns:
  - RKP-PRV-02
  - RKP-PRV-03
  control_patterns:
  - CTP-PRV-02
  - CTP-PRV-03
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-EXC-01
  name: No essential-service single path
  protected_interest: equitable access
  prohibited_state: A high-impact or essential participation path has no viable alternative for foreseeable legitimate
    users excluded by the primary mechanism.
  risk_patterns:
  - RKP-EXC-01
  - RKP-EXC-02
  control_patterns:
  - CTP-EXC-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-AGT-01
  name: No agent action beyond current mandate
  protected_interest: principal agency
  prohibited_state: An autonomous agent performs a consequential action outside the current bounded mandate.
  risk_patterns:
  - RKP-AGT-01
  - RKP-AGT-02
  control_patterns:
  - CTP-AGT-01
  - CTP-AGT-02
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-OPS-01
  name: No unsafe replay
  protected_interest: transaction integrity
  prohibited_state: A replay or retry can repeat an externally consequential side effect without a new authorized
    decision.
  risk_patterns:
  - RKP-OPS-02
  control_patterns:
  - CTP-OPS-02
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-RED-01
  name: No consequential decision without contestability evidence
  protected_interest: due process
  prohibited_state: A high-impact adverse decision is made without sufficient retained evidence and an accountable
    appeal/remedy path.
  risk_patterns:
  - RKP-RED-01
  - RKP-GOV-04
  control_patterns:
  - CTP-RED-01
  - CTP-GOV-03
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-COMP-01
  name: No implicit cross-spec semantic substitution
  protected_interest: composition integrity
  prohibited_state: A fact established by one specification is treated as establishing a different authority, completion,
    identity or status fact in another without an explicit contract.
  risk_patterns:
  - RKP-COMP-01
  - RKP-COMP-04
  control_patterns:
  - CTP-COMP-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-PE-01
  name: Critical dependency must have governed exit
  protected_interest: institutional autonomy
  prohibited_state: A critical dependency can materially change access or surveillance conditions with no documented
    alternative, exit or governance response.
  risk_patterns:
  - RKP-PE-01
  control_patterns:
  - CTP-PE-01
  trigger_condition: before entering or continuing the prohibited state
  enforcement_point: relevant decision or execution boundary
  failure_mode: block or suspend the action
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-DEL-02
  name: Consequential delegated action needs provenance
  protected_interest: accountability
  prohibited_state: A consequential delegated or agentic action happens without durable evidence linking the action
    to the accountable principal and the authority used.
  risk_patterns:
  - RKP-DEL-02
  - RKP-AGT-03
  control_patterns:
  - CTP-DEL-01
  - CTP-AGT-03
  trigger_condition: before a consequential delegated action is accepted as authorized or complete
  enforcement_point: delegation and audit boundary
  failure_mode: block, suspend, or mark the action as not sufficiently attributable
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-GOV-02
  name: No unsafe governance transition
  protected_interest: continuity and due process
  prohibited_state: A governance or policy change takes effect for live artefacts or dependent systems without clear
    effective dates, migration rules, compatibility handling or retirement rules.
  risk_patterns:
  - RKP-GOV-03
  control_patterns:
  - CTP-GOV-02
  trigger_condition: before a changed rule becomes effective for existing participants or artefacts
  enforcement_point: policy lifecycle
  failure_mode: delay activation or require an explicit governed transition plan
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-GOV-03
  name: Registry authority must be explicit
  protected_interest: legitimate governance
  prohibited_state: Trust-relevant registry entries can be added, changed, suspended, removed or corrected without
    a published rule saying who has authority and how decisions can be reviewed.
  risk_patterns:
  - RKP-DISC-03
  control_patterns:
  - CTP-DISC-03
  - CTP-GOV-01
  trigger_condition: before a registry decision changes trust-relevant state
  enforcement_point: registry governance
  failure_mode: do not treat the registry decision as authoritative until the governance rule is established
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-CRD-01
  name: No credential use outside its bound context
  protected_interest: purpose integrity and principal agency
  prohibited_state: A credential is relied on outside its bound task, audience, purpose or authorization context
    without an explicit rule permitting the broader use.
  risk_patterns:
  - RKP-CRD-03
  - RKP-CRD-04
  control_patterns:
  - CTP-CRD-01
  - CTP-AGT-02
  trigger_condition: before a credential is accepted for a materially different context, audience or purpose
  enforcement_point: credential verification and relying-party decision boundary
  failure_mode: reject, request fresh evidence, or require explicit onward authorization
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-OPS-02
  name: No silent assurance downgrade on dependency failure
  protected_interest: assurance integrity
  prohibited_state: A system treats stale, cached or unavailable trust-relevant dependency state as current without
    a declared and bounded fallback rule.
  risk_patterns:
  - RKP-OPS-01
  - RKP-DISC-02
  control_patterns:
  - CTP-OPS-01
  - CTP-DISC-02
  trigger_condition: when current dependency or discovery state cannot be obtained or verified
  enforcement_point: dependency and discovery boundary
  failure_mode: deny, defer, or use only a documented bounded fallback with visible risk state
  fail_behavior: closed
  override_permitted: true
  override_authority: explicit deployment governance authority
  evidence_required: true
- id: GRP-OPS-03
  name: Systemic invalidation needs a continuity path
  protected_interest: service continuity and access
  prohibited_state: Withdrawal, compromise or deregistration of a shared dependency invalidates many downstream
    artefacts without notification, re-verification, replacement or recovery handling.
  risk_patterns:
  - RKP-OPS-03
  control_patterns:
  - CTP-OPS-03
  trigger_condition: before or when a shared dependency is withdrawn, compromised or materially changes status
  enforcement_point: dependency lifecycle and recovery boundary
  failure_mode: enter a governed continuity or recovery state rather than silently invalidating downstream use
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-COMP-02
  name: Cross-spec lifecycle semantics must reconcile
  protected_interest: composition integrity
  prohibited_state: A consequential composed action proceeds when participating specifications disagree about the
    relevant validity, freshness, expiry, revocation or status point.
  risk_patterns:
  - RKP-COMP-02
  control_patterns:
  - CTP-COMP-02
  - CTP-AUTH-02
  - CTP-CRD-02
  trigger_condition: before a composed action relies on state from more than one specification
  enforcement_point: cross-spec composition boundary
  failure_mode: block or require an explicit lifecycle reconciliation contract
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-PRV-02
  name: No unnecessary cross-context correlation
  protected_interest: privacy
  prohibited_state: Stable identifiers or combined protocol data enable cross-context correlation that is not needed
    for the declared purpose.
  risk_patterns:
  - RKP-PRV-01
  - RKP-COMP-03
  - RKP-PRV-04
  control_patterns:
  - CTP-PRV-01
  - CTP-PRV-02
  - CTP-PRV-04
  trigger_condition: before stable identifiers or combined data are disclosed across contexts
  enforcement_point: identifier creation and presentation composition boundary
  failure_mode: use scoped identifiers, reduce disclosure, or document why correlation is necessary
  fail_behavior: closed
  override_permitted: true
  override_authority: explicit privacy or governance authority
  evidence_required: true
- id: GRP-ID-02
  name: No load-bearing uniqueness claim without evidence
  protected_interest: fairness and identity integrity
  prohibited_state: A consequential decision relies on a uniqueness or one-person-one-actor claim when the system
    cannot state and support the scope and mechanism of that claim.
  risk_patterns:
  - RKP-ID-02
  control_patterns:
  - CTP-RISK-01
  trigger_condition: before uniqueness is used to allow, deny, rank, limit or allocate something consequential
  enforcement_point: identity and policy decision boundary
  failure_mode: do not use uniqueness as a decision input, or narrow the claim to what can be supported
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-ID-03
  name: High-impact recovery must resist takeover
  protected_interest: identity continuity and access
  prohibited_state: A recovery path for a high-impact account or identity can bypass normal protections without
    independent checks, notice, delay or equivalent takeover resistance.
  risk_patterns:
  - RKP-ID-03
  control_patterns:
  - CTP-ID-02
  trigger_condition: before recovery changes control of a high-impact identity, account or credential
  enforcement_point: recovery workflow
  failure_mode: stop recovery or require stronger independent recovery evidence
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-DEL-03
  name: No authority from lineage alone
  protected_interest: principal agency
  prohibited_state: A consequential delegated action is authorized solely because a caller-supplied actor or delegation
    chain is internally well formed.
  risk_patterns:
  - RKP-DEL-04
  - RKP-DEL-06
  control_patterns:
  - CTP-DEL-03
  trigger_condition: before delegated authority is relied upon
  enforcement_point: authorization or execution boundary
  failure_mode: block, defer, or escalate until independent authority evidence is established
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-DEL-04
  name: No silent lineage rewrite
  protected_interest: accountability
  prohibited_state: A forwarding actor modifies a prior delegation hop while the system continues to represent the
    lineage as append-only audit history.
  risk_patterns:
  - RKP-DEL-05
  control_patterns:
  - CTP-DEL-04
  trigger_condition: on delegated forwarding
  enforcement_point: receive/forward boundary
  failure_mode: reject or record a mutation finding
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
- id: GRP-DEL-05
  name: No cross-context authority by replay
  protected_interest: principal agency
  prohibited_state: Delegation evidence from one context is accepted as authority in another without a valid context/domain
    binding.
  risk_patterns:
  - RKP-DEL-07
  control_patterns:
  - CTP-DEL-05
  trigger_condition: before cross-context evidence reliance
  enforcement_point: authority verification boundary
  failure_mode: reject or mark authority indeterminate
  fail_behavior: closed
  override_permitted: false
  override_authority: null
  evidence_required: true
