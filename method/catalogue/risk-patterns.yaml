- id: RKP-PE-02
  name: Failure cost externalization
  family: Political economy
  description: Operators or intermediaries capture benefits while harmed participants bear disproportionate remediation,
    exclusion or liability costs.
  harm_patterns:
  - HRM-ECO-01
  - HRM-ECO-02
  - HRM-GOV-02
  origin: ecosystem
  scope: systemic
  temporal_mode: immediate
  reversibility: costly
  observability: detectable
  applicability: {}
  related_patterns: []
  guardrail_requirement:
    status: conditional
    rationale: Failure costs are not always avoidable. A guardrail is required when affected people cannot reasonably
      choose, exit or seek remedy.
    condition: Applies to high-impact or involuntary use where materially affected parties lack meaningful choice,
      exit or remedy.
- id: RKP-DEL-04
  name: Attribution lineage mistaken for authority
  family: Authority and delegation
  description: Caller-supplied delegation or actor-lineage metadata is treated as proof that the represented grants
    actually existed or remain valid.
  harm_patterns:
  - HRM-AUT-04
  - HRM-SEC-02
  origin: design
  scope: cross-party
  temporal_mode: immediate
  reversibility: costly
  observability: detectable
  applicability:
    requires:
    - delegation
    - lineage or actor-chain metadata
  related_patterns:
  - RKP-AUTH-01
  - RKP-DEL-02
  guardrail_requirement:
    status: required
    rationale: Attribution metadata can be syntactically valid while fabricated, so consequential action requires
      independent authority evidence.
    condition: null
- id: RKP-DEL-05
  name: Delegation lineage mutation
  family: Authority and delegation
  description: A delegating or forwarding actor rewrites prior lineage hops, making later audit unable to distinguish
    the forwarded representation from the chain originally received.
  harm_patterns:
  - HRM-GOV-02
  - HRM-SEC-02
  origin: design
  scope: cross-party
  temporal_mode: immediate
  reversibility: costly
  observability: detectable
  applicability:
    requires:
    - delegation
    - multi-hop forwarding
  related_patterns:
  - RKP-DEL-02
  guardrail_requirement:
    status: required
    rationale: Prior-hop mutation destroys independent attribution evidence unless the received representation is
      retained or integrity-bound.
    condition: null
- id: RKP-DEL-06
  name: Delegation evidence-state collapse
