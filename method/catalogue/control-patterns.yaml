  introduces_or_amplifies_risks: []
- id: CTP-PRV-02
  name: Composition privacy analysis
  control_function: detect
  control_objective: Evaluate privacy and inference risks for the combined disclosure set, not only each credential
    or artefact independently.
  risk_patterns:
  - RKP-PRV-02
  - RKP-COMP-03
  - RKP-PRV-05
  - RKP-PRV-09
  authority: system operator
  enforcement_point: presentation construction
  activation: before or at relevant decision boundary
  failure_behavior: deny, defer, or escalate rather than silently weaken the assurance claim
  audit_events:
