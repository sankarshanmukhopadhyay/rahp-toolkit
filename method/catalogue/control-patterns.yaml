catalogue_version: 1.1.0
record_type: control_pattern
records:
- id: CTP-AUTH-01
  name: Separate authentication from authorization
  control_function: constrain
  control_objective: Require an explicit authorization decision independent of identity, authentication, credential
    validity or discovery integrity.
  risk_patterns:
  - RKP-AUTH-01
  - RKP-CRD-01
  - RKP-DISC-01
  authority: system operator
  enforcement_point: authorization boundary
  activation: before or at relevant decision boundary
  failure_behavior: deny, defer, or escalate rather than silently weaken the assurance claim
  audit_events:
  - control-evaluated
  - control-failed-or-overridden
  evidence_patterns: []
  introduces_or_amplifies_risks: []
- id: CTP-AUTH-02
  name: Action-time authority evaluation
  control_function: prevent
  control_objective: Evaluate current authority, status, expiry and revocation immediately before a consequential
    action.
  risk_patterns:
  - RKP-AUTH-02
  - RKP-CRD-02
  - RKP-COMP-02
  authority: system operator
  enforcement_point: action boundary
  activation: before or at relevant decision boundary
