  - EVP-PRV-01
  introduces_or_amplifies_risks: []
- id: CTP-PRV-03
  name: Privacy-safe failure responses
  control_function: prevent
  control_objective: Limit errors and diagnostics to information necessary for remediation, with sensitive detail
    protected or authenticated.
  risk_patterns:
  - RKP-PRV-03
  authority: system operator
  enforcement_point: error boundary
  activation: before or at relevant decision boundary
  failure_behavior: deny, defer, or escalate rather than silently weaken the assurance claim
  audit_events:
  - control-evaluated
  - control-failed-or-overridden
  evidence_patterns: []
  introduces_or_amplifies_risks: []
- id: CTP-PRV-05
  name: Privacy-preserving status resolution
  risk_patterns:
  - RKP-PRV-06
  authority: system operator or status-service governance authority
  enforcement_point: status-resolution boundary
  activation: before status resolution reveals a credential-specific or relying-context-specific observation
  failure_behavior: minimize observer-visible linkage, use a less revealing resolution path, or preserve explicit privacy residual risk
  audit_events:
  - status-privacy-boundary-evaluated
  - status-correlation-risk-recorded
  evidence_patterns:
  - EVP-PRV-01
  control_function: minimize
  control_objective: Resolve required lifecycle status without exposing more presentation timing, credential identity,
    verifier context or relationship information than the relying decision requires.
  introduces_or_amplifies_risks: []
- id: CTP-PRV-06
  name: Purpose-bound post-disclosure processing
  risk_patterns:
  - RKP-PRV-07
  authority: data controller or governance authority
  enforcement_point: post-disclosure data lifecycle boundary
  activation: before disclosed information is retained, transferred, profiled or reused beyond the immediate decision
  failure_behavior: reject the secondary use, obtain a valid new basis, or preserve an explicit unresolved governance state
  audit_events:
  - disclosure-purpose-evaluated
  - secondary-use-authorized-or-blocked
  evidence_patterns:
  - EVP-PRV-01
  control_function: constrain
  control_objective: Bind downstream processing of disclosed information to an explicit purpose, audience, retention
    period and applicable governance basis rather than treating successful presentation as perpetual permission.
  introduces_or_amplifies_risks: []
- id: CTP-PRV-07
  name: Verification artefact retention minimization
  risk_patterns:
  - RKP-PRV-09
  - RKP-PRV-07
  authority: data controller or system operator
  enforcement_point: verification evidence and audit-retention boundary
  activation: when verification artefacts or transcripts are persisted or aggregated
  failure_behavior: minimize, expire, pseudonymize or segregate retained artefacts unless a documented purpose requires them
  audit_events:
  - verification-retention-evaluated
  - retention-expiry-or-exception-recorded
  evidence_patterns:
  - EVP-PRV-01
  control_function: minimize
  control_objective: Retain only the verification evidence required for the declared operational, assurance or audit
    purpose and prevent unnecessary cross-context aggregation.
  introduces_or_amplifies_risks: []
- id: CTP-PRV-08
  name: Issuer-side unlinkability pressure test
  risk_patterns:
  - RKP-PRV-08
  - RKP-PRV-05
  authority: privacy assurance or governance authority
  enforcement_point: issuance and proof-configuration boundary
  activation: before claiming unlinkability or cross-context privacy
  failure_behavior: do not assert the privacy property when issuer-controlled metadata or proof choices create a material correlator
  audit_events:
  - issuer-controlled-correlation-tested
  - unlinkability-claim-evaluated
  evidence_patterns:
  - EVP-PRV-01
  control_function: detect
  control_objective: Pressure-test whether issuer-controlled identifiers, proof metadata, issuance cadence, renewal
    behavior or verification material can link interactions that the declared privacy property says should remain separate.
  introduces_or_amplifies_risks: []
- id: CTP-EXC-01
  name: Alternative participation path
  control_function: compensate
  control_objective: Provide at least one viable alternative when the primary identity, device, accessibility or
    connectivity path excludes legitimate participants.
  risk_patterns:
  - RKP-EXC-01
  - RKP-EXC-02
  authority: system operator
  enforcement_point: user journey
  activation: before or at relevant decision boundary
