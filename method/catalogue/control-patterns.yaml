- id: CTP-PRV-01
  name: Pairwise or scoped identifiers
  control_function: prevent
  control_objective: Use context-scoped identifiers and minimize stable metadata where correlation is not required.
  risk_patterns:
  - RKP-PRV-01
  - RKP-COMP-03
  - RKP-PRV-05
  - RKP-PRV-08
  authority: system operator
