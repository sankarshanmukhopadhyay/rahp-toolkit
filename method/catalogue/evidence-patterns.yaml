catalogue_version: 1.1.0
record_type: evidence_pattern
records:
- id: EVP-AUTH-01
  name: Authorization decision trace
  claim_supported: Shows identity/authentication inputs separately from current authorization/status evaluation,
    including the policy and actor authorizing lifecycle continuation where relevant.
  producer: authorization service or verifier
  consumer: assessor/auditor
  collection_event: when the relevant control is exercised or tested
  integrity_requirement: tamper-evident provenance sufficient to bind evidence to target revision and assessment
  freshness: per consequential decision
  retention: retain according to method/evidence-retention.yaml and deployment policy
  invalidation: invalidate when source revision, policy, authority or test basis materially changes
  privacy_classification: internal-assurance
