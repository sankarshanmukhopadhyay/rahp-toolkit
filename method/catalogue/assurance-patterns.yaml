- id: ATP-AUTH-01
  name: Authentication/authorization separation test
  assertion: Identity or credential validity alone never authorizes a consequential action.
  control_patterns:
  - CTP-AUTH-01
  guardrail_patterns:
  - GRP-AUTH-01
  preconditions:
  - system or specification exposes the relevant decision boundary
  procedure: Exercise positive and negative cases at the stated boundary and inspect recorded evidence.
  expected_result: Identity or credential validity alone never authorizes a consequential action.
  failure_interpretation: The claimed control or guardrail is not demonstrated for the tested condition.
  evidence_patterns:
  - EVP-AUTH-01
  automation_level: automated
  assurance_level: A3
