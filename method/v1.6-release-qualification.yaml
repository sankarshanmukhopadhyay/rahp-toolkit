version: 1
release: v1.6.0
qualification: source-pinned-coverage-and-guided-adoption
stable_compatibility:
  engine_contract: rahp-engine-contract-v1
  normalized_result_schema: 1
  evidence_retention_contract: rahp-evidence-retention-v1
release_thesis: >-
  v1.6.0 makes scenario coverage more reproducible and adoption easier without
  changing the stable v1 engine, normalized-result or evidence-retention contracts.
required_capabilities:
  - source-pinned-scenario-corpora
  - coverage-accounting
  - dependent-corpus-recomposition
  - evidence-based-reassessment
  - guided-documentation-routing
required_evidence:
  trust_tasks_corpus: corpora/trust-tasks.yaml
  credential_spec_corpus: corpora/credential-spec.yaml
  composed_corpus: corpora/trust-tasks-credspec-composed.yaml
  reassessment: examples/cross-spec/trust-tasks-credspec/pressure-test.yaml
  prior_reassessment: examples/cross-spec/trust-tasks-credspec/history/pre-corpus-expansion-2026-08-23.yaml
  getting_started: docs/getting-started.md
  developer_guide: docs/developer-guide.md
  continuous_assurance: docs/continuous-assurance.md
  release_notes: docs/releases/v1.6.0.md
source_pins:
  trust_tasks: 4937c70df95e56ed6404b8c004106ecb121a23cf
  credential_spec: b89f389abbdae77ba60b673c0836c781c2b54169
coverage_expectations:
  total_corpora: 14
  total_scenarios: 182
  trust_tasks_scenarios: 30
  credential_spec_scenarios: 30
  composed_scenarios: 20
  portable_patterns: 28
historical_baseline_policy:
  promote_maintained_examples: false
  reason: >-
    A toolkit release does not by itself establish that a maintained target was
    reassessed. Existing v1.5 baselines remain valid until separately retested.
portable_invariants:
  - Portable core contracts remain deployment-independent.
  - Corpus growth broadens pressure coverage but does not itself establish assurance.
  - A component-level pass does not imply a composition-level pass.
  - Zero findings is not equivalent to assured.
  - Historical assessment records remain immutable lineage evidence.
qualification_commands:
  - python3 tools/validate_scenario_corpora.py
  - python3 tools/validate_pressure_tests.py
  - python3 tools/validate_documentation_ia.py
  - python3 tools/validate_engine_contract.py
  - python3 tools/validate_typescript_sdk.py
  - python3 tools/validate_v15_release.py
  - python3 tools/validate_v16_release.py
  - python3 -m unittest tests.test_v16_release_qualification
release_cut:
  butterfly_name_selection: random-at-release-time
  butterfly_source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selected_common_name: Common Earl
  selected_scientific_name: Tanaecia julii
  selected_on: '2026-08-23'
  tag: v1.6.0
  publish_only_after_qualification: true
  publication_workflow: .github/workflows/publish-qualified-release.yml
