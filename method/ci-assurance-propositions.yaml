id: rahp-ci-assurance-propositions-v1
version: 1
title: RAHP CI assurance propositions

propositions:
  python_typescript_conformance:
    title: Python-TypeScript reference conformance
    owner_workflow: .github/workflows/validate.yml
    classifier: tools/typescript_ci_impact.py
    repository_validator: tools/validate_ci_assurance.py
    conformance_validator: tools/validate_typescript_sdk.py
    conditional_events:
      - pull_request
      - push
    full_backstop_events:
      - schedule
      - workflow_dispatch
    release_workflow: .github/workflows/release.yml
    release_mode: unconditional
    fail_safe: required
    affected_paths:
      - packages/**
      - package.json
      - package-lock.json
      - requirements.txt
      - tools/validate_typescript_sdk.py
      - tools/typescript_ci_impact.py
      - tools/validate_ci_assurance.py
      - tools/engine_contract.py
      - tools/rahp.py
      - method/ci-assurance-propositions.yaml
      - method/engine-contract.yaml
      - method/evidence-retention.yaml
      - method/schema/rahp-result.schema.json
      - method/schema/rahp-config.schema.json
      - tests/test_ci_assurance.py
      - tests/conformance/**
      - tests/fixtures/portable-project/rahp.yaml
      - profiles/dtg/rahp.yaml
      - profiles/cawg/rahp.yaml
      - build/rahp.json
      - .github/workflows/validate.yml
      - .github/workflows/release.yml

  dtg_cross_spec:
    title: DTG cross-specification composition assurance
    owner_workflow: .github/workflows/validate.yml
    direct_workflow: .github/workflows/dtg-cross-spec-pressure-test.yml
    reusable_workflow: .github/workflows/cross-spec-pressure-test.yml
    registry: profiles/dtg/cross-spec-tests.yaml
    classifier: tools/dtg_cross_spec_ci_impact.py
    validator: tools/validate_dtg_cross_spec_ci.py
    conditional_events:
      - pull_request
      - push
    full_backstop_events:
      - schedule
      - workflow_dispatch
    fail_safe: all-compositions
    selection_granularity: composition

judgment: >-
  Proposition-sensitive execution decides whether a change can affect a declared
  assurance claim. It does not make assurance optional. Python-TypeScript
  uncertainty requires conformance; DTG Cross-Spec uncertainty expands to all
  maintained runnable compositions. Full validation remains a backstop.
