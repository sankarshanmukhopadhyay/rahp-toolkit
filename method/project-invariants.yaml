version: 1
contract: rahp-project-invariants-v1
invariants:
  - id: INV-PORTABLE-001
    title: Portable specification-assurance boundary
    proposition: >-
      RAHP Toolkit is a portable specification-assurance toolkit for pressure-testing
      standards, protocols, implementations and composed systems against human harms,
      governance failures, adversarial conditions and resilience risks.
    dependency_direction:
      allowed:
        - deployment-to-portable-core
        - corpus-to-portable-catalogue
        - example-to-portable-contract
      forbidden:
        - portable-core-to-deployment-profile
        - portable-contract-to-ecosystem-governance-state
    portable_core_files:
      - method/engine-contract.yaml
      - method/lifecycle.yaml
      - method/evidence-retention.yaml
      - method/catalogue/assurance-patterns.yaml
      - method/catalogue/control-patterns.yaml
      - method/catalogue/evidence-patterns.yaml
      - method/catalogue/guardrail-patterns.yaml
      - method/catalogue/harm-patterns.yaml
      - method/catalogue/risk-patterns.yaml
      - tools/rahp.py
      - tools/review.py
      - tools/validate_engine_contract.py
      - method/schema/rahp-config.schema.json
    prohibited_core_tokens:
      - profiles/dtg/
      - profiles/cawg/
      - instances/dtg/
      - instances/cawg/
      - dtg-portfolio-monitor
      - trustoverip/dtgwg-
      - sankarshanmukhopadhyay/dtg-
    portability_fixtures:
      - tests/fixtures/portable-project/rahp.yaml
      - tests/fixtures/portable-implementation/rahp.yaml
    stripped_core:
      remove_paths:
        - profiles
        - instances
        - corpora
        - examples
      commands:
        - python3 tools/validate_portability.py --root {root}
    required_target_classes:
      specification:
        evidence: tests/fixtures/portable-project/rahp.yaml
        marker: specification
      protocol:
        evidence: tests/fixtures/portable-project/rahp.yaml
        marker: protocol
      implementation:
        evidence: tests/fixtures/portable-implementation/rahp.yaml
        marker: implementation
      composed-system:
        evidence: docs/cross-spec-pressure-testing.md
        marker: first-class test surface
    required_pressure_dimensions:
      human-harms:
        evidence: method/catalogue/harm-patterns.yaml
        marker: HRM-
      governance-failures:
        evidence: method/catalogue/harm-patterns.yaml
        marker: HRM-GOV-
      adversarial-conditions:
        evidence: tests/test_false_independence_corpus_qualification.py
        marker: FalseIndependenceCorpusQualificationTests
      resilience-risks:
        evidence: tools/validate_resilience.py
        marker: DRARM

  - id: INV-CONSUMER-INDEPENDENCE-001
    title: Portable core consumer independence
    proposition: >-
      Consumer-specific profiles, deployments and reference programmes may consume and
      exercise portable RAHP contracts, but consumer-specific vocabulary, paths, schemas,
      governance state and runtime assumptions must not become dependencies of the
      authoritative portable core.
    dependency_direction:
      allowed:
        - consumer-to-portable-core
        - consumer-profile-to-portable-contract
        - consumer-evidence-to-portable-evidence-contract
      forbidden:
        - portable-core-to-consumer-profile
        - portable-core-to-consumer-instance
        - portable-core-to-consumer-schema
        - portable-core-to-consumer-governance-state
    portable_core_roots:
      - method/schema
      - method/glossary
      - method/resilience
      - packages/core
      - packages/schema
    portable_core_files:
      - tools/rahp.py
      - tools/review.py
      - tools/assessment_controller.py
      - tools/autonomous_assurance_controller.py
      - tools/assessor_contract.py
      - tools/assurance.py
      - tools/assurance_fsm.py
      - tools/assurance_invariants.py
      - tools/assurance_obligation.py
      - tools/assurance_posture.py
      - tools/assurance_record.py
      - tools/assurance_state.py
      - tools/validate_engine_contract.py
    scan_extensions:
      - .py
      - .ts
      - .json
      - .yaml
      - .yml
      - .md
    excluded_paths: []
    prohibited_consumer_tokens:
      - profiles/dtg/
      - instances/dtg/
      - dtg_
      - dtg-
      - trustoverip/dtgwg-
      - profiles/cawg/
      - instances/cawg/
      - cawg_
      - cawg-
      - c2pa
      - vti_
      - vti-
      - profiles/a2a/
      - instances/a2a/
      - profiles/arpa/
      - instances/arpa/
    negative_fixture:
      source: tests/fixtures/project-invariants/consumer-dependency-leak.yaml
      inject_as: method/synthetic-consumer-dependency.yaml
      expected_token: profiles/dtg/
