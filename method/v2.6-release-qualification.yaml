release_thesis: >-
  v2.6.0 packages the post-v2.5 stable work as an additive RAHP capability:
  process completion, assurance outcome, and evidence maturity are independently
  observable; every material assurance lens receives an explicit disposition;
  and every required evidence obligation receives an attributable attempt state,
  without broadening missing evidence into PASS or changing the stable
  engine/result/evidence compatibility families.
