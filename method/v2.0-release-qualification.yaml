release_thesis: >-
  v2.0.0 marks the product-level stabilization boundary at which portfolio-specific
  vocabulary and change patterns are normalized through instance adapters/profiles,
  specialist assessors return finite portable results, clean-room isolation is engine-owned,
  and multiple materially different portfolio snapshots execute without routine RAHP-core
  modification.
