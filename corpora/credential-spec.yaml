corpus:
  id: CORPUS-DTG-CREDSPEC
  title: DTG Credential Specification scenario corpus
  source_repository: trustoverip/dtgwg-cred-spec
  source_path: spec/body.md
  source_commit: b89f389abbdae77ba60b673c0836c781c2b54169
  adapter_version: '1.1'
  description: Source-pinned scenario adapter derived from the DTG Core Credentials specification, emphasizing credential lifecycle, relationship semantics, privacy, registry authority, task context, constrained authority, evidence closure and interoperability.
  scenarios:
  - id: CS-001
    title: Incomplete bidirectional edge is interpreted as a complete relationship
    domain: Credentials / relationships
    primary_goal: Require both directions when claiming a complete DTG edge
    primary_pressure: Partial relationship semantics
    priority: P0
    scenario_patterns: [SP-COMP-01, SP-INTEROP-01]
    source_anchor: spec/body.md#edge-credentials
  - id: CS-002
    title: R-DID reuse enables cross-relationship correlation
    domain: Credentials / privacy
    primary_goal: Preserve pairwise relationship unlinkability
    primary_pressure: Identifier reuse
    priority: P0
    scenario_patterns: [SP-PRIV-01]
    source_anchor: spec/body.md#unilateral-relationship-identification
  - id: CS-003
    title: Selective disclosure leaks relationship structure through metadata
    domain: Credentials / privacy
    primary_goal: Minimize correlation beyond disclosed predicates
    primary_pressure: Metadata correlation
    priority: P0
    scenario_patterns: [SP-PRIV-01, SP-PRIV-02]
    source_anchor: spec/body.md#pairwise-zero-knowledge-proof
  - id: CS-004
    title: Credential remains cryptographically valid after issuer authority changes
    domain: Credentials / governance
    primary_goal: Distinguish proof validity from current issuer authority
    primary_pressure: Authority lifecycle
    priority: P0
    scenario_patterns: [SP-GOV-01, SP-OPS-01]
    source_anchor: spec/body.md#trust-registries
  - id: CS-005
    title: Verifier cannot resolve current revocation or governance state
    domain: Credentials / operations
    primary_goal: Handle unavailable status and registry dependencies safely
    primary_pressure: Stale authority state
    priority: P0
    scenario_patterns: [SP-OPS-01, SP-GOV-01]
    source_anchor: spec/body.md#trust-registries
  - id: CS-006
    title: VC v1.1 and v2.0 implementations disagree on equivalent credential semantics
    domain: Credentials / interoperability
    primary_goal: Maintain consistent meaning across VC data-model versions
    primary_pressure: Version migration
    priority: P1
    scenario_patterns: [SP-INTEROP-01, SP-CRYPTO-01]
    source_anchor: spec/body.md#w3c-verifiable-credentials-version-support
  - id: CS-007
    title: taskContext is treated as proof that a Trust Task completed
    domain: Credentials / Trust Tasks
    primary_goal: Separate context binding from outcome evidence
    primary_pressure: Context overclaim
    priority: P0
    scenario_patterns: [SP-COMP-01, SP-INTEROP-01]
    source_anchor: spec/body.md#trust-task-context-binding
  - id: CS-008
    title: Outcome evidence referenced by taskContext is unavailable
    domain: Credentials / lifecycle
    primary_goal: Keep contextual credential meaning verifiable later
    primary_pressure: Dependency availability
    priority: P0
    scenario_patterns: [SP-OPS-01, SP-GOV-02]
    source_anchor: spec/body.md#outcome-interpretability
  - id: CS-009
    title: Witness credential is bound to the wrong edge direction
    domain: Credentials / witnessing
    primary_goal: Prevent directional misbinding in witnessed relationships
    primary_pressure: Edge misbinding
    priority: P0
    scenario_patterns: [SP-AUTH-01, SP-COMP-01]
    source_anchor: spec/body.md#vwc-verifiable-witness-credential
  - id: CS-010
    title: Invitation credential is replayed or reused outside intended scope
    domain: Credentials / invitation
    primary_goal: Prevent stale or duplicate invitation use
    primary_pressure: Invitation replay
    priority: P0
    scenario_patterns: [SP-REPLAY-01]
    source_anchor: spec/body.md#vic-verifiable-invitation-credential
  - id: CS-011
    title: Personhood hint is treated as authoritative assurance
    domain: Credentials / personhood
    primary_goal: Keep governance-derived personhood separate from type hints
    primary_pressure: Assurance overclaim
    priority: P0
    scenario_patterns: [SP-GOV-01, SP-INTEROP-01]
    source_anchor: spec/body.md#personhood-credentials-phc
  - id: CS-012
    title: Community-anchored proof creates cross-context linkability
    domain: Credentials / privacy
    primary_goal: Preserve privacy when community assurance is disclosed
    primary_pressure: Community correlation
    priority: P1
    scenario_patterns: [SP-PRIV-01, SP-PRIV-02]
    source_anchor: spec/body.md#community-anchored-zero-knowledge-proof
  - id: CS-013
    title: Credential proof suite migration creates downgrade ambiguity
    domain: Credentials / crypto
    primary_goal: Migrate proof suites without weakening verification
    primary_pressure: Cryptographic agility
    priority: P1
    scenario_patterns: [SP-CRYPTO-01, SP-INTEROP-01]
    source_anchor: spec/body.md#w3c-verifiable-credentials-version-support
  - id: CS-014
    title: Shared device or copied credential is mistaken for holder control
    domain: Credentials / holder binding
    primary_goal: Separate possession from legitimate subject/holder control
    primary_pressure: Controller compromise
    priority: P0
    scenario_patterns: [SP-AUTH-01, SP-RECOV-01]
    source_anchor: spec/body.md#security-considerations
  - id: CS-015
    title: Accessibility-dependent presentation path excludes a legitimate holder
    domain: Credentials / inclusion
    primary_goal: Preserve credential usability across accessibility needs
    primary_pressure: Accessibility exclusion
    priority: P1
    scenario_patterns: [SP-INCL-01, SP-INCL-02]
    source_anchor: spec/body.md#accessibility-considerations
  - id: CS-016
    title: Cross-community policy differences yield inconsistent credential acceptance
    domain: Credentials / federation
    primary_goal: Make trust-domain recognition differences explicit
    primary_pressure: Recognition conflict
    priority: P1
    scenario_patterns: [SP-FED-01, SP-GOV-02]
    source_anchor: spec/body.md#governance-considerations
  - id: CS-017
    title: VWC digest verifies but the referenced VRC is unavailable
    domain: Credentials / witnessing
    primary_goal: Require edge evidence needed to interpret an otherwise opaque digest
    primary_pressure: Opaque digest overclaim
    priority: P0
    scenario_patterns: [SP-COMP-01, SP-OPS-01]
    source_anchor: spec/body.md#vwc-verifiable-witness-credential
  - id: CS-018
    title: VWC digest is treated as hiding confidential low-entropy relationship data
    domain: Credentials / privacy
    primary_goal: Keep integrity binding distinct from confidentiality
    primary_pressure: Digest confidentiality overclaim
    priority: P0
    scenario_patterns: [SP-PRIV-01, SP-CRYPTO-01]
    source_anchor: spec/body.md#security-considerations
  - id: CS-019
    title: Credential is within validFrom/validUntil but the governing issuer is no longer authorized
    domain: Credentials / governance
    primary_goal: Require current issuer authorization independently of cryptographic validity
    primary_pressure: Current-authority separation
    priority: P0
    scenario_patterns: [SP-GOV-01, SP-AUTH-01]
    source_anchor: spec/body.md#security-considerations
  - id: CS-020
    title: Historical verifier applies current trust-registry state to a past credential decision
    domain: Credentials / lifecycle
    primary_goal: Distinguish current verification from as-of historical authority
    primary_pressure: Historical-state collapse
    priority: P1
    scenario_patterns: [SP-OPS-01, SP-GOV-01]
    source_anchor: spec/body.md#trust-registries
  - id: CS-021
    title: Superseded relationship evidence remains accepted alongside newer contradictory evidence
    domain: Credentials / lifecycle
    primary_goal: Define relying behavior when valid credential artifacts conflict across time
    primary_pressure: Supersession ambiguity
    priority: P0
    scenario_patterns: [SP-COMP-01, SP-OPS-01]
    source_anchor: spec/body.md#governance-considerations
  - id: CS-022
    title: Revocation, suspension and expiry are flattened into one terminal interpretation
    domain: Credentials / lifecycle
    primary_goal: Preserve materially different lifecycle meanings where governance depends on them
    primary_pressure: Lifecycle-state flattening
    priority: P1
    scenario_patterns: [SP-GOV-01, SP-INTEROP-01]
    source_anchor: spec/body.md#security-considerations
  - id: CS-023
    title: Restored authority cannot be distinguished from a new appointment or relationship
    domain: Credentials / lifecycle
    primary_goal: Preserve restoration semantics and retained history without overclaim
    primary_pressure: Restoration ambiguity
    priority: P1
    scenario_patterns: [SP-GOV-01, SP-COMP-01]
    source_anchor: spec/body.md#governance-considerations
  - id: CS-024
    title: Valid representative credential is interpreted as proof that the principal lacks retained authority
    domain: Credentials / constrained authority
    primary_goal: Prevent representative evidence from becoming an incapacity or rights-waiver signal
    primary_pressure: Retained-agency inference
    priority: P0
    scenario_patterns: [SP-AUTH-01, SP-GOV-03]
    source_anchor: spec/body.md#governance-considerations
  - id: CS-025
    title: Credential scope is sufficient for appointment but not for the specific transaction
    domain: Credentials / constrained authority
    primary_goal: Separate standing relationship evidence from transaction permission
    primary_pressure: Appointment-permission conflation
    priority: P0
    scenario_patterns: [SP-AUTH-01, SP-COMP-01]
    source_anchor: spec/body.md#security-considerations
  - id: CS-026
    title: Status or trust-registry lookup becomes a durable observer of sensitive relationship verification
    domain: Credentials / privacy
    primary_goal: Evaluate privacy of external status dependencies as part of presentation closure
    primary_pressure: Status-observer leakage
    priority: P0
    scenario_patterns: [SP-PRIV-01, SP-PRIV-02]
    source_anchor: spec/body.md#privacy-considerations
  - id: CS-027
    title: Individually unlinkable credential proofs share a stable task or relationship handle
    domain: Credentials / privacy
    primary_goal: Evaluate unlinkability across the complete composed presentation
    primary_pressure: Cross-artifact correlation
    priority: P0
    scenario_patterns: [SP-PRIV-01, SP-COMP-01]
    source_anchor: spec/body.md#zero-knowledge-and-selective-disclosure
  - id: CS-028
    title: Credential issuer and subject identifiers are valid but mapped to the wrong governance role
    domain: Credentials / authority
    primary_goal: Bind cryptographic identities to the role semantics required by the decision
    primary_pressure: Role-binding failure
    priority: P0
    scenario_patterns: [SP-AUTH-01, SP-GOV-01]
    source_anchor: spec/body.md#base-structure
  - id: CS-029
    title: Cross-domain verifier treats locally recognized membership or personhood as globally equivalent
    domain: Credentials / federation
    primary_goal: Prevent governance-local assurance from becoming universal semantics
    primary_pressure: Assurance portability overclaim
    priority: P1
    scenario_patterns: [SP-FED-01, SP-GOV-02]
    source_anchor: spec/body.md#community-anchored-zero-knowledge-proof
  - id: CS-030
    title: All presented credentials verify but the evidence set does not establish the relying-party proposition
    domain: Credentials / composition
    primary_goal: Require evidence closure rather than credential-by-credential validity
    primary_pressure: Incomplete evidence closure
    priority: P0
    scenario_patterns: [SP-COMP-01, SP-AUTH-01]
    source_anchor: spec/body.md#security-considerations
  coverage:
    identity_authority: [CS-004, CS-011, CS-014, CS-019, CS-024, CS-025, CS-028]
    lifecycle: [CS-004, CS-005, CS-008, CS-019, CS-020, CS-021, CS-022, CS-023]
    replay_freshness: [CS-005, CS-008, CS-010, CS-019, CS-020]
    privacy_correlation: [CS-002, CS-003, CS-012, CS-018, CS-026, CS-027]
    constrained_authority: [CS-024, CS-025, CS-028, CS-030]
    evidence_closure: [CS-007, CS-008, CS-009, CS-017, CS-030]
    federation_recognition: [CS-011, CS-016, CS-029]
    interoperability: [CS-001, CS-006, CS-013, CS-016, CS-022, CS-028]
    inclusion_recovery: [CS-014, CS-015]
  source_url: https://github.com/trustoverip/dtgwg-cred-spec
  source_branch: main
  provenance_status: source-pinned
  provenance_note: Reviewed against the immutable Credential Specification source commit on 2026-08-23. Scenarios distinguish cryptographic validity, governance authority, lifecycle state and relying-party evidence closure.
