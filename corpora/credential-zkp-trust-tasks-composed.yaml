corpus:
  id: CORPUS-CRED-ZKP-TT-COMPOSED
  title: "DTG Credential Specification × ZKP × Trust Tasks composed scenario corpus"
  source_repository: trustoverip/dtgwg-cred-spec + trustoverip/dtgwg-zkp-tf + trustoverip/dtgwg-trust-tasks-spec
  source_path: spec/body.md + proof-of-liveness-requirements.md + Trust Tasks Framework v0.5.0 normative specification
  source_commit: derived-from-pinned-dependencies
  adapter_version: '1.0'
  description: >-
    RAHP-authored P0 cross-specification scenarios for the complete credential/proof/task execution seam. These scenario IDs are RAHP assessment artefacts, not upstream identifiers.
  evidence_grade: source-pinned
  depends_on:
    - corpus_id: CORPUS-DTG-CREDSPEC
      source_commit: b89f389abbdae77ba60b673c0836c781c2b54169
    - corpus_id: CORPUS-DTG-ZKP
      source_commit: 3b6b3f2e76005d6f579d076ee2833ef56d599b65
    - corpus_id: CORPUS-TRUST-TASKS
      source_commit: 6425a74136c1d2dfa7115889abe0b3521700e887
  assurance_catalogue: method/catalogue/
  scenarios:
    - id: XSP-CZT-001
      title: Valid credential and proof survive authority revocation before task effect
      domain: Cross-spec / authority
      primary_goal: Re-evaluate authoritative mandate state immediately before consequential execution
      primary_pressure: Proof-validity versus action-time authority
      priority: P0
      scenario_patterns: [SP-AUTH-02, SP-COMP-01, SP-DEL-01]
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
    - id: XSP-CZT-002
      title: Private credential proof is wrapped in reused or public task correlation handles
      domain: Cross-spec / privacy
      primary_goal: Preserve the privacy claim across the entire task wrapper
      primary_pressure: Wrapper re-linkability
      priority: P0
      scenario_patterns: [SP-PRIV-01, SP-COMP-01]
      portable_assurance:
        harm_patterns: [HRM-PRV-02, HRM-PRV-05, HRM-GOV-02]
        risk_patterns: [RKP-COMP-03, RKP-GOV-04]
        control_patterns: [CTP-PRV-02, CTP-GOV-03]
        guardrail_patterns: [GRP-PRV-01, GRP-RED-01]
        assurance_patterns: [ATP-PRV-01, ATP-RED-01]
        evidence_patterns: [EVP-PRV-01, EVP-RED-01]
    - id: XSP-CZT-003
      title: Fresh proof is combined with stale credential or authority status
      domain: Cross-spec / lifecycle
      primary_goal: Keep proof freshness separate from credential and authority freshness
      primary_pressure: Freshness-domain confusion
      priority: P0
      scenario_patterns: [SP-GOV-01, SP-COMP-02]
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
    - id: XSP-CZT-004
      title: Successful transport delivery is interpreted as successful task execution
      domain: Cross-spec / execution
      primary_goal: Preserve explicit lifecycle state and outcome semantics
      primary_pressure: State inference from transport
      priority: P0
      scenario_patterns: [SP-COMP-01, SP-OPS-01]
      portable_assurance:
        harm_patterns: [HRM-INF-01, HRM-SEC-02, HRM-ECO-02]
        risk_patterns: [RKP-OPS-02, RKP-COMP-01]
        control_patterns: [CTP-OPS-02, CTP-COMP-01]
        guardrail_patterns: [GRP-OPS-01, GRP-COMP-01]
        assurance_patterns: [ATP-OPS-02, ATP-COMP-01]
        evidence_patterns: [EVP-OPS-02, EVP-COMP-01]
    - id: XSP-CZT-005
      title: Duplicate consequential task reuses otherwise valid credential and proof
      domain: Cross-spec / replay
      primary_goal: Enforce one logical effect across retries and duplicates
      primary_pressure: Composite replay
      priority: P0
      scenario_patterns: [SP-REPLAY-01, SP-OPS-02, SP-COMP-01]
      portable_assurance:
        harm_patterns: [HRM-INF-01, HRM-SEC-02, HRM-ECO-02]
        risk_patterns: [RKP-OPS-02, RKP-COMP-01]
        control_patterns: [CTP-OPS-02, CTP-COMP-01]
        guardrail_patterns: [GRP-OPS-01, GRP-COMP-01]
        assurance_patterns: [ATP-OPS-02, ATP-COMP-01]
        evidence_patterns: [EVP-OPS-02, EVP-COMP-01]
    - id: XSP-CZT-006
      title: Pairwise parties remain correlatable through ceremony or retained evidence
      domain: Cross-spec / privacy
      primary_goal: Test privacy over composed retained evidence rather than identifier choice alone
      primary_pressure: Retained-evidence correlation
      priority: P0
      scenario_patterns: [SP-PRIV-02, SP-COMP-01]
      portable_assurance:
        harm_patterns: [HRM-PRV-02, HRM-PRV-05, HRM-GOV-02]
        risk_patterns: [RKP-COMP-03, RKP-GOV-04]
        control_patterns: [CTP-PRV-02, CTP-GOV-03]
        guardrail_patterns: [GRP-PRV-01, GRP-RED-01]
        assurance_patterns: [ATP-PRV-01, ATP-RED-01]
        evidence_patterns: [EVP-PRV-01, EVP-RED-01]
    - id: XSP-CZT-007
      title: Proof validity is interpreted as authorization or task completion
      domain: Cross-spec / non-inference
      primary_goal: Keep proof, authorization, execution and outcome as separate propositions
      primary_pressure: Semantic upgrading
      priority: P0
      scenario_patterns: [SP-COMP-01, SP-AUTH-01]
      portable_assurance:
        harm_patterns: [HRM-SEC-02, HRM-INF-01, HRM-AUT-04, HRM-GOV-02]
        risk_patterns: [RKP-COMP-01, RKP-AUTH-02]
        control_patterns: [CTP-COMP-01, CTP-AUTH-02]
        guardrail_patterns: [GRP-COMP-01, GRP-AUTH-02]
        assurance_patterns: [ATP-COMP-01, ATP-AUTH-02]
        evidence_patterns: [EVP-COMP-01, EVP-AUTH-01]
