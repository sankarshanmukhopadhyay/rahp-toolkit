authority:
  repository: trustoverip/dtgwg-zkp-spec
  commit: cfd94063e5cfee7ba6df4dcfd28c10399a0ffd0a
  role: specification-and-conformance
reviewed_paths:
  - spec/intro.md
  - spec/implementation-guide.md
  - spec/integration.md
  - spec/trust-graph.md
  - conformance/records/001.json
  - conformance/records/002.json
  - conformance/records/003.json
  - conformance/records/004.json
  - conformance/records/005.json
  - conformance/records/006.json
  - conformance/records/007.json
  - conformance/records/008.json
  - conformance/records/009.json
  - conformance/records/010.json
