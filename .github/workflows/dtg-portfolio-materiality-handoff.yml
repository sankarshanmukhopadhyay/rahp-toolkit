name: Consume DTG Portfolio Monitor assurance signals

on:
  schedule:
    # Portfolio Monitor collects at 00:17 and 12:17 UTC. Allow collection/publish time.
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      assessment_lineage:
        description: Optional fresh lineage discriminator for clean-room execution
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtg-portfolio-materiality-handoff.yml'
      - 'tools/fetch_dtg_portfolio_snapshot.py'
      - 'tools/dtg_portfolio_routing.py'
      - 'tools/publish_assessment_issues.py'
      - 'tools/dtg_portfolio_baseline.py'
      - 'instances/dtg/baselines/current.yaml'
      - 'instances/dtg/assurance-routing.yaml'
      - 'instances/dtg/finding-normalization.yaml'
      - 'tools/finding_model.py'
      - 'method/schema/normalized-finding.schema.json'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: dtg-portfolio-materiality-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Resolve explicit portfolio baseline lineage
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          lineage='${{ inputs.assessment_lineage || '' }}'
          if [ -z "$lineage" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            target='instances/dtg/baselines/current.yaml'
            before='${{ github.event.before }}'
            zero='0000000000000000000000000000000000000000'
            if [ -n "$before" ] && [ "$before" != "$zero" ]; then
              git fetch --no-tags --depth=1 origin "$before"
              if git diff --name-only "$before" "$GITHUB_SHA" -- "$target" | grep -Fxq "$target"; then
                python3 tools/dtg_portfolio_baseline.py --self-test
                lineage="$(python3 tools/dtg_portfolio_baseline.py "$target" --field lineage)"
              fi
            fi
          fi
          echo "lineage=$lineage" >> "$GITHUB_OUTPUT"
          if [ -n "$lineage" ]; then
            echo "Using explicit assessment lineage: $lineage"
          else
            echo "No explicit lineage; using normal snapshot/date-scoped controller identity."
          fi

      - name: Validate Portfolio Monitor snapshot fetch contract
        run: python3 tools/fetch_dtg_portfolio_snapshot.py --self-test

      - name: Validate assessment issue ownership contract
        run: python3 tools/publish_assessment_issues.py --self-test

      - name: Fetch newest recent Portfolio Monitor snapshot
        id: snapshot
        run: >-
          python3 tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2
          --output build/dtg-routing/findings.json

      - name: Validate and execute machine-readable assurance routing
        run: |
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --normalization-policy instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ steps.baseline.outputs.lineage }}' \
            --self-test
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --normalization-policy instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ steps.baseline.outputs.lineage }}'

      - name: Build portfolio controller event
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          route = json.loads(pathlib.Path('build/dtg-routing/routing.json').read_text())
          unresolved = json.loads(pathlib.Path('build/dtg-routing/unresolved.json').read_text())
          counts = {}
          for item in route:
              counts[item['outcome']] = counts.get(item['outcome'], 0) + 1
          day = '${{ steps.snapshot.outputs.date }}'
          source_url = '${{ steps.snapshot.outputs.url }}'
          lineage = '${{ steps.baseline.outputs.lineage }}'.strip()
          controller_key = f'dtg:portfolio:material-change-set:{day}'
          if lineage:
              controller_key += f':lineage:{lineage}'
          lines = [
              '# DTG Portfolio Monitor → RAHP assurance controller',
              '',
              f'<!-- rahp-assessment-key:{controller_key} -->',
              *([f'<!-- rahp-clean-room-lineage:{lineage} -->'] if lineage else []),
              f'<!-- rahp-portfolio-snapshot:{day} -->',
              '<!-- dtg-routing-policy:v3-semantic -->',
              '',
              'RAHP consumed the newest recent Portfolio Monitor snapshot, normalized source findings through the DTG instance adapter, and applied semantic assurance routing.',
              '',
              '## Proposition',
              '',
              'Do the current material DTG changes alter assurance conclusions, require a registered RAHP composition, require a bounded RAHP/security review, or require DPIP examination of composed privacy behaviour?',
              '',
              '## Routing evidence',
              '',
              f'- Portfolio snapshot: {source_url}',
              f'- Snapshot date: `{day}`',
              f'- Qualifying findings: **{len(route)}**',
              f'- Dispositions: `{counts}`',
              f'- UNMAPPED findings: **{len(unresolved)}**',
              '',
          ]
          if unresolved:
              lines.extend([
                  '### UNMAPPED finding identities',
                  '',
                  'These qualifying findings were not semantically routed by the current policy. They remain explicit assurance obligations until dispositioned or transferred to a durable owner.',
                  '',
              ])
              for item in unresolved:
                  finding_id = item.get('finding_id', 'unknown')
                  repository = item.get('repository', 'unknown')
                  title = item.get('title', '(untitled finding)')
                  evidence_urls = item.get('evidence_urls') or []
                  lines.append(f'- `{finding_id}` — **{repository}**: {title}')
                  for evidence_url in evidence_urls:
                      lines.append(f'  - Evidence: {evidence_url}')
              lines.append('')
          lines.extend([
              '## Pipeline contract',
              '',
              'Portfolio Monitor detects/classifies. RAHP owns assurance routing and RAHP assessments. Privacy-relevant findings are promoted through the canonical RAHP → DPIP transport. DPIP owns applicability/evidence/privacy conclusion and returns the disposition to RAHP.',
              '',
              'Controller records are snapshot/epoch scoped. Re-publication of the same snapshot is idempotent; a later snapshot receives a new controller key. Bounded child reviews resolve to durable proposition owners across observations and issue lifecycle state.',
              '',
              '## Closure rule',
              '',
              'Do not close this controller while any routed RAHP review, DPIP referral, or UNMAPPED qualifying finding from this epoch remains outstanding unless ownership has been explicitly transferred to a durable successor. Unknown semantics remain explicit rather than being silently dropped.',
          ])
          body = '\n'.join(lines) + '\n'
          event = {
              'assessment_key': controller_key,
              'observed_at': day,
              'source': 'dtg-portfolio-monitor',
              'title': f'DTG portfolio materiality assessment required — {day}',
              'labels': ['assessment-required', 'dtg-instance', 'cross-specification'],
              'affected_reviews': ['rahp', 'security', 'combined'],
              'body': body,
          }
          pathlib.Path('build/dtg-routing/controller-events.json').write_text(json.dumps([event], indent=2) + '\n')
          PY

      - name: Publish or coalesce portfolio controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/controller-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/controller-result.json

      - name: Publish or coalesce bounded combined RAHP reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/combined-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/combined-result.json

      - name: Publish or coalesce canonical RAHP privacy referrals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/dpip-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/dpip-result.json

      - name: Transport qualified privacy referrals to DPIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: |
          python3 tools/dpip_handoff.py --self-test
          issue_args=()
          if [ -s build/dtg-routing/dpip-result.json ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              issue_args+=(--issue-number "$number")
            done < <(jq -r '.issues[]? | select(.action == "created" or .action == "coalesced" or .action == "reopened") | .number // empty' build/dtg-routing/dpip-result.json)
          fi
          if [ "${#issue_args[@]}" -gt 0 ]; then
            python3 tools/dpip_handoff.py "${issue_args[@]}"
          else
            echo 'No active/new RAHP privacy referral requires DPIP transport.'
          fi

      - name: Dispatch registered DTG cross-specification pressure tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -s build/dtg-routing/compositions.txt ]; then
            echo 'No registered cross-spec composition was implicated.'
            exit 0
          fi
          lineage='${{ steps.baseline.outputs.lineage }}'
          while IFS= read -r composition; do
            [ -n "$composition" ] || continue
            echo "Dispatching RAHP DTG pressure test via generic executor: $composition"
            args=(
              -f registry_path="profiles/dtg/cross-spec-tests.yaml"
              -f composition_id="$composition"
              -f composition_scoped_registry_validation=true
            )
            if [ -n "$lineage" ]; then
              args+=(-f assessment_lineage="$lineage")
            fi
            gh workflow run cross-spec-pressure-test.yml --ref main "${args[@]}"
          done < build/dtg-routing/compositions.txt

      - name: Retain portfolio routing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dtg-portfolio-routing-${{ steps.snapshot.outputs.date }}-${{ steps.baseline.outputs.lineage || 'date-scoped' }}
          path: |
            build/dtg-routing/findings.json
            build/dtg-routing/routing.json
            build/dtg-routing/unresolved.json
            build/dtg-routing/compositions.txt
            build/dtg-routing/controller-events.json
            build/dtg-routing/controller-result.json
            build/dtg-routing/combined-events.json
            build/dtg-routing/combined-result.json
            build/dtg-routing/dpip-events.json
            build/dtg-routing/dpip-result.json
          if-no-files-found: error

      - name: Publish routing summary
        if: always()
        shell: bash
        run: |
          echo '## DTG Portfolio Monitor → RAHP → DPIP pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot: `${{ steps.snapshot.outputs.date }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot age: `${{ steps.snapshot.outputs.age_days || 'unknown' }}` day(s)' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.baseline.outputs.lineage }}" ]; then
            echo '- Clean-room lineage: `${{ steps.baseline.outputs.lineage }}`' >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r 'group_by(.outcome) | map("- " + .[0].outcome + ": " + (length|tostring)) | .[]' build/dtg-routing/routing.json >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s build/dtg-routing/unresolved.json ] && [ "$(jq length build/dtg-routing/unresolved.json)" -gt 0 ]; then
            echo '- UNMAPPED qualifying findings remain visible in routing output.' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "  - `\(.finding_id)` \(.repository): \(.title)"' build/dtg-routing/unresolved.json >> "$GITHUB_STEP_SUMMARY"
          fi
