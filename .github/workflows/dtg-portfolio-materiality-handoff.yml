name: Consume DTG Portfolio Monitor assurance signals

on:
  schedule:
    # Portfolio Monitor collects at 00:17 and 12:17 UTC. Allow collection/publish time.
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      assessment_lineage:
        description: Optional fresh lineage discriminator for clean-room execution
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/dtg-portfolio-materiality-handoff.yml'
      - 'tools/dtg_portfolio_routing.py'
      - 'instances/dtg/assurance-routing.yaml'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: dtg-portfolio-materiality-handoff
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Fetch current Portfolio Monitor snapshot
        id: snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          from datetime import datetime, timezone
          day = datetime.now(timezone.utc).date().isoformat()
          year, month, date = day.split('-')
          url = ('https://raw.githubusercontent.com/sankarshanmukhopadhyay/'
                 f'dtg-portfolio-monitor/main/data/findings/{year}/{month}/{date}.json')
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  findings = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(f'Expected Portfolio Monitor snapshot is missing: {url}') from exc
              raise
          if not isinstance(findings, list):
              raise SystemExit('Portfolio Monitor findings snapshot must be a JSON array')
          build = pathlib.Path('build/dtg-routing')
          build.mkdir(parents=True, exist_ok=True)
          (build / 'findings.json').write_text(json.dumps(findings, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'date={day}\n')
              out.write(f'url={url}\n')
          print(f'Fetched {len(findings)} findings from {url}')
          PY

      - name: Validate and execute machine-readable assurance routing
        run: |
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ inputs.assessment_lineage || '' }}' \
            --self-test
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ inputs.assessment_lineage || '' }}'

      - name: Build portfolio controller event
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          route = json.loads(pathlib.Path('build/dtg-routing/routing.json').read_text())
          unresolved = json.loads(pathlib.Path('build/dtg-routing/unresolved.json').read_text())
          counts = {}
          for item in route:
              counts[item['outcome']] = counts.get(item['outcome'], 0) + 1
          day = '${{ steps.snapshot.outputs.date }}'
          source_url = '${{ steps.snapshot.outputs.url }}'
          lineage = '${{ inputs.assessment_lineage || '' }}'.strip()
          lines = [
              '# DTG Portfolio Monitor → RAHP assurance controller',
              '',
              f"<!-- rahp-assessment-key:{'dtg:portfolio:material-change-set:lineage:' + lineage if lineage else 'dtg:portfolio:material-change-set'} -->",
              *([f'<!-- rahp-clean-room-lineage:{lineage} -->'] if lineage else []),
              f'<!-- rahp-portfolio-snapshot:{day} -->',
              '<!-- dtg-routing-policy:v2 -->',
              '',
              'RAHP consumed the current Portfolio Monitor snapshot and applied the versioned assurance-routing policy.',
              '',
              '## Proposition',
              '',
              'Do the current material DTG changes alter assurance conclusions, require a registered RAHP composition, require a bounded RAHP/security review, or require DPIP examination of composed privacy behaviour?',
              '',
              '## Routing evidence',
              '',
              f'- Portfolio snapshot: {source_url}',
              f'- Snapshot date: `{day}`',
              f'- Qualifying findings: **{len(route)}**',
              f'- Dispositions: `{counts}`',
              f'- Unresolved findings: **{len(unresolved)}**',
              '',
              '## Pipeline contract',
              '',
              'Portfolio Monitor detects/classifies. RAHP owns assurance routing and RAHP assessments. Privacy-relevant findings are promoted through the canonical RAHP → DPIP transport. DPIP owns applicability/evidence/privacy conclusion and returns the disposition to RAHP.',
              '',
              '## Closure rule',
              '',
              'Do not close this controller while any routed RAHP review, DPIP referral, or unresolved qualifying finding remains outstanding. Unknown findings remain explicit rather than being silently dropped.',
          ]
          body = '\n'.join(lines) + '\n'
          event = {
              'assessment_key': ('dtg:portfolio:material-change-set:lineage:' + lineage) if lineage else 'dtg:portfolio:material-change-set',
              'observed_at': day,
              'source': 'dtg-portfolio-monitor',
              'title': f'DTG portfolio materiality assessment required — {day}',
              'labels': ['assessment-required', 'dtg-instance', 'cross-specification'],
              'affected_reviews': ['rahp', 'security', 'combined'],
              'body': body,
          }
          pathlib.Path('build/dtg-routing/controller-events.json').write_text(json.dumps([event], indent=2) + '\n')
          PY

      - name: Publish or coalesce portfolio controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/controller-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/controller-result.json

      - name: Publish or coalesce bounded combined RAHP reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/combined-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/combined-result.json

      - name: Publish or coalesce canonical RAHP privacy referrals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-routing/dpip-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/dtg-routing/dpip-result.json

      - name: Transport qualified privacy referrals to DPIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: |
          python3 tools/dpip_handoff.py --self-test
          issue_args=()
          if [ -s build/dtg-routing/dpip-result.json ]; then
            while IFS= read -r number; do
              [ -n "$number" ] || continue
              issue_args+=(--issue-number "$number")
            done < <(jq -r '.issues[]?.number // empty' build/dtg-routing/dpip-result.json)
          fi
          if [ "${#issue_args[@]}" -gt 0 ]; then
            python3 tools/dpip_handoff.py "${issue_args[@]}"
          else
            python3 tools/dpip_handoff.py
          fi

      - name: Dispatch registered DTG cross-specification pressure tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -s build/dtg-routing/compositions.txt ]; then
            echo 'No registered cross-spec composition was implicated.'
            exit 0
          fi
          lineage='${{ inputs.assessment_lineage || '' }}'
          while IFS= read -r composition; do
            [ -n "$composition" ] || continue
            echo "Dispatching RAHP DTG pressure test: $composition"
            args=(-f composition_id="$composition")
            if [ -n "$lineage" ]; then
              args+=(-f assessment_lineage="$lineage")
            fi
            gh workflow run dtg-cross-spec-pressure-test.yml --ref main "${args[@]}"
          done < build/dtg-routing/compositions.txt

      - name: Publish routing summary
        if: always()
        shell: bash
        run: |
          echo '## DTG Portfolio Monitor → RAHP → DPIP pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot: `${{ steps.snapshot.outputs.date }}`' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.assessment_lineage || '' }}" ]; then
            echo '- Clean-room lineage: `${{ inputs.assessment_lineage }}`' >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r 'group_by(.outcome) | map("- " + .[0].outcome + ": " + (length|tostring)) | .[]' build/dtg-routing/routing.json >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s build/dtg-routing/unresolved.json ] && [ "$(jq length build/dtg-routing/unresolved.json)" -gt 0 ]; then
            echo '- Unresolved qualifying findings remain visible in routing output.' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "  - `\(.finding_id)` \(.repository): \(.title)"' build/dtg-routing/unresolved.json >> "$GITHUB_STEP_SUMMARY"
          fi
