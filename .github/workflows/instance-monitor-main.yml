# RAHP incremental instance monitor
#
# Purpose:
#   Stateful, delta-driven orchestration for deployed RAHP instances. This workflow
#   checks DTG and CAWG/C2PA repository/issue state against persisted baselines,
#   publishes/coalesces assessment work, advances bounded DTG repository reviews,
#   persists observed state, and reconciles retained DTG assurance lineages.
#
# Side effects:
#   May create/update RAHP GitHub issues, commit instance state back to main, dispatch
#   validation/publication workflows, and create a controller incident for an otherwise
#   unowned RED/PIPELINE_BROKEN condition.
#
# Boundary:
#   This is NOT a clean-room portfolio assessment. Workflow success means the monitor
#   executed successfully; it does not imply that assurance is GREEN.
#
name: RAHP incremental instance monitor

run-name: Incremental DTG/CAWG monitor · ${{ github.event_name }} · #${{ github.run_number }}

on:
  schedule:
    - cron: '37 3 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instance-monitor-main.yml'

permissions:
  contents: read
  issues: read
concurrency:
  group: rahp-instance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Only the current default-branch entry point may mutate Toolkit state.
    # Historical source revisions remain available for review, not dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Declare incremental monitor semantics
        shell: bash
        run: |
          {
            echo "## RAHP incremental instance monitor"
            echo
            echo "This run is **stateful and delta-driven**. It detects changes since the persisted instance baseline."
            echo "A successful run with zero material events is **not** a fresh or clean-room assessment of the portfolio."
            echo "Clean-room assessment is a separate assurance operation with a new immutable evaluation lineage."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Operating mode: incremental/stateful monitor (not clean-room assessment)"

      - name: Check DTG instance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dtg_portfolio.py check --config instances/dtg/instance.yaml

      - name: Synchronize checked-in DTG profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sync_dtg_profile.py --write

      - name: Stamp DTG gatherer lineage
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/dtg_gatherer_lineage.py

      - name: Check CAWG/C2PA instance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/instance_monitor.py check --config instances/cawg/instance.yaml

      - name: Watch selected CAWG architecture issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/issue_watch.py
          --registry instances/cawg/watch/issues.yaml
          --state instances/cawg/state/issues.json
          --events instances/cawg/state/issue-events.json

      - name: Watch selected DTG architecture issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/issue_watch.py
          --registry instances/dtg/watch/issues.yaml
          --state instances/dtg/state/issues.json
          --events instances/dtg/state/issue-events.json

      - name: Bundle exact observed event and state snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/instance-monitor
          tar -czf build/instance-monitor/source.tar.gz \
            instances/dtg/state instances/dtg/generated \
            instances/cawg/state instances/cawg/generated \
            profiles/dtg/rahp.yaml
          sha256sum build/instance-monitor/source.tar.gz > build/instance-monitor/source.sha256
      - name: Retain exact monitored source for the ordered publication and persistence jobs
        uses: actions/upload-artifact@v7
        with:
          name: instance-monitor-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/instance-monitor/
          if-no-files-found: error


  publish_external:
    needs: monitor
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore exact monitored source
        uses: actions/download-artifact@v7
        with:
          name: instance-monitor-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/instance-monitor/
      - name: Verify and restore pinned observation snapshot
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check build/instance-monitor/source.sha256
          tar -xzf build/instance-monitor/source.tar.gz -C .
      - name: Require unchanged Toolkit main before effect
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::Toolkit main moved between observation and publication/persistence"
            exit 1
          fi
      - name: Refuse additional external publication while state acceptance is pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pending="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/instance-monitor-"))] | length')"
          if [ "$pending" != "0" ]; then
            echo "::error::Pending protected-main instance state PR blocks re-publication; preserve the new observed source artifact"
            exit 1
          fi
      - name: Publish DTG assessment issues
        id: publish_dtg_assessments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/dtg/generated/review-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json /tmp/dtg-repository-assessments.json

      - name: Publish CAWG/C2PA assessment issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/cawg/generated/review-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Advance published DTG repository assessments by exact issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dtg-repository-issue-numbers.txt
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/dtg-repository-assessments.json").read_text(encoding="utf-8"))
          seen = set()
          for item in payload.get("issues", []):
              key = str(item.get("assessment_key") or "")
              number = item.get("number")
              if not key.startswith("dtg:repository:") or not isinstance(number, int):
                  continue
              if number in seen:
                  continue
              seen.add(number)
              print(number)
          PY

          if [ ! -s /tmp/dtg-repository-issue-numbers.txt ]; then
            echo "No published DTG repository assessments to advance."
          else
            while IFS= read -r issue_number; do
              echo "Advancing exact DTG repository assessment #$issue_number"
              python3 tools/dtg_repository_review_worker.py --issue "$issue_number"
            done < /tmp/dtg-repository-issue-numbers.txt
          fi


      - name: Publish DTG architecture-issue assessment triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/dtg/state/issue-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Publish CAWG architecture-issue assessment triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/cawg/state/issue-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"



  persist:
    needs: publish_external
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      disposition: ${{ steps.persist.outputs.disposition }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore exact monitored source
        uses: actions/download-artifact@v7
        with:
          name: instance-monitor-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/instance-monitor/
      - name: Verify and restore pinned observation snapshot
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check build/instance-monitor/source.sha256
          tar -xzf build/instance-monitor/source.tar.gz -C .
      - name: Require unchanged Toolkit main before effect
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::Toolkit main moved between observation and publication/persistence"
            exit 1
          fi
      - name: Stage monitored state under protected-main review
        id: persist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            instances/dtg/state/repositories.json \
            instances/dtg/generated/repositories.yaml \
            profiles/dtg/rahp.yaml \
            instances/dtg/state/issues.json \
            instances/dtg/state/issue-events.json \
            instances/cawg/state/repositories.json \
            instances/cawg/generated/repositories.yaml \
            instances/cawg/state/issues.json \
            instances/cawg/state/issue-events.json
          if [ -d instances/dtg/generated/gatherer-runs ]; then
            git add instances/dtg/generated/gatherer-runs
          fi
          if git diff --cached --quiet; then
            echo "No new instance state: reconciliation can use existing main."
            echo "disposition=unchanged" >> "$GITHUB_OUTPUT"
          else
            # Never mark observation as persisted before a protected-main PR
            # actually merges. New observations must not race a pending state PR.
            pending="$(gh pr list --state open --json headRefName,url --jq '[.[] | select(.headRefName | startswith("automation/instance-monitor-"))] | length')"
            if [ "$pending" != "0" ]; then
              echo "::error::Unmerged monitored-state PR exists; no new branch or issue-effect claim authorized"
              exit 1
            fi
            branch="automation/instance-monitor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch -c "$branch"
            git commit -s -m "chore(assurance): stage monitored instance revisions"
            git push -u origin "$branch"
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "chore(assurance): review monitored instance state from run #${GITHUB_RUN_ID}" \
              --body "Source observation and external issue publication completed in Toolkit Actions run #${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}. This PR stages the exact observed state; it has NOT been accepted or persisted into main. Review DCO and required checks before merge. Source and result evidence remain in that Actions run. No assurance PASS, Registry ownership cutover, or controller-incident conclusion is inferred.")"
            echo "Pending protected-main state PR: $pr_url"
            echo "disposition=staged_pending_review" >> "$GITHUB_OUTPUT"
            echo "state_pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain protected-main state review boundary
        shell: bash
        run: |
          if [ "${{ steps.persist.outputs.disposition }}" = "staged_pending_review" ]; then
            echo 'State is staged in a protected-main PR; do not reconcile unmerged findings or publish incidents.'
          fi

      - name: Reconcile DTG end-to-end assurance explicitly
        if: steps.persist.outputs.disposition == 'unchanged'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/dtg_assurance_reconcile.py
          --incident-output /tmp/dtg-controller-incidents.json

      - name: Retain state reconciliation incident result
        if: steps.persist.outputs.disposition == 'unchanged'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/instance-monitor
          cp /tmp/dtg-controller-incidents.json build/instance-monitor/controller-incidents.json
      - if: steps.persist.outputs.disposition == 'unchanged'
        uses: actions/upload-artifact@v7
        with:
          name: instance-monitor-incidents-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/instance-monitor/controller-incidents.json
          if-no-files-found: error


  local_incidents:
    needs: persist
    if: github.ref == 'refs/heads/main' && needs.persist.outputs.disposition == 'unchanged'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: instance-monitor-incidents-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/instance-monitor/
      - name: Publish only unowned Toolkit-local controller incidents
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_dtg_controller_incidents.py
          build/instance-monitor/controller-incidents.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
