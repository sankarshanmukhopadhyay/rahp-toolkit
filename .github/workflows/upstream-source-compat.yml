name: Upstream retained-source compatibility

on:
  pull_request:
    paths:
      - 'tools/source_integrity_compat.py'
      - 'tests/test_source_integrity_compat.py'
      - 'docs/upstream-source-integrity-compat.md'
      - '.github/workflows/upstream-source-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout downstream change under test
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout pinned accepted upstream RAHP
        uses: actions/checkout@v7
        with:
          repository: trustoverip/dtgwg-rahp-tf
          ref: 448e2ff4ca7f747ca899e0e845adfe45f750f094
          path: upstream-rahp
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install probe dependency
        run: python3 -m pip install 'jsonschema>=4,<5'
      - name: Run bounded comparative probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_source_integrity_compat.py' -v
          python3 tools/source_integrity_compat.py --upstream upstream-rahp --downstream . | tee "$RUNNER_TEMP/source-compat.json"
          python3 - "$RUNNER_TEMP/source-compat.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          observed = {row['scenario']: row for row in report['results']}
          expected = {
              'valid': ('accepted', 'accepted'),
              'bad_hash': ('rejected', 'rejected'),
              'bad_url': ('rejected', 'accepted'),
              'duplicate': ('rejected', 'accepted'),
              'unsafe_path': ('rejected', 'rejected'),
          }
          assert set(observed) == set(expected), 'Missing or unexpected scenarios'
          for case, pair in expected.items():
              actual = observed[case]['upstream'], observed[case]['downstream']
              assert actual == pair, f'{case}: expected {pair}, observed {actual}'
          print('Verified bounded behavior and documented divergences; not assurance.')
          PY
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-compat-${{ github.run_id }}
          path: ${{ runner.temp }}/source-compat.json
          if-no-files-found: warn
          retention-days: 14
