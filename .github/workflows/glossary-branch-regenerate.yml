name: Regenerate glossary branch artifacts

on:
  push:
    branches: [docs/1077-glossary-terms]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Regenerate from canonical sources
        run: python3 tools/build.py
      - name: Commit derived output on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/ docs/glossary.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(glossary): regenerate canonical derived output'
            git push origin HEAD:docs/1077-glossary-terms
          fi
