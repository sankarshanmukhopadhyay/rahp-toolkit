name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate RAHP artefacts
        run: python3 tools/validate.py

      - name: Validate portable assurance catalogue
        run: python3 tools/validate_catalogue.py
      - name: Validate distributed resilience model
        run: python3 tools/validate_resilience.py
      - name: Validate RAHP glossary
        run: python3 tools/validate_glossary.py
      - name: Validate portable catalogue documentation
        run: python3 tools/render_portable_catalogue_docs.py --check
      - name: Validate portable method invariants
        run: python3 tools/validate_v04_method.py
      - name: Validate portable assurance lineage
        run: python3 tools/validate_assurance_lineage.py
      - name: Validate governed remediation and retest lineage
        run: python3 tools/validate_remediation_retest_lineage.py
      - name: Validate portable assurance graph and impact analysis
        run: python3 tools/validate_assurance_graph.py
      - name: Validate evidence provenance, freshness and assurance delta
        run: python3 tools/validate_evidence_freshness_delta.py
      - name: Validate executable authority and policy gates
        run: python3 tools/validate_authority_policy_gates.py
      - name: Validate capability documentation synchronization
        run: python3 tools/validate_capability_documentation.py
      - name: Validate preserved v1.5 qualification evidence
        run: python3 tools/validate_v15_release.py
      - name: Validate v1.6 release qualification
        run: python3 tools/validate_v16_release.py
      - name: Validate canonical maintained examples
        run: python3 tools/validate_current_examples.py

      - name: Validate persona analytical richness
        run: python3 tools/validate_persona_quality.py

      - name: Validate scenario corpora
        run: python3 tools/validate_scenario_corpora.py
      - name: Validate corpus source registry
        run: python3 tools/corpus_status.py --offline > /dev/null
      - name: Validate pressure-test records
        run: python3 tools/validate_pressure_tests.py

      - name: Validate project identity
        run: python3 tools/validate_project_identity.py
      - name: Validate release metadata
        run: python3 tools/validate_release_metadata.py
      - name: Validate documentation information architecture
        run: python3 tools/validate_documentation_ia.py

      - name: Test source-monitor resilience
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate security-hardening reviews
        run: python3 tools/validate_security_reviews.py
      - name: Validate combined reviews
        run: python3 tools/validate_combined_reviews.py

      - name: Validate CAWG deployment integrity
        run: python3 tools/validate_cawg_instance.py

      - name: Validate selected issue-watch registries
        run: python3 tools/validate_issue_watch_registries.py

      - name: Validate RAHP-only issue publication policy
        run: python3 tools/validate_issue_publication_policy.py
      - name: Validate DTG example cross-specification profile
        run: python3 tools/validate_cross_spec_registry.py --registry profiles/dtg/cross-spec-tests.yaml

      - name: Validate CAWG/C2PA cross-specification profile
        run: python3 tools/validate_cross_spec_registry.py --registry profiles/cawg/cross-spec-tests.yaml

      - name: Validate portfolio cross-specification launchers
        run: python3 tools/validate_cross_spec_workflows.py

      - name: Validate durable assessment queue state
        run: python3 tools/validate_assessment_queue.py

      - name: Validate stable engine and retention contract
        run: python3 tools/validate_engine_contract.py

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Build TypeScript reference SDK
        run: |
          npm ci
          npm install --global typescript@5.8.3
          npm run build:ts
      - name: Validate Python-TypeScript conformance
        run: python3 tools/validate_typescript_sdk.py

      - name: Validate CAWG mandate-readiness rendering
        run: python3 tools/render_cawg_readiness.py --check

      - name: Validate CAWG risk-register rendering
        run: python3 tools/render_cawg_risks.py --check
      - name: Build derived views
        run: python3 tools/build.py
      - name: Validate RAHP reference links
        run: python3 tools/validate_reference_links.py
      - name: Fail if build/ differs from committed state
        run: |
          if [ -n "$(git status --porcelain build/ 2>/dev/null)" ]; then
            echo "::error::build/ is out of date — run 'python3 tools/build.py' and commit generated evidence"
            git status --short build/
            exit 1
          fi
      - name: Summary
        if: always()
        run: python3 tools/validate.py --summary >> $GITHUB_STEP_SUMMARY
