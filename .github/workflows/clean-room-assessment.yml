name: Clean-room assurance executor

on:
  pull_request:
    paths:
      - '.github/workflows/clean-room-assessment.yml'
      - 'clean-room/**'
      - 'tools/qualification_matrix.py'
      - 'tools/current_portfolio_assessor.py'
      - 'tools/clean_room.py'
      - 'tools/clean_room_execute.py'
      - 'tools/eucalyptus_campaign.py'
      - 'tools/eucalyptus_native_evidence.py'
      - 'tests/test_eucalyptus_campaign.py'
      - 'tests/test_eucalyptus_native_evidence.py'
      - 'profiles/dtg/eucalyptus/**'
      - 'tools/evidence_probe_orchestrator.py'
      - 'tools/autonomous_assurance_controller.py'
      - 'tools/assurance_fsm.py'
      - 'tools/assurance_record.py'
      - 'schemas/rahp-*.schema.json'
  workflow_dispatch:
    inputs:
      run_mode:
        description: Existing clean-room run or pinned Eucalyptus campaign
        default: standard
        type: choice
        options: [standard, eucalyptus, eucalyptus-native]
      run_spec_path:
        description: Repository-relative clean-room run specification
        required: false
        default: clean-room/run-spec.json
        type: string
      qualification_manifest:
        description: Optional repository-relative qualification manifest
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  clean-room:
    if: inputs.run_mode != 'eucalyptus' && inputs.run_mode != 'eucalyptus-native'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RUN_SPEC: ${{ inputs.run_spec_path || 'clean-room/run-spec.json' }}
      QUALIFICATION_MANIFEST: ${{ inputs.qualification_manifest || '' }}
    steps:
      - name: Checkout RAHP under test
        uses: actions/checkout@v7
        with:
          path: rahp
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install RAHP dependencies
        run: python -m pip install --disable-pip-version-check -r rahp/requirements.txt

      - name: Validate autonomous clean-room engine
        run: |
          python rahp/tools/assurance_fsm.py --self-test
          python rahp/tools/assurance_record.py --self-test
          python rahp/tools/autonomous_assurance_controller.py --self-test
          python rahp/tools/clean_room_execute.py --self-test
          cd rahp && python -m unittest discover -s tests -p 'test_eucalyptus*.py' -v

      - name: Execute isolated assurance run or qualification matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${QUALIFICATION_MANIFEST:-}" ] && [ -f "rahp/${QUALIFICATION_MANIFEST}" ]; then
            python rahp/tools/qualification_matrix.py \
              --manifest "rahp/${QUALIFICATION_MANIFEST}" \
              --rahp rahp \
              --root "$GITHUB_WORKSPACE" \
              --nonce "$GITHUB_RUN_ID"
          else
            python rahp/tools/clean_room_execute.py \
              --spec "rahp/${RUN_SPEC}" \
              --rahp rahp \
              --workspace "$GITHUB_WORKSPACE" \
              --nonce "$GITHUB_RUN_ID"
          fi

      - name: Require citable terminal assurance output
        run: |
          python - <<'PY'
          import json, pathlib
          q=pathlib.Path('qualification-output/qualification-summary.json')
          if q.exists():
              summary=json.loads(q.read_text())
              assert summary['operator_actions_after_trigger'] == 0, summary
              assert summary['stranded_runs'] == 0, summary
              assert summary['replay']['same_assessment_id'] is True, summary
              print(json.dumps(summary,indent=2))
          else:
              output=pathlib.Path('output')
              terminal=json.loads((output/'clean-room-terminal.json').read_text())
              record=json.loads((output/'assurance-terminal-machine.json').read_text())
              assert terminal['terminal'] is True and terminal['stranded'] is False, terminal
              assert record['terminal'] is True and record['assessment_id'] == terminal['assessment_id']
              assert record['source_pins']
              assert (output/'assurance-terminal-human.md').read_text().strip()
              print(json.dumps(terminal,indent=2))
          PY

      - name: Upload clean-room assurance package
        uses: actions/upload-artifact@v7
        with:
          name: clean-room-assurance-${{ github.run_id }}
          path: |
            output/
            qualification-output/
          if-no-files-found: error

  native-evidence:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'eucalyptus-native') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'assessment/eucalyptus-evidence-'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_CODEGEN_UNITS: '1'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_CODEGEN_UNITS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Provision tagged native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          sudo timeout 120 apt-get install -y libdbus-1-dev libpcsclite-dev pkg-config clang cmake
          curl --fail --location --max-time 180 https://storage.googleapis.com/dart-archive/channels/stable/release/3.10.0/sdk/dartsdk-linux-x64-release.zip -o "$RUNNER_TEMP/dart-sdk.zip"
          echo "a27681be873c3891692285db8d656e7494ca80c74e86613b8085fc6cffa3e31d  $RUNNER_TEMP/dart-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dart-sdk.zip" -d "$RUNNER_TEMP/native-toolchains"
          echo "$RUNNER_TEMP/native-toolchains/dart-sdk/bin" >> "$GITHUB_PATH"
          python -m pip install -r requirements.txt
      - name: Acquire exact coordinated and auxiliary source identities
        env:
          NATIVE_WORKSPACE: ${{ runner.temp }}/eucalyptus-native
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          from concurrent.futures import ThreadPoolExecutor
          sys.path.insert(0, 'tools')
          import eucalyptus_campaign as campaign
          config=json.loads(pathlib.Path('profiles/dtg/eucalyptus/campaign.json').read_text())
          campaign.validate(config)
          workspace=pathlib.Path(os.environ['NATIVE_WORKSPACE'])
          workspace.mkdir()
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(lambda source: campaign.acquire(source, workspace, False), config['sources']+config['auxiliary_sources']))
          PY
      - name: Resolve and record Dart workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-prerequisites"
          cd "$RUNNER_TEMP/eucalyptus-native/sources/affinidi-tsp-dart"
          timeout 180 dart pub get > "$RUNNER_TEMP/native-prerequisites/dart-pub-get.log" 2>&1
      - name: Collect supplemental native and consuming-path evidence
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-target
        run: python tools/eucalyptus_native_evidence.py --sources "$RUNNER_TEMP/eucalyptus-native/sources" --output "$RUNNER_TEMP/native-evidence" --timeout-seconds 900
      - name: Verify supplemental seal
        run: python tools/eucalyptus_campaign.py --verify-package "$RUNNER_TEMP/native-evidence"
      - name: Preserve native attempts including prerequisite failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eucalyptus-native-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-evidence/
            ${{ runner.temp }}/native-prerequisites/
          if-no-files-found: warn

  current-portfolio:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout RAHP under test
        uses: actions/checkout@v7
        with:
          path: rahp
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install RAHP dependencies
        run: python -m pip install --disable-pip-version-check -r rahp/requirements.txt

      - name: Validate portfolio assessor
        run: |
          python rahp/tools/clean_room_execute.py --self-test
          python -m py_compile rahp/tools/current_portfolio_assessor.py

      - name: Execute current DTG portfolio clean-room assessment
        run: |
          python rahp/tools/clean_room_execute.py \
            --spec rahp/clean-room/current-portfolio-run-spec.json \
            --rahp rahp \
            --workspace "$GITHUB_WORKSPACE" \
            --nonce "${GITHUB_RUN_ID}-portfolio"

      - name: Require terminal AMBER assessment package
        run: |
          python - <<'PY'
          import json, pathlib
          out=pathlib.Path('output')
          terminal=json.loads((out/'clean-room-terminal.json').read_text())
          record=json.loads((out/'assurance-terminal-machine.json').read_text())
          matrix=json.loads((out/'current-portfolio-matrix.json').read_text())
          assert terminal['terminal'] is True and terminal['stranded'] is False, terminal
          assert record['terminal'] is True, record
          assert record['outcome'] == 'INDETERMINATE', record
          assert record['reason_code'] == 'portfolio-evidence-required', record
          assert matrix['summary']['portfolio_posture'] == 'AMBER', matrix['summary']
          assert matrix['summary']['pass'] >= 1, matrix['summary']
          assert matrix['summary']['indeterminate'] >= 1, matrix['summary']
          assert len(record['source_pins']) >= 6, record['source_pins']
          print(json.dumps(matrix['summary'], indent=2))
          PY

      - name: Upload current portfolio assurance package
        uses: actions/upload-artifact@v7
        with:
          name: dtg-current-portfolio-assurance-${{ github.run_id }}
          path: output/
          if-no-files-found: error


  eucalyptus:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'eucalyptus'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Run exact coordinated release with fresh evidence
        run: python tools/eucalyptus_campaign.py --workspace "$RUNNER_TEMP/eucalyptus-${GITHUB_RUN_ID}"
      - name: Verify evidence seal
        run: python tools/eucalyptus_campaign.py --verify-package "$RUNNER_TEMP/eucalyptus-${GITHUB_RUN_ID}/output"
      - name: Publish complete evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eucalyptus-assurance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eucalyptus-${{ github.run_id }}/output/
            ${{ runner.temp }}/eucalyptus-${{ github.run_id }}/execution-failure.json
          if-no-files-found: error
