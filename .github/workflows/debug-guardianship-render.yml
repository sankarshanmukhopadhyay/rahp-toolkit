name: debug guardianship pressure-test render

on:
  pull_request:
    paths:
      - 'examples/cross-spec/guardianship-fiduciary/**'
      - 'tools/render_pressure_tests.py'
      - '.github/workflows/debug-guardianship-render.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Render and show exact delta
        run: |
          python3 tools/render_pressure_tests.py
          git diff -- examples/cross-spec/guardianship-fiduciary/README.md
          if ! git diff --quiet -- examples/cross-spec/guardianship-fiduciary/README.md; then
            exit 1
          fi
