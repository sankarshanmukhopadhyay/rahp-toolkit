name: debug guardianship pressure-test render

on:
  pull_request:
    paths:
      - 'examples/cross-spec/guardianship-fiduciary/**'
      - 'tools/render_pressure_tests.py'
      - '.github/workflows/debug-guardianship-render.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Render canonical pressure-test Markdown
        run: python3 tools/render_pressure_tests.py
      - name: Commit canonical render if needed
        run: |
          if git diff --quiet -- examples/cross-spec/guardianship-fiduciary/README.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/cross-spec/guardianship-fiduciary/README.md
          git commit -m "Synchronize guardianship pressure-test rendering"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
