name: Publish qualified RAHP release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact already-qualified release tag to publish (for example v2.7.0)'
        required: true
        type: string
      confirm_publication:
        description: 'Type PUBLISH to authorize release publication'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'sankarshanmukhopadhyay/rahp-toolkit' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install TypeScript workspace
        run: |
          npm ci
          npm install --global typescript@5.8.3
      - name: Require Python-TypeScript conformance for release publication
        run: python3 tools/validate_typescript_sdk.py
      - name: Resolve release declaration
        id: release
        run: python3 tools/release.py metadata --github-output "$GITHUB_OUTPUT"
      - name: Verify target branch
        env:
          TARGET_BRANCH: ${{ steps.release.outputs.target_branch }}
        run: |
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH" || { echo "::error::release publication must run from declared branch $TARGET_BRANCH"; exit 1; }
      - name: Requalify current release state
        run: python3 tools/release.py qualify
      - name: Require explicit maintainer publication authorization
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirm_publication }}
          DECLARED_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
          QUALIFICATION_STATUS: ${{ steps.release.outputs.qualification_status }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PUBLISH || { echo "::error::Explicit PUBLISH confirmation required"; exit 1; }
          test "$REQUESTED_TAG" = "$DECLARED_TAG" || { echo "::error::Requested tag must match qualified declaration"; exit 1; }
          test "$RELEASE_STATUS" = released || { echo "::error::Release declaration must be released"; exit 1; }
          test "$QUALIFICATION_STATUS" = qualified || { echo "::error::Release must be qualified"; exit 1; }
      - name: Require pinned v2.7 qualification evidence and explicit GO
        if: steps.release.outputs.tag == 'v2.7.0'
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_v27_release.py
          python3 tools/validate_v27_release_evidence.py method/v2.7-release-evidence.json
          python3 - <<'PY'
          import json, os, pathlib, yaml
          sha = os.environ["RELEASE_SHA"]
          q = yaml.safe_load(pathlib.Path("method/v2.7-release-qualification.yaml").read_text())
          c = yaml.safe_load(pathlib.Path("method/v2.7-release-candidate.yaml").read_text())
          e = json.loads(pathlib.Path("method/v2.7-release-evidence.json").read_text())
          assert q["state"] == "QUALIFIED", "qualification must be QUALIFIED"
          assert q["release_cut"]["publication_authorized"] is True, "qualification authorization missing"
          assert q["release_cut"]["candidate_sha"] == e["candidate_sha"], "qualification and evidence candidate SHA mismatch"
          assert all(v == "PASS" for v in q["release_gates"].values()), "qualification gates incomplete"
          assert c["candidate"]["base_tag"] == "v2.6.0", "candidate baseline changed"
          assert c["candidate"]["publication_authorized"] is False, "candidate manifest must remain historical prequalification"
          assert e["publication_authorized"] is True, "evidence authorization missing"
          PY
          candidate_sha="$(python3 -c 'import json; print(json.load(open("method/v2.7-release-evidence.json"))["candidate_sha"])')"
          git merge-base --is-ancestor "$candidate_sha" "$RELEASE_SHA" || { echo "::error::Evidence candidate SHA is not an ancestor of release commit"; exit 1; }
      - name: Create or verify declared release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tagged_version="$(git show "$TAG:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            test "$tagged_version" = "$VERSION" || { echo "::error::$TAG exists but tagged package version is $tagged_version, expected $VERSION"; exit 1; }
            git show "$TAG:PROJECT-STATUS.yaml" | VERSION="$VERSION" python3 -c 'import os,sys,yaml; d=yaml.safe_load(sys.stdin); assert str(d.get("stable_release")) == os.environ["VERSION"]'
            echo "$TAG already identifies a release commit for version $VERSION; preserving it."
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" "$GITHUB_SHA" -m "$TITLE"
            git push origin "$TAG"
          fi
      - name: Publish declared GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          NOTES_PATH: ${{ steps.release.outputs.notes_path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file "$NOTES_PATH" --latest
          fi
          gh release view "$TAG" >/dev/null
