name: Verify live Registry accepted group ownership
on:
  pull_request:
    paths:
      - 'instances/dtg/registry-transfers.json'
      - '.github/workflows/registry-accepted-owner-live.yml'
      - 'tools/prepare_registry_partition_publication.py'
  push:
    branches: [main]
    paths:
      - 'instances/dtg/registry-transfers.json'
      - '.github/workflows/registry-accepted-owner-live.yml'
      - 'tools/prepare_registry_partition_publication.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accepted-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Independently verify exact Registry owner, source ACK, and maintainer scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('tools').resolve()))
          import publish_assessment_issues as pub
          import prepare_registry_partition_publication as guard

          data = json.loads(pathlib.Path(
              'instances/dtg/registry-transfers.json').read_text())
          pub.load_transfer_keys_data(data)
          records = data['transfers']
          if len(records) != 1:
              raise SystemExit('expected exactly one reviewed Registry group record')
          record = records[0]
          if record['assessment_key'] != guard.KEY:
              raise SystemExit('unexpected source group key')
          if record['state'] == 'reserved_group':
              print('Source reservation is pending; no Registry acceptance inferred')
              raise SystemExit(0)
          if record['state'] != 'accepted_group':
              raise SystemExit('unrecognized source owner state')
          token = os.environ['GITHUB_TOKEN']
          get = lambda url: pub.request('GET', url, token)
          owner = guard.verify_registry_ack(get, record, record['group_sha256'])
          if owner != record['registry_issue_url']:
              raise SystemExit('accepted owner mismatch')
          print('PASS independent live Registry accepted group owner and ACK')
          print('Source SHA256:', record['group_sha256'])
          print('Registry owner:', owner)
          print('Historical Toolkit issue:', record['toolkit_issue_url'])
          PY
      - name: Refuse ungoverned reverse transfer using actual accepted-group ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          import pathlib
          import sys

          sys.path.insert(0, str(pathlib.Path('tools').resolve()))
          from publish_assessment_issues import enforce_accepted_transfer_monotonicity

          baseline = json.loads(pathlib.Path(
              'instances/dtg/registry-transfers.json').read_text())
          row = baseline['transfers'][0]
          assert len(baseline['transfers']) == 1
          assert row['state'] == 'accepted_group'
          assert row['registry_issue_url'] == (
              'https://github.com/sankarshanmukhopadhyay/'
              'rahp-assessment-registry/issues/88')
          enforce_accepted_transfer_monotonicity(baseline, copy.deepcopy(baseline))

          def denied(change):
              candidate = copy.deepcopy(baseline)
              change(candidate)
              try:
                  enforce_accepted_transfer_monotonicity(baseline, candidate)
              except ValueError as exc:
                  if 'cannot be removed' not in str(exc):
                      raise
              else:
                  raise AssertionError('unapproved reverse transfer was accepted')

          denied(lambda c: c['transfers'].clear())
          denied(lambda c: c['transfers'][0].update(state='reserved_group',
                 registry_intent_path='outbox/pending/spec-dependency-2026-11-16.json'))
          denied(lambda c: c['transfers'][0].update(
              registry_issue_url='https://github.com/sankarshanmukhopadhyay/'
                                 'rahp-assessment-registry/issues/89'))
          denied(lambda c: c['transfers'][0].update(group_sha256='f'*64))
          print('PASS actual accepted #88 ledger rejects deletion, regression, '
                'owner substitution and source digest rewriting; no writes')
          PY
