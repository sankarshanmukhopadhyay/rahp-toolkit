name: Reconcile DTG materiality journal

on:
  schedule:
    # Run after the primary DTG Portfolio Monitor → RAHP handoff.
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dtg-materiality-journal-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Validate materiality journal gate
        run: python3 tools/materiality_journal_gate.py --self-test

      - name: Fetch newest recent Portfolio Monitor snapshot
        id: snapshot
        run: >-
          python3 tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2
          --output build/dtg-journal/findings.json

      - name: Route current material findings
        run: >-
          python3 tools/dtg_portfolio_routing.py
          --findings build/dtg-journal/findings.json
          --policy instances/dtg/assurance-routing.yaml
          --normalization-policy instances/dtg/finding-normalization.yaml
          --snapshot-date '${{ steps.snapshot.outputs.date }}'
          --out-dir build/dtg-journal

      - name: Enrich bounded combined-review journal events
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/materiality_journal_gate.py
          --events build/dtg-journal/combined-events.json
          --repository sankarshanmukhopadhyay/rahp-toolkit

      - name: Enrich DPIP journal events
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/materiality_journal_gate.py
          --events build/dtg-journal/dpip-events.json
          --repository sankarshanmukhopadhyay/rahp-toolkit

      - name: Give journal observations stable independent markers
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          for name in ('combined-events.json', 'dpip-events.json'):
              path = pathlib.Path('build/dtg-journal') / name
              events = json.loads(path.read_text()) if path.exists() else []
              for event in events:
                  rows = event.get('journal_findings') or []
                  if not rows:
                      continue
                  identity = '\n'.join(sorted(
                      f"{r.get('finding_id','')}|{r.get('repository','')}|{r.get('title','')}"
                      for r in rows
                  ))
                  digest = hashlib.sha256(identity.encode()).hexdigest()[:12]
                  base = str(event.get('observed_at') or 'unknown')
                  event['observed_at'] = f"{base}:journal:{digest}"
              path.write_text(json.dumps(events, indent=2) + '\n')
          PY

      - name: Publish or coalesce combined-review journals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-journal/combined-events.json
          --repository sankarshanmukhopadhyay/rahp-toolkit
          --result-json build/dtg-journal/combined-journal-result.json

      - name: Publish or coalesce DPIP journals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/dtg-journal/dpip-events.json
          --repository sankarshanmukhopadhyay/rahp-toolkit
          --result-json build/dtg-journal/dpip-journal-result.json

      - name: Retain journal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dtg-materiality-journal-${{ steps.snapshot.outputs.date }}
          path: |
            build/dtg-journal/findings.json
            build/dtg-journal/routing.json
            build/dtg-journal/combined-events.json
            build/dtg-journal/dpip-events.json
            build/dtg-journal/combined-journal-result.json
            build/dtg-journal/dpip-journal-result.json
          if-no-files-found: error

      - name: Publish journal reconciliation summary
        if: always()
        shell: bash
        run: |
          echo '## DTG materiality journal reconciliation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot: `${{ steps.snapshot.outputs.date }}`' >> "$GITHUB_STEP_SUMMARY"
          for f in build/dtg-journal/combined-events.json build/dtg-journal/dpip-events.json; do
            [ -s "$f" ] || continue
            jq -r '.[] | "- `" + (.assessment_key // "unknown") + "`: " + (.evidence_impact // "not-applicable")' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
