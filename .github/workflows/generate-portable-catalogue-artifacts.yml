name: Generate portable catalogue artifacts

on:
  push:
    branches:
      - feat/privacy-vc-threat-model-tranche

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/privacy-vc-threat-model-tranche
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Generate catalogue documentation and build evidence
        run: |
          python3 tools/render_portable_catalogue_docs.py
          python3 tools/build.py
      - name: Commit generated files when changed
        run: |
          git add docs/portable-assurance-catalogue.md build/
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(catalogue): refresh generated privacy artifacts"
          git push origin HEAD:feat/privacy-vc-threat-model-tranche
