# Run the Toolkit-local incident reconciliation only after protected-main
# acceptance of reviewed monitored-state changes.
name: Reconcile accepted RAHP instance state
on:
  push:
    branches: [main]
    paths:
      - 'instances/dtg/state/**'
      - 'instances/dtg/generated/gatherer-runs/**'
      - 'instances/cawg/state/**'
      - 'profiles/dtg/rahp.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: rahp-instance-monitor
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Require current accepted Toolkit main before reconciliation
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::Toolkit main advanced; do not reconcile stale state"
            exit 1
          fi
      - name: Reconcile accepted source lineage without assurance import
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/dtg_assurance_reconcile.py
          --incident-output build/instance-monitor/accepted-state-incidents.json
      - uses: actions/upload-artifact@v7
        with:
          name: accepted-instance-monitor-incidents-${{ github.run_id }}
          path: build/instance-monitor/accepted-state-incidents.json
          if-no-files-found: error

  local_incidents:
    needs: reconcile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: accepted-instance-monitor-incidents-${{ github.run_id }}
          path: build/instance-monitor/
      - name: Publish only unowned Toolkit-local controller incidents after accepted state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_dtg_controller_incidents.py
          build/instance-monitor/accepted-state-incidents.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
