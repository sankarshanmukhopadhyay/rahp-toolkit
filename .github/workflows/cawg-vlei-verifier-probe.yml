name: CAWG vLEI external verifier evidence probe

on:
  pull_request:
    paths:
      - '.github/workflows/cawg-vlei-verifier-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RAHP assessment
        uses: actions/checkout@v7
        with:
          path: rahp

      - name: Checkout pinned GLEIF verifier implementation
        uses: actions/checkout@v7
        with:
          repository: GLEIF-IT/vlei-verifier
          ref: 5850051b52dce24ed59eae486af76e7c73f6012c
          path: verifier
          persist-credentials: false

      - name: Checkout pinned CAWG vLEI specification
        uses: actions/checkout@v7
        with:
          repository: decentralized-identity/cawg-identity-assertion
          ref: 464ee8a937f467ec42be4587e425bd56e7350f9f
          path: cawg-source
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ./verifier
          python -m pip install --disable-pip-version-check pytest

      - name: Run real verifier core tests and capture bounded evidence
        shell: bash
        run: |
          set +e
          mkdir -p evidence
          cd verifier
          python -m pytest -q tests/core/test_verifying.py > ../evidence/verifier-test-output.txt 2>&1
          result=$?
          cd ..
          sha256sum evidence/verifier-test-output.txt > evidence/SHA256SUMS
          python - "$result" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path("evidence")
          result=int(sys.argv[1])
          (root/"run.json").write_text(json.dumps({
            "assessment_issue":1163,
            "specification_sha":"464ee8a937f467ec42be4587e425bd56e7350f9f",
            "verifier_repository":"GLEIF-IT/vlei-verifier",
            "verifier_sha":"5850051b52dce24ed59eae486af76e7c73f6012c",
            "test_command":"python -m pytest -q tests/core/test_verifying.py",
            "exit_code":result,
            "scope":"External verifier native core test only, not CAWG identity assertion or historical-signature conformance",
            "historical_keltel_verification":"not-executed",
            "cawg_cose_vlei_interop":"not-executed"
          },indent=2)+"\n")
          PY
          cat evidence/verifier-test-output.txt
          exit "$result"

      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cawg-vlei-verifier-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
