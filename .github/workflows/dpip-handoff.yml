name: Promote qualified RAHP referrals to DPIP

on:
  issues:
    types: [labeled]
  schedule:
    # Recovery reconciliation. The primary path is the label event.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rahp-dpip-handoff-${{ github.event.issue.number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && github.event.label.name == 'assurance:dpip-requested')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate handoff transport
        run: python3 tools/dpip_handoff.py --self-test
      - name: Transport explicitly promoted referrals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: python3 tools/dpip_handoff.py
