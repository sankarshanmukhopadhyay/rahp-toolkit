name: Promote qualified RAHP referrals to DPIP

on:
  schedule:
    # DTG Portfolio Monitor collects at 00:17 and 12:17 UTC daily. Run once
    # weekly after the Tuesday 00:17 collection and after RAHP's normal watch.
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rahp-dpip-handoff
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate handoff transport
        run: python3 tools/dpip_handoff.py --self-test
      - name: Transport explicitly promoted referrals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
        run: python3 tools/dpip_handoff.py
