name: RAHP instance change watch

on:
  schedule:
    - cron: '37 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Check DTG instance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dtg_portfolio.py check --config instances/dtg/instance.yaml

      - name: Stamp DTG gatherer lineage
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/dtg_gatherer_lineage.py

      - name: Check CAWG/C2PA instance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/instance_monitor.py check --config instances/cawg/instance.yaml

      - name: Watch selected CAWG architecture issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/issue_watch.py
          --registry instances/cawg/watch/issues.yaml
          --state instances/cawg/state/issues.json
          --events instances/cawg/state/issue-events.json

      - name: Watch selected DTG architecture issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/issue_watch.py
          --registry instances/dtg/watch/issues.yaml
          --state instances/dtg/state/issues.json
          --events instances/dtg/state/issue-events.json

      - name: Publish DTG assessment issues
        id: publish_dtg_assessments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/dtg/generated/review-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json /tmp/dtg-repository-assessments.json

      - name: Publish CAWG/C2PA assessment issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/cawg/generated/review-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Advance published DTG repository assessments by exact issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dtg-repository-issue-numbers.txt
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/dtg-repository-assessments.json").read_text(encoding="utf-8"))
          seen = set()
          for item in payload.get("issues", []):
              key = str(item.get("assessment_key") or "")
              number = item.get("number")
              if not key.startswith("dtg:repository:") or not isinstance(number, int):
                  continue
              if number in seen:
                  continue
              seen.add(number)
              print(number)
          PY

          if [ ! -s /tmp/dtg-repository-issue-numbers.txt ]; then
            echo "No published DTG repository assessments to advance."
          else
            while IFS= read -r issue_number; do
              echo "Advancing exact DTG repository assessment #$issue_number"
              python3 tools/dtg_repository_review_worker.py --issue "$issue_number"
            done < /tmp/dtg-repository-issue-numbers.txt
          fi


      - name: Publish DTG architecture-issue assessment triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/dtg/state/issue-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Publish CAWG architecture-issue assessment triggers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events instances/cawg/state/issue-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Persist observed revisions and non-empty DTG gatherer runs
        id: persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            instances/dtg/state/repositories.json \
            instances/dtg/generated/repositories.yaml \
            instances/dtg/state/issues.json \
            instances/dtg/state/issue-events.json \
            instances/cawg/state/repositories.json \
            instances/cawg/generated/repositories.yaml \
            instances/cawg/state/issues.json \
            instances/cawg/state/issue-events.json
          if [ -d instances/dtg/generated/gatherer-runs ]; then
            git add instances/dtg/generated/gatherer-runs
          fi
          if git diff --cached --quiet; then
            echo "No instance state changes to persist."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(assurance): advance monitored instance revisions"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate current-head assurance evidence
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.persist.outputs.head_sha }}
        shell: bash
        run: |
          current_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Default-branch HEAD moved before assurance dispatch: expected $EXPECTED_HEAD_SHA, observed $current_head"
            exit 1
          fi

          gh workflow run validate.yml --ref main
          gh workflow run pages.yml --ref main

          echo "Dispatched toolkit validation and publication-integrity evidence for $EXPECTED_HEAD_SHA"


      - name: Reconcile DTG end-to-end assurance explicitly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dtg_assurance_reconcile.py
