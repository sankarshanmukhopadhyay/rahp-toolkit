name: Observe published RAHP documentation

on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify offline observer regressions
        run: python3 -m unittest tests.test_verify_published_pages -v
      - name: Observe public routes and save failure evidence
        shell: bash
        run: |
          mkdir -p build/publication
          set +e
          python3 tools/verify_published_pages.py --output build/publication/observation.json
          outcome=$?
          echo "Published-route observation exit status: $outcome" >> "$GITHUB_STEP_SUMMARY"
          exit "$outcome"
      - name: Preserve exact observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-pages-observation
          path: build/publication/observation.json
          if-no-files-found: warn
          retention-days: 14
