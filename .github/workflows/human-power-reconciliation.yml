name: Human-power DPIP reconciliation

on:
  push:
    branches: [main]
    paths:
      - 'tools/human_choice_invariants.py'
      - 'tools/human_power_reconciliation.py'
      - 'tests/test_human_power_reconciliation.py'
      - 'fixtures/human-power/**'
      - 'docs/human-power-dpip-reconciliation.md'
      - '.github/workflows/human-power-reconciliation.yml'
  pull_request:
    paths:
      - 'tools/human_choice_invariants.py'
      - 'tools/human_power_reconciliation.py'
      - 'tests/test_human_power_reconciliation.py'
      - 'fixtures/human-power/**'
      - 'docs/human-power-dpip-reconciliation.md'
      - '.github/workflows/human-power-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run reconciliation falsification tests
        run: python -m unittest discover -s tests -p 'test_human_power_reconciliation.py' -v
      - name: Execute bounded reconciliation
        run: >-
          python tools/human_power_reconciliation.py
          --input fixtures/human-power/dpip-reconciliation-input.json
          --output "${{ runner.temp }}/rahp-human-power-reconciliation.json"
          --check
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v7
        with:
          name: rahp-human-power-reconciliation
          path: ${{ runner.temp }}/rahp-human-power-reconciliation.json
          if-no-files-found: error
