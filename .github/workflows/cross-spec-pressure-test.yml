name: Run cross-specification pressure test

on:
  workflow_call:
    inputs:
      registry_path:
        description: Profile registry path (for example profiles/<ecosystem>/cross-spec-tests.yaml)
        required: true
        type: string
      composition_id:
        description: Runnable composition ID from that profile registry
        required: true
        type: string
  workflow_dispatch:
    inputs:
      registry_path:
        description: Profile registry path (for example profiles/<ecosystem>/cross-spec-tests.yaml)
        required: true
        type: string
      composition_id:
        description: Runnable composition ID from that profile registry
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Validate selected profile registry
        run: python3 tools/validate_cross_spec_registry.py --registry "${{ inputs.registry_path }}"

      - name: Resolve selected composition
        id: selection
        run: >-
          python3 tools/cross_spec_selection.py
          --registry "${{ inputs.registry_path }}"
          --composition "${{ inputs.composition_id }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Validate selected composition evidence
        run: |
          python3 tools/validate_scenario_corpora.py --registry "${{ inputs.registry_path }}" --composition "${{ inputs.composition_id }}"
          python3 tools/validate_pressure_tests.py --file "${{ steps.selection.outputs.assessment }}"

      - name: Prepare detailed review record
        run: >-
          python3 tools/cross_spec_review.py
          "${{ inputs.composition_id }}"
          --registry "${{ inputs.registry_path }}"
          --output build/cross-spec-review.md
          --events build/cross-spec-review-events.json
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish durable RAHP review issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/cross-spec-review-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/cross-spec-publish-result.json

      - name: Add review to workflow summary
        if: always()
        run: |
          cat build/cross-spec-review.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/cross-spec-publish-result.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Published issue' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.issues[] | "- [\(.action) #\(.number)](\(.url))"' build/cross-spec-publish-result.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-spec-review-${{ inputs.composition_id }}
          path: |
            build/cross-spec-review.md
            build/cross-spec-review-events.json
            build/cross-spec-publish-result.json
