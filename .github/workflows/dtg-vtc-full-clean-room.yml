name: DTG VTC full clean-room campaign

on:
  pull_request:
    paths:
      - '.github/workflows/dtg-vtc-full-clean-room.yml'
      - 'clean-room/dtg-vtc-2026-09-24-run-spec.json'
      - 'profiles/dtg/cross-spec-tests.yaml'
      - 'examples/cross-spec/**'
      - 'tools/current_portfolio_assessor.py'
      - 'tools/clean_room_execute.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  portfolio-clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout RAHP under test
        uses: actions/checkout@v7
        with:
          path: rahp
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install RAHP dependencies
        run: python -m pip install --disable-pip-version-check -r rahp/requirements.txt
      - name: Validate clean-room engine
        run: |
          python rahp/tools/assurance_fsm.py --self-test
          python rahp/tools/assurance_record.py --self-test
          python rahp/tools/autonomous_assurance_controller.py --self-test
          python rahp/tools/clean_room_execute.py --self-test
      - name: Execute full current portfolio clean-room run
        run: |
          python rahp/tools/clean_room_execute.py \
            --spec rahp/clean-room/dtg-vtc-2026-09-24-run-spec.json \
            --rahp rahp \
            --workspace "$GITHUB_WORKSPACE" \
            --nonce "${GITHUB_RUN_ID}-full-dtg-vtc"
      - name: Require citable terminal output
        run: |
          python - <<'PY'
          import json, pathlib
          out=pathlib.Path('output')
          terminal=json.loads((out/'clean-room-terminal.json').read_text())
          record=json.loads((out/'assurance-terminal-machine.json').read_text())
          matrix=json.loads((out/'current-portfolio-matrix.json').read_text())
          assert terminal['terminal'] is True and terminal['stranded'] is False, terminal
          assert record['terminal'] is True, record
          assert record['assessment_id'] == terminal['assessment_id'], (record, terminal)
          assert len(record['source_pins']) >= 13, record['source_pins']
          assert matrix['summary']['portfolio_posture'] in {'GREEN','AMBER','RED'}, matrix['summary']
          print(json.dumps(matrix['summary'], indent=2))
          PY
      - name: Upload portfolio assurance package
        uses: actions/upload-artifact@v7
        with:
          name: dtg-vtc-full-clean-room-${{ github.run_id }}
          path: output/
          if-no-files-found: error

  cross-spec:
    strategy:
      fail-fast: false
      matrix:
        composition:
          - trust-tasks--credential-spec
          - credential-spec--zkp
          - credential-spec--vds
          - trust-tasks--zkp
          - trust-tasks--vds
          - zkp--vds
          - agent-names--trust-tasks
          - agent-names--credential-spec
    uses: ./.github/workflows/cross-spec-pressure-test.yml
    with:
      registry_path: profiles/dtg/cross-spec-tests.yaml
      composition_id: ${{ matrix.composition }}
      composition_scoped_registry_validation: true
      assessment_lineage: dtg-vtc-full-clean-room-2026-09-24
