name: Build and deploy RAHP documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The repository-wide assurance/method/conformance suite is owned by
      # validate.yml. Pages intentionally validates only the documentation and
      # generated-publication surfaces it uniquely consumes. Both workflows
      # remain required before merge.
      - name: Validate Markdown and Pages source renderability
        run: python3 tools/validate_markdown_pages.py

      - name: Validate documentation information architecture
        run: python3 tools/validate_documentation_ia.py

      - name: Validate portable catalogue documentation
        run: python3 tools/render_portable_catalogue_docs.py --check

      - name: Validate CAWG mandate-readiness rendering
        run: python3 tools/render_cawg_readiness.py --check

      - name: Validate CAWG risk-register rendering
        run: python3 tools/render_cawg_risks.py --check

      - name: Rebuild generated evidence
        run: python3 tools/build.py

      # Temporary diagnostic on this PR branch: emit builder-produced artifacts.
      - name: Emit glossary builder output for contributor synchronization
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import pathlib, json
          for rel in ('build/glossary.json', 'build/glossary.jsonld', 'build/glossary.md', 'docs/glossary.md', 'build/site/glossary.html', 'build/rahp-toolkit.html'):
              content = pathlib.Path(rel).read_text(encoding='utf-8')
              for i in range(0, len(content), 1800):
                  print('ARTIFACT_EXACT::' + rel + '::' + str(i // 1800) + '::' + json.dumps(content[i:i+1800], ensure_ascii=True), flush=True)
              print('ARTIFACT_END::' + rel + '::' + str((len(content)+1799)//1800), flush=True)
          PY

      - name: Validate RAHP reference links
        run: python3 tools/validate_reference_links.py

      - name: Fail if generated evidence is stale
        run: |
          if [ -n "$(git status --porcelain build/ 2>/dev/null)" ]; then
            echo "::error::build/ is out of date — run 'python3 tools/build.py' and commit generated evidence"
            git status --short build/
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Just the Docs site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Validate rendered Pages coverage
        run: python3 tools/validate_jtd_site.py _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  observe_published:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout observation requirements
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Qualify observer using negative fixtures
        run: python3 -m unittest tests.test_verify_published_pages -v
      - name: Observe published pages after deployment
        shell: bash
        run: |
          mkdir -p build/publication
          python3 tools/verify_published_pages.py --output build/publication/observation.json
      - name: Preserve independent public-route observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-pages-observation
          path: build/publication/observation.json
          if-no-files-found: warn
          retention-days: 14
