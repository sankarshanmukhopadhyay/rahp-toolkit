name: Workflow governance

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'config/workflow-governance.yaml'
      - 'tools/validate_workflow_governance.py'
      - 'docs/workflow-governance.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'config/workflow-governance.yaml'
      - 'tools/validate_workflow_governance.py'
      - 'docs/workflow-governance.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Enforce workflow inventory, budget and ownership boundaries
        run: python3 tools/validate_workflow_governance.py
