name: Clean-room Dogwood assessment

on:
  pull_request:
    paths:
      - '.github/workflows/clean-room-dogwood.yml'
      - 'tools/clean_room_dogwood.py'
      - 'tools/evidence_probe_orchestrator.py'
      - 'tests/test_evidence_probe_orchestrator.py'
      - 'tests/test_evidence_probe_plan_fixture.py'
      - 'tests/test_evidence_probe_derivation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DOGWOOD_CHECKOUT: ${{ github.workspace }}/dogwood
    steps:
      - name: Checkout RAHP under test
        uses: actions/checkout@v4
        with:
          path: rahp
          fetch-depth: 1

      - name: Checkout current DPIP
        uses: actions/checkout@v4
        with:
          repository: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          ref: main
          path: dpip
          fetch-depth: 1

      - name: Checkout current Interop Lab
        uses: actions/checkout@v4
        with:
          repository: sankarshanmukhopadhyay/trust-protocol-interop-lab
          ref: main
          path: interop
          fetch-depth: 1

      - name: Checkout immutable Dogwood RC-1 target
        uses: actions/checkout@v4
        with:
          repository: OpenVTC/verifiable-trust-infrastructure
          ref: cb01d0a758863fb3a02f9f4eef2c4f15f56c4c3b
          path: dogwood
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install assurance and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r rahp/requirements.txt
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify clean-room source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C dogwood rev-parse HEAD)" = "cb01d0a758863fb3a02f9f4eef2c4f15f56c4c3b"
          test -z "$(git -C rahp status --porcelain)"
          test -z "$(git -C dpip status --porcelain)"
          test -z "$(git -C interop status --porcelain)"
          test -z "$(git -C dogwood status --porcelain)"

      - name: Exercise current RAHP pinned-review scaffold
        working-directory: rahp
        shell: bash
        run: |
          cat > /tmp/dogwood-clean-room.yaml <<'YAML'
          version: 1
          profile:
            id: dogwood-clean-room-246
            title: Dogwood clean-room evidence-probe assessment
          assessment:
            default_mode: combined
            rahp_repository: sankarshanmukhopadhyay/rahp-toolkit
            rahp_version: current-clean-room
          repositories:
            - id: dogwood-rc1-clean-room
              repository: OpenVTC/verifiable-trust-infrastructure
              local_path: ../dogwood
              version: VTI-Dogwood-RC-1
              commit: cb01d0a758863fb3a02f9f4eef2c4f15f56c4c3b
              reviews: [combined]
              context:
                title: VTI Dogwood RC-1 clean-room target
          output:
            directory: build/clean-room-targets
          YAML
          python tools/rahp.py config-validate --config /tmp/dogwood-clean-room.yaml
          python tools/rahp.py review --config /tmp/dogwood-clean-room.yaml --target dogwood-rc1-clean-room --mode combined --force

      - name: Build fresh evidence-probe plan
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json, subprocess
          rev = subprocess.check_output(['git','-C','interop','rev-parse','HEAD'], text=True).strip()
          plan = {
            'lineage': {'id': 'dogwood-clean-room-246'},
            'target': {'repository': 'OpenVTC/verifiable-trust-infrastructure', 'revision': 'cb01d0a758863fb3a02f9f4eef2c4f15f56c4c3b'},
            'producers': {
              'dogwood-native-ab': {
                'cwd': 'interop', 'revision': rev, 'attribution': 'target-native:Dogwood-RC-1',
                'command': ['python','experiments/dtg-protected-access/capture_ab_runtime.py','cases/dtg-protected-access/dogwood-rc1-runtime-ab.yaml','--output','../output/dogwood-capture.yaml']
              },
              'composed-ab': {
                'cwd': 'interop', 'revision': rev, 'attribution': 'composition-runtime:Interop-Lab',
                'command': ['python','experiments/dtg-protected-access/run_composed_ab.py','--output-dir','../output/composed','--revision',rev]
              }
            },
            'requirements': [
              {'id':'ER-REL-DID-AB','producer':'dogwood-native-ab','evidence_file':'output/dogwood-capture.yaml'},
              {'id':'ER-VERIFIER-AB','producer':'dogwood-native-ab','evidence_file':'output/dogwood-capture.yaml'},
              {'id':'ER-STATUS-AB','producer':'composed-ab','evidence_file':'output/composed/unlinkability-pressure-capture.yaml','attribution':'composition-runtime:Interop-Lab'},
              {'id':'ER-TASK-AB','producer':'composed-ab','evidence_file':'output/composed/unlinkability-pressure-capture.yaml','attribution':'composition-runtime:Interop-Lab'}
            ]
          }
          open('output/probe-plan.json','w').write(json.dumps(plan, indent=2) + '\n')
          PY

      - name: Execute all registered evidence probes
        run: |
          python rahp/tools/evidence_probe_orchestrator.py output/probe-plan.json \
            --workspace "$GITHUB_WORKSPACE" \
            --output output/evidence-probe-ledger.json

      - name: Export fresh Dogwood DPIP evidence
        run: |
          python interop/experiments/dtg-protected-access/export_dpip_evidence.py \
            output/dogwood-capture.yaml \
            --output output/dogwood-provided-evidence.json

      - name: Verify producer attribution and no omitted probes
        run: |
          python - <<'PY'
          import json
          d=json.load(open('output/evidence-probe-ledger.json'))
          assert d['complete'], d['orchestration_defects']
          assert len(d['requirements']) == 4
          by={x['requirement_id']:x for x in d['requirements']}
          assert by['ER-REL-DID-AB']['attribution'] == 'target-native:Dogwood-RC-1'
          assert by['ER-VERIFIER-AB']['attribution'] == 'target-native:Dogwood-RC-1'
          assert by['ER-STATUS-AB']['attribution'] == 'composition-runtime:Interop-Lab'
          assert by['ER-TASK-AB']['attribution'] == 'composition-runtime:Interop-Lab'
          assert all(x['attempt_state'] in {'EXECUTED','ATTEMPTED_UNAVAILABLE','NO_APPLICABLE_PRODUCER'} for x in d['requirements'])
          print(json.dumps(d, indent=2))
          PY

      - name: Produce machine and human conclusion artifacts
        run: |
          python rahp/tools/clean_room_dogwood.py \
            --rahp rahp --dpip dpip --interop interop --target dogwood \
            --probe-ledger output/evidence-probe-ledger.json \
            --out-dir output
          cat output/human-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clean-room evidence and conclusion
        uses: actions/upload-artifact@v4
        with:
          name: dogwood-clean-room-246
          path: output/
          if-no-files-found: error
