name: Reconcile RAHP-DPIP lifecycle and returns

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    paths:
      - tools/assurance_fsm.py
      - tools/assurance_record.py
      - tools/assurance_watchdog.py
      - tools/autonomous_assurance_controller.py
      - tools/assurance_obligation.py
      - tools/evidence_producer_controller.py
      - config/evidence-producers.yaml
      - schemas/rahp-assurance-obligation-v1.schema.json
      - tools/dpip_lifecycle.py
      - tools/dpip_lifecycle_reconcile.py
      - tools/dpip_return_reconcile.py
      - .github/workflows/dpip-lifecycle.yml
  push:
    branches: [main]
    paths:
      - tools/assurance_obligation.py
      - tools/evidence_producer_controller.py
      - config/evidence-producers.yaml
      - schemas/rahp-assurance-obligation-v1.schema.json
      - tools/dpip_lifecycle.py
      - tools/dpip_lifecycle_reconcile.py
      - tools/dpip_return_reconcile.py
      - .github/workflows/dpip-lifecycle.yml
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional RAHP referral or semantic obligation issue to reconcile
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: rahp-dpip-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number || github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '<!-- dpip-return:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate controller and obligation contracts
        run: |
          python3 tools/assurance_fsm.py --self-test
          python3 tools/assurance_record.py --self-test
          python3 tools/assurance_watchdog.py --self-test
          python3 tools/autonomous_assurance_controller.py --self-test
          python3 tools/assurance_obligation.py --self-test
          python3 tools/evidence_producer_controller.py --self-test
          python3 tools/dpip_lifecycle.py --self-test
          python3 tools/dpip_lifecycle_reconcile.py --self-test
          python3 tools/dpip_return_reconcile.py --self-test
      - name: Reconcile lifecycle, specialist returns, and active evidence obligations
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          EVIDENCE_PRODUCER_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -n "$issue_number" ]; then
            python3 tools/dpip_lifecycle_reconcile.py --issue-number "$issue_number"
            python3 tools/dpip_return_reconcile.py --issue-number "$issue_number"
          else
            python3 tools/dpip_lifecycle_reconcile.py
            python3 tools/dpip_return_reconcile.py
          fi
          # Evidence obligations are intentionally scanned after reconciliation so a
          # newly created/acquirable obligation can dispatch in the same controller run.
          python3 tools/evidence_producer_controller.py
      - name: Detect stranded controller states after normal retries
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          RAHP_CONTROLLER_SLA_HOURS: '6'
        run: python3 tools/assurance_watchdog.py
