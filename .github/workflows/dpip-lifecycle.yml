name: Reconcile RAHP-DPIP lifecycle telemetry

on:
  pull_request:
    paths:
      - tools/dpip_lifecycle.py
      - .github/workflows/dpip-lifecycle.yml
  push:
    branches: [main]
    paths:
      - tools/dpip_lifecycle.py
      - .github/workflows/dpip-lifecycle.yml
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional RAHP referral issue to reconcile
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: rahp-dpip-lifecycle-${{ github.event.pull_request.number || inputs.issue_number || github.ref || 'scheduled' }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate lifecycle derivation
        run: python3 tools/dpip_lifecycle.py --self-test
      - name: Reconcile lifecycle telemetry
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DPIP_HANDOFF_TOKEN: ${{ secrets.DPIP_HANDOFF_TOKEN }}
          RAHP_REPOSITORY: sankarshanmukhopadhyay/rahp-toolkit
          DPIP_REPOSITORY: sankarshanmukhopadhyay/dtg-privacy-implementation-profile
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            python3 tools/dpip_lifecycle.py --issue-number "$ISSUE_NUMBER"
          else
            python3 tools/dpip_lifecycle.py
          fi
