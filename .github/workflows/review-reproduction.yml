name: Independent review reproduction

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Record clean-runner baseline
        run: |
          {
            echo "schema: rahp-review-reproduction/v1"
            echo "commit: $GITHUB_SHA"
            echo "runner_os: $RUNNER_OS"
            echo "python: $(python3 --version 2>&1)"
            echo "pip: $(python3 -m pip --version)"
          } > "$RUNNER_TEMP/rahp-review-reproduction.txt"
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip freeze >> "$RUNNER_TEMP/rahp-review-reproduction.txt"
      - name: Execute reviewer minimum path
        run: |
          set -o pipefail
          python3 tools/validate_review_readiness.py 2>&1 | tee -a "$RUNNER_TEMP/rahp-review-reproduction.txt"
          python3 tools/validate_negative_fixtures.py 2>&1 | tee -a "$RUNNER_TEMP/rahp-review-reproduction.txt"
          python3 tools/validate_engine_contract.py 2>&1 | tee -a "$RUNNER_TEMP/rahp-review-reproduction.txt"
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee -a "$RUNNER_TEMP/rahp-review-reproduction.txt"
      - name: Upload reproduction record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rahp-independent-review-reproduction
          path: ${{ runner.temp }}/rahp-review-reproduction.txt
          if-no-files-found: error
