# Read-only successor of DTG materiality source qualification.
# Original dtg-materiality-main.yml writer registration remains subject to
# server-side retirement. This workflow never dispatches case writers.
name: Registry-mode DTG materiality observation
on:
  schedule:
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      assessment_lineage:
        description: Optional explicit assessment lineage
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/registry-observe-materiality.yml'
      - 'instances/dtg/external-case-publication.json'
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: dtg-portfolio-materiality-handoff
  cancel-in-progress: false
jobs:
  route:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      registry_mode: ${{ steps.route.outputs.registry_mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Require Registry case authority before observation
        id: route
        shell: bash
        run: |
          set -euo pipefail
          owner="$(python3 tools/publish_assessment_issues.py --publication-owner)"
          case "$owner" in
            toolkit) echo "registry_mode=false" >> "$GITHUB_OUTPUT" ;;
            registry) echo "registry_mode=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown external case authority"; exit 1 ;;
          esac

  handoff:
    needs: route
    # Observe and stage source-qualified evidence without an external issue write.
    # Historical source revisions remain available for review, not dispatch.
    if: needs.route.outputs.registry_mode == 'true' && github.ref == 'refs/heads/main'
    outputs:
      controller: ${{ steps.registry-selection.outputs.controller }}
      combined: ${{ steps.registry-selection.outputs.combined }}
      dpip: ${{ steps.registry-selection.outputs.dpip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Resolve explicit portfolio baseline lineage
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          lineage='${{ inputs.assessment_lineage || '' }}'
          if [ -z "$lineage" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            target='instances/dtg/baselines/current.yaml'
            before='${{ github.event.before }}'
            zero='0000000000000000000000000000000000000000'
            if [ -n "$before" ] && [ "$before" != "$zero" ]; then
              git fetch --no-tags --depth=1 origin "$before"
              if git diff --name-only "$before" "$GITHUB_SHA" -- "$target" | grep -Fxq "$target"; then
                python3 tools/dtg_portfolio_baseline.py --self-test
                lineage="$(python3 tools/dtg_portfolio_baseline.py "$target" --field lineage)"
              fi
            fi
          fi
          echo "lineage=$lineage" >> "$GITHUB_OUTPUT"
          if [ -n "$lineage" ]; then
            echo "Using explicit assessment lineage: $lineage"
          else
            echo "No explicit lineage; using normal snapshot/date-scoped controller identity."
          fi

      - name: Validate Portfolio Monitor snapshot fetch contract
        run: python3 tools/fetch_dtg_portfolio_snapshot.py --self-test

      - name: Validate assessment issue ownership contract
        run: >-
          python3 tools/publish_assessment_issues.py
          --self-test
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Fetch newest recent Portfolio Monitor snapshot
        id: snapshot
        run: >-
          python3 tools/fetch_dtg_portfolio_snapshot.py
          --lookback-days 2
          --output build/dtg-routing/findings.json

      - name: Validate and execute machine-readable assurance routing
        run: |
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --normalization-policy instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ steps.baseline.outputs.lineage }}' \
            --self-test
          python3 tools/dtg_portfolio_routing.py \
            --findings build/dtg-routing/findings.json \
            --policy instances/dtg/assurance-routing.yaml \
            --normalization-policy instances/dtg/finding-normalization.yaml \
            --snapshot-date '${{ steps.snapshot.outputs.date }}' \
            --out-dir build/dtg-routing \
            --assessment-lineage '${{ steps.baseline.outputs.lineage }}'

      - name: Validate materiality journal gate
        run: python3 tools/materiality_journal_gate.py --self-test

      - name: Preserve original canonical combined source before journal enrichment
        run: cp build/dtg-routing/combined-events.json build/dtg-routing/source-combined-events.json

      - name: Journal combined-review materiality and gate reassessment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/materiality_journal_gate.py
          --events build/dtg-routing/combined-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Journal DPIP materiality and gate reassessment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/materiality_journal_gate.py
          --events build/dtg-routing/dpip-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"

      - name: Build portfolio controller event
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          route = json.loads(pathlib.Path('build/dtg-routing/routing.json').read_text())
          unresolved = json.loads(pathlib.Path('build/dtg-routing/unresolved.json').read_text())
          counts = {}
          for item in route:
              counts[item['outcome']] = counts.get(item['outcome'], 0) + 1
          day = '${{ steps.snapshot.outputs.date }}'
          source_url = '${{ steps.snapshot.outputs.url }}'
          snapshot_digest = '${{ steps.snapshot.outputs.snapshot_digest }}'.strip()
          if not snapshot_digest:
              raise SystemExit('Portfolio snapshot digest is required for controller identity')
          lineage = '${{ steps.baseline.outputs.lineage }}'.strip()
          controller_key = f'dtg:portfolio:material-change-set:{day}:snapshot:{snapshot_digest}'
          if lineage:
              controller_key += f':lineage:{lineage}'
          lines = [
              '# DTG Portfolio Monitor → RAHP assurance controller',
              '',
              f'<!-- rahp-assessment-key:{controller_key} -->',
              *([f'<!-- rahp-clean-room-lineage:{lineage} -->'] if lineage else []),
              f'<!-- rahp-portfolio-snapshot:{day} -->',
              f'<!-- rahp-portfolio-snapshot-digest:sha256:{snapshot_digest} -->',
              '<!-- dtg-routing-policy:v3-semantic -->',
              '',
              'RAHP consumed the newest recent Portfolio Monitor snapshot, normalized source findings through the DTG instance adapter, and applied semantic assurance routing.',
              '',
              '## Proposition',
              '',
              'Do the current material DTG changes alter assurance conclusions, require a registered RAHP composition, require a bounded RAHP/security review, or require DPIP examination of composed privacy behaviour?',
              '',
              '## Routing evidence',
              '',
              f'- Portfolio snapshot: {source_url}',
              f'- Snapshot date: `{day}`',
              f'- Snapshot digest: `sha256:{snapshot_digest}`',
              f'- Qualifying findings: **{len(route)}**',
              f'- Dispositions: `{counts}`',
              f'- UNMAPPED findings: **{len(unresolved)}**',
              '',
          ]
          if unresolved:
              lines.extend([
                  '### UNMAPPED finding identities',
                  '',
                  'These qualifying findings were not semantically routed by the current policy. They remain explicit assurance obligations until dispositioned or transferred to a durable owner.',
                  '',
              ])
              for item in unresolved:
                  finding_id = item.get('finding_id', 'unknown')
                  repository = item.get('repository', 'unknown')
                  title = item.get('title', '(untitled finding)')
                  evidence_urls = item.get('evidence_urls') or []
                  lines.append(f'- `{finding_id}` — **{repository}**: {title}')
                  for evidence_url in evidence_urls:
                      lines.append(f'  - Evidence: {evidence_url}')
              lines.append('')
          lines.extend([
              '## Pipeline contract',
              '',
              'Portfolio Monitor detects/classifies. RAHP owns assurance routing and RAHP assessments. Privacy-relevant findings are promoted through the canonical RAHP → DPIP transport. DPIP owns applicability/evidence/privacy conclusion and returns the disposition to RAHP.',
              '',
              'Controller records are exact-snapshot scoped using a deterministic SHA-256 digest of the consumed findings content. Re-publication of identical evidence is idempotent; materially different same-day snapshots receive distinct controller keys. Bounded child reviews resolve to durable proposition owners across observations and issue lifecycle state.',
              '',
              'For proposition-scoped child reviews, every material observation is journaled on the durable owner. A closed owner remains closed only when the routed finding set is already represented; a previously unseen material finding is fail-closed to reassessment unless evidence-backed preservation is established.',
              '',
              '## Closure rule',
              '',
              'Do not close this controller while any routed RAHP review, DPIP referral, or UNMAPPED qualifying finding from this epoch remains outstanding unless ownership has been explicitly transferred to a durable successor. Unknown semantics remain explicit rather than being silently dropped.',
          ])
          body = '\n'.join(lines) + '\n'
          event = {
              'assessment_key': controller_key,
              'observed_at': day,
              'source': 'dtg-portfolio-monitor',
              'title': f'DTG portfolio materiality assessment required — {day} — {snapshot_digest[:12]}',
              'labels': ['assessment-required', 'dtg-instance', 'cross-specification'],
              'affected_reviews': ['rahp', 'security', 'combined'],
              'body': body,
          }
          pathlib.Path('build/dtg-routing/controller-events.json').write_text(json.dumps([event], indent=2) + '\n')
          PY

      - name: Audit registry cutover readiness (read-only)
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_registry_route_gate.py'
          python3 tools/registry_route_gate.py \
            --controller build/dtg-routing/controller-events.json \
            --combined build/dtg-routing/combined-events.json \
            --dpip build/dtg-routing/dpip-events.json \
            --out build/dtg-routing/registry-readiness.json

      - name: Stage lossless Registry source partitions (no publication authority)
        run: >-
          python3 tools/stage_registry_source_partition.py
          --batches
          build/dtg-routing/controller-events.json
          build/dtg-routing/combined-events.json
          build/dtg-routing/dpip-events.json
          --source-combined build/dtg-routing/source-combined-events.json
          --out-dir build/dtg-routing/registry-partition

      - name: Qualify Registry observation and select exact publication inputs
        id: registry-selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/prepare_registry_partition_publication.py
          --batches
          build/dtg-routing/controller-events.json
          build/dtg-routing/combined-events.json
          build/dtg-routing/dpip-events.json
          --stage-dir build/dtg-routing/registry-partition
          --source-combined build/dtg-routing/source-combined-events.json
          --receipt build/dtg-routing/registry-publish-selection.json
          --github-output "$GITHUB_OUTPUT"

      - name: Retain exact source-qualified evidence for Registry admission
        uses: actions/upload-artifact@v7
        with:
          name: dtg-source-qualified-queue-${{ github.run_id }}-${{ github.run_attempt }}
          # Retain the full relative tree; selector outputs reference
          # build/dtg-routing paths in the separate publication job.
          path: build/dtg-routing/
          if-no-files-found: error

      - name: Retain portfolio routing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dtg-portfolio-routing-${{ steps.snapshot.outputs.date }}-${{ steps.baseline.outputs.lineage || 'date-scoped' }}
          path: |
            build/dtg-routing/findings.json
            build/dtg-routing/routing.json
            build/dtg-routing/unresolved.json
            build/dtg-routing/compositions.txt
            build/dtg-routing/controller-events.json
            build/dtg-routing/controller-result.json
            build/dtg-routing/combined-events.json
            build/dtg-routing/source-combined-events.json
            build/dtg-routing/combined-result.json
            build/dtg-routing/dpip-events.json
            build/dtg-routing/dpip-result.json
            build/dtg-routing/registry-readiness.json
            build/dtg-routing/registry-partition/
            build/dtg-routing/registry-publish-selection.json
          if-no-files-found: error

      - name: Publish routing summary
        if: always()
        shell: bash
        run: |
          echo '## DTG Portfolio Monitor → RAHP → DPIP pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot: `${{ steps.snapshot.outputs.date }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot age: `${{ steps.snapshot.outputs.age_days || 'unknown' }}` day(s)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Snapshot digest: `sha256:${{ steps.snapshot.outputs.snapshot_digest }}`' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.baseline.outputs.lineage }}" ]; then
            echo '- Clean-room lineage: `${{ steps.baseline.outputs.lineage }}`' >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r 'group_by(.outcome) | map("- " + .[0].outcome + ": " + (length|tostring)) | .[]' build/dtg-routing/routing.json >> "$GITHUB_STEP_SUMMARY" || true
          for f in build/dtg-routing/combined-events.json build/dtg-routing/dpip-events.json; do
            [ -s "$f" ] || continue
            jq -r '.[] | select(.evidence_impact != null) | "- journal `" + (.assessment_key // "unknown") + "`: " + .evidence_impact' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
          if [ -s build/dtg-routing/unresolved.json ] && [ "$(jq length build/dtg-routing/unresolved.json)" -gt 0 ]; then
            echo '- UNMAPPED qualifying findings remain visible in routing output.' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "  - `\(.finding_id)` \(.repository): \(.title)"' build/dtg-routing/unresolved.json >> "$GITHUB_STEP_SUMMARY"
          fi
