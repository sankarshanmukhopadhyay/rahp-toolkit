name: Run DTG cross-specification pressure test

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: DTG cross-specification composition
        required: true
        type: choice
        default: trust-tasks--credential-spec
        options:
          - trust-tasks--credential-spec
          - credential-spec--zkp
          - credential-spec--vds
          - trust-tasks--zkp
          - trust-tasks--vds
          - zkp--vds
          - agent-names--trust-tasks
          - agent-names--credential-spec

permissions:
  contents: read
  issues: write

jobs:
  assess:
    uses: ./.github/workflows/cross-spec-pressure-test.yml
    with:
      registry_path: profiles/dtg/cross-spec-tests.yaml
      composition_id: ${{ inputs.composition_id }}
      composition_scoped_registry_validation: true
