name: Release Codename Policy

on:
  pull_request:
    paths:
      - 'config/release-codename-*.json'
      - 'config/release-codenames.txt'
      - 'tools/release_codenames.py'
      - 'tools/test_release_codenames.py'
      - 'tools/release.py'
      - 'method/release.yaml'
      - 'docs/release-governance.md'
      - '.github/workflows/release-codename-policy.yml'
  push:
    branches: [main]
    paths:
      - 'config/release-codename-*.json'
      - 'config/release-codenames.txt'
      - 'tools/release_codenames.py'
      - 'tools/test_release_codenames.py'
      - 'tools/release.py'
      - 'method/release.yaml'
      - '.github/workflows/release-codename-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Validate pinned pool and persisted current release binding
        run: python3 tools/release_codenames.py validate
      - name: Pressure-test codename invariants
        run: python3 tools/test_release_codenames.py
      - name: Verify current RAHP release declaration
        run: python3 tools/release.py verify
