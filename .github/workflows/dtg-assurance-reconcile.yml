name: Reconcile DTG end-to-end assurance

on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'instances/dtg/state/**'
      - 'instances/dtg/generated/gatherer-runs/**'
      - 'instances/cawg/state/**'
      - 'profiles/dtg/rahp.yaml'

permissions:
  contents: read
  issues: read

concurrency:
  group: rahp-dtg-assurance-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    outputs:
      registry_mode: ${{ steps.external-owner.outputs.registry_mode }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, 'rahp-dtg-gatherer')) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Qualify scheduled local incident route
        id: external-owner
        shell: bash
        run: |
          set -euo pipefail
          owner="$(python3 tools/publish_assessment_issues.py --publication-owner)"
          case "$owner" in
            registry) echo "registry_mode=true" >> "$GITHUB_OUTPUT" ;;
            toolkit) echo "registry_mode=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid local incident route"; exit 1 ;;
          esac
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate lineage reconciliation
        run: |
          python3 tools/dtg_gatherer_lineage.py --self-test
          python3 tools/dtg_assurance_reconcile.py --self-test
      - name: Reconcile retained DTG gatherer runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/dtg_assurance_reconcile.py \
            --evidence-output /tmp/dtg-assurance-evidence.yaml \
            --result-output /tmp/dtg-assurance-result.yaml \
            | tee /tmp/dtg-assurance-summary.md
          cat /tmp/dtg-assurance-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render accepted-state unowned controller incidents
        if: github.event_name == 'push' || (github.event_name == 'schedule' && steps.external-owner.outputs.registry_mode == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/dtg_assurance_reconcile.py
          --incident-output build/accepted-state-incidents.json
      - name: Retain accepted-state incident decision
        if: github.event_name == 'push' || (github.event_name == 'schedule' && steps.external-owner.outputs.registry_mode == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: accepted-instance-state-incidents-${{ github.run_id }}
          path: build/accepted-state-incidents.json
          if-no-files-found: error

  local_incidents:
    needs: reconcile
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'schedule' && needs.reconcile.outputs.registry_mode == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: accepted-instance-state-incidents-${{ github.run_id }}
          path: build/
      - name: Reject stale main before local incident mutation
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::Toolkit main advanced during accepted-state incident reconciliation"
            exit 1
          fi
      - name: Publish only unowned Toolkit-local controller incidents from accepted state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_dtg_controller_incidents.py
          build/accepted-state-incidents.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
