name: Run distributed resilience assessment

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: GitHub repository to assess (owner/repository); leave empty when assessing source_url
        required: false
        type: string
      target_ref:
        description: Branch, tag or commit to assess
        required: false
        default: main
        type: string
      source_url:
        description: Optional single rendered/raw specification URL instead of a repository
        required: false
        type: string
      target_type:
        description: Assessment target type
        required: true
        default: mixed
        type: choice
        options: [mixed, implementation, specification, architecture, deployment, composed-system]
      profile_path:
        description: DRARM profile path in RAHP
        required: true
        default: profiles/resilience/default.yaml
        type: string
      upstream_repository:
        description: Metadata-only repository to recommend for human-reviewed remediation; RAHP never files there
        required: false
        type: string
      publish_rahp_issue:
        description: Create/coalesce a durable RAHP assessment issue when publication threshold is met
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAHP
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Validate DRARM model and profile
        run: |
          python3 tools/validate_resilience.py
          python3 - <<'PY'
          import json, pathlib, yaml, jsonschema
          p=pathlib.Path('${{ inputs.profile_path }}')
          if not p.is_file(): raise SystemExit(f'profile not found: {p}')
          schema=json.loads(pathlib.Path('method/schema/resilience-profile.schema.json').read_text())
          data=yaml.safe_load(p.read_text())
          jsonschema.Draft202012Validator(schema).validate(data)
          PY

      - name: Prepare target
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p build/resilience/target
          if [ -n "$TARGET_REPOSITORY" ]; then
            git clone --filter=blob:none "https://github.com/${TARGET_REPOSITORY}.git" build/resilience/target-repo
            git -C build/resilience/target-repo fetch --depth 1 origin "$TARGET_REF"
            git -C build/resilience/target-repo checkout --detach FETCH_HEAD
            echo "TARGET_PATH=build/resilience/target-repo" >> "$GITHUB_ENV"
            echo "TARGET_REVISION=$(git -C build/resilience/target-repo rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "TARGET_REPO_ID=$TARGET_REPOSITORY" >> "$GITHUB_ENV"
          elif [ -n "$SOURCE_URL" ]; then
            python3 - <<'PY'
          import os, pathlib, urllib.request
          url=os.environ['SOURCE_URL']
          req=urllib.request.Request(url,headers={'User-Agent':'rahp-drarm/1'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(5_000_001)
              if len(body)>5_000_000: raise SystemExit('source_url exceeds 5 MB safety limit')
              ctype=r.headers.get('Content-Type','')
          suffix='.md' if ('markdown' in ctype or url.endswith('.md')) else '.html'
          pathlib.Path('build/resilience/target/specification'+suffix).write_bytes(body)
          PY
            echo "TARGET_PATH=build/resilience/target" >> "$GITHUB_ENV"
            echo "TARGET_REVISION=url-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "TARGET_REPO_ID=external-specification" >> "$GITHUB_ENV"
          else
            echo '::error::Provide target_repository or source_url'
            exit 2
          fi

      - name: Materialize run profile
        env:
          BASE_PROFILE: ${{ inputs.profile_path }}
          TARGET_TYPE: ${{ inputs.target_type }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          python3 - <<'PY'
          import os, pathlib, yaml
          p=pathlib.Path(os.environ['BASE_PROFILE'])
          cfg=yaml.safe_load(p.read_text())
          cfg['target']['type']=os.environ['TARGET_TYPE']
          upstream=os.environ.get('UPSTREAM_REPOSITORY') or os.environ.get('TARGET_REPOSITORY')
          if upstream:
              cfg.setdefault('upstream',{})['repository']=upstream
          out=pathlib.Path('build/resilience/run-profile.yaml'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(yaml.safe_dump(cfg,sort_keys=False))
          PY

      - name: Run DRARM
        run: >-
          python3 tools/resilience_assess.py
          --target "$TARGET_PATH"
          --profile build/resilience/run-profile.yaml
          --repository "$TARGET_REPO_ID"
          --revision "$TARGET_REVISION"
          --json build/resilience/result.json
          --markdown build/resilience/report.md
          --events build/resilience/issue-events.json
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish durable RAHP assessment issue
        if: ${{ inputs.publish_rahp_issue }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/publish_assessment_issues.py
          --events build/resilience/issue-events.json
          --repository "sankarshanmukhopadhyay/rahp-toolkit"
          --result-json build/resilience/publish-result.json

      - name: Add assessment to workflow summary
        if: always()
        run: |
          if [ -f build/resilience/report.md ]; then cat build/resilience/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f build/resilience/publish-result.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '## Published RAHP work item' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.issues[] | "- [\(.action) #\(.number)](\(.url))"' build/resilience/publish-result.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributed-resilience-${{ github.run_id }}
          path: |
            build/resilience/result.json
            build/resilience/report.md
            build/resilience/issue-events.json
            build/resilience/publish-result.json
            build/resilience/run-profile.yaml
