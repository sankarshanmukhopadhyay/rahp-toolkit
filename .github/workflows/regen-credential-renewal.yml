name: Temporary renewal assurance regeneration

on:
  push:
    branches:
      - assurance/credential-renewal-authority

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Rebuild generated evidence
        run: python3 tools/build.py
      - name: Commit generated evidence
        shell: bash
        run: |
          if [ -n "$(git status --porcelain build/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build/
            git commit -s -m "docs(build): regenerate renewal assurance evidence"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Generated evidence already current."
          fi
