name: Corpus source status

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check corpus source drift
        id: corpus_status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 tools/corpus_status.py \
            --json build/corpus-status.json \
            --markdown build/corpus-status.md \
            --fail-on-error
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat build/corpus-status.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-source-status
          path: |
            build/corpus-status.json
            build/corpus-status.md
      - name: Surface corpus review requirement
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/corpus-status.json').read_text())
          review = {'UNPINNED_REVIEW_REQUIRED', 'CORPUS_REVIEW_REQUIRED', 'DEPENDENCY_REVIEW_REQUIRED'}
          items = [r for r in report.get('results', report if isinstance(report, list) else []) if r.get('status') in review]
          if items:
              names = ', '.join(f"{r.get('corpus_id')}: {r.get('status')}" for r in items)
              print(f'::warning::Corpus maintenance review is required: {names}. See the workflow summary/artifact.')
          else:
              print('No corpus semantic/provenance review is currently required.')
          PY
      - name: Fail on corpus status operational error
        if: steps.corpus_status.outputs.rc != '0'
        run: |
          echo 'Corpus status could not be evaluated reliably because of an operational or portfolio-configuration error.'
          exit 1

