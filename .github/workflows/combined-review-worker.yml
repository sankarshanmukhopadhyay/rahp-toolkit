name: Execute bounded combined RAHP reviews

on:
  issues:
    types: [opened, labeled, reopened]
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-review-worker.yml'
      - 'tools/combined_review_worker.py'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional combined-review issue number
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: rahp-combined-review-worker-${{ github.event.issue.number || inputs.issue_number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  advance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, 'dtg:portfolio:combined:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate combined-review worker
        run: python3 tools/combined_review_worker.py --self-test
      - name: Advance routed combined review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${EVENT_ISSUE_NUMBER:-${INPUT_ISSUE_NUMBER:-}}"
          if [ -n "$issue_number" ]; then
            python3 tools/combined_review_worker.py --issue "$issue_number"
          else
            python3 tools/combined_review_worker.py
          fi
