name: RAHP execution benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile from method/execution-benchmarks.yaml
        required: true
        default: full-validation
        type: choice
        options:
          - core-validation
          - corpus-validation
          - cross-spec-dtg-tt-credspec
          - full-validation
  pull_request:
    paths:
      - 'tools/benchmark_execution.py'
      - 'tools/portable_catalogue.py'
      - 'tools/validate_*.py'
      - 'tools/render_*.py'
      - 'tools/build.py'
      - 'tools/cross_spec_*.py'
      - 'method/execution-benchmarks.yaml'
      - 'corpora/**'
      - 'examples/**/pressure-test.yaml'
      - '.github/workflows/validate.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/cross-spec-pressure-test.yml'
      - '.github/workflows/execution-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["full-validation","cross-spec-dtg-tt-credspec"]' || format('["{0}"]', inputs.profile)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run selected benchmark
        run: >-
          python3 tools/benchmark_execution.py
          "${{ matrix.profile }}"
          --output "build/execution-benchmark-${{ matrix.profile }}.json"
      - name: Benchmark summary
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          path="build/execution-benchmark-${PROFILE}.json"
          if [ -f "$path" ]; then
            BENCHMARK_PATH="$path" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['BENCHMARK_PATH']).read_text())
          print('## RAHP execution benchmark')
          print(f"- Profile: `{d['profile']}`")
          print(f"- Wall time: **{d['wall_seconds']:.3f}s**")
          print(f"- Peak child RSS: **{d['peak_rss_kb']} KB**")
          print(f"- Exit code: `{d['profile_exit_code']}`")
          print('')
          print('| Seconds | Exit | Command |')
          print('|---:|---:|---|')
          for c in d['commands']:
              print(f"| {c['seconds']:.3f} | {c['exit_code']} | `{c['command']}` |")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rahp-execution-benchmark-${{ matrix.profile }}
          path: build/execution-benchmark-${{ matrix.profile }}.json
          if-no-files-found: error
