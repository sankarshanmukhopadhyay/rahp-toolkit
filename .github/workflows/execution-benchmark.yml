name: RAHP execution benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile from method/execution-benchmarks.yaml
        required: true
        default: full-validation
        type: choice
        options:
          - core-validation
          - corpus-validation
          - cross-spec-dtg-tt-credspec
          - cross-spec-dtg-full
          - cross-spec-dtg-scale-small
          - cross-spec-dtg-scale-medium
          - cross-spec-dtg-scale-full
          - full-validation
      samples:
        description: Repeated samples for manual characterisation runs
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
  pull_request:
    paths:
      - 'tools/benchmark_execution.py'
      - 'tools/profile_execution.py'
      - 'tools/cross_spec_scale_workload.py'
      - 'tools/compare_execution_benchmarks.py'
      - 'tools/validate.py'
      - 'tests/test_performance_policy.py'
      - 'method/execution-benchmarks.yaml'
      - '.github/workflows/execution-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["core-validation"]' || format('["{0}"]', inputs.profile)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pull-request baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run selected benchmark
        env:
          BENCHMARK_SAMPLES: ${{ github.event_name == 'pull_request' && '1' || inputs.samples }}
        run: >-
          python3 tools/benchmark_execution.py
          "${{ matrix.profile }}"
          --samples "$BENCHMARK_SAMPLES"
          --output "build/execution-benchmark-${{ matrix.profile }}.json"
      - name: Run pull-request baseline benchmark
        if: github.event_name == 'pull_request'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          (
            cd baseline
            python3 tools/benchmark_execution.py "$PROFILE"               --output "../build/execution-benchmark-baseline-$PROFILE.json"
          )

      - name: Compare candidate with pull-request baseline
        if: github.event_name == 'pull_request'
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python3 tools/compare_execution_benchmarks.py
          "build/execution-benchmark-baseline-${PROFILE}.json"
          "build/execution-benchmark-${PROFILE}.json"
          --policy method/execution-benchmarks.yaml
          --output "build/execution-benchmark-comparison-${PROFILE}.json"

      - name: Benchmark summary
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          path="build/execution-benchmark-${PROFILE}.json"
          comparison="build/execution-benchmark-comparison-${PROFILE}.json"
          if [ -f "$path" ]; then
            BENCHMARK_PATH="$path" COMPARISON_PATH="$comparison" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['BENCHMARK_PATH']).read_text())
          print('## RAHP execution benchmark')
          print(f"- Profile: `{d['profile']}`")
          print(f"- Median wall time: **{d['wall_seconds']:.3f}s**")
          print(f"- Median child CPU: **{d.get('cpu_seconds', 0.0):.3f}s**")
          print(f"- Samples: **{d.get('sample_count', 1)}**")
          dimensions = d.get('workload_dimensions') or {}
          if dimensions:
              print(f"- Workload: **{dimensions.get('scale', 'declared')}** ({dimensions.get('selected_composition_count', 'n/a')} compositions)")
          print(f"- Peak child RSS: **{d['peak_rss_kb']} KB**")
          print(f"- Exit code: `{d['profile_exit_code']}`")
          comparison = Path(os.environ['COMPARISON_PATH'])
          if comparison.is_file():
              c = json.loads(comparison.read_text())
              print(f"- Baseline comparison: **{c['status']}** ({c['reason']})")
              if c.get('delta_seconds') is not None:
                  print(f"- Delta: **{c['delta_seconds']:.3f}s**")
          print('')
          print('| Wall s | CPU s | Exit | Command |')
          print('|---:|---:|---:|---|')
          for c in d['commands']:
              print(f"| {c['seconds']:.3f} | {c.get('cpu_seconds', 0.0):.3f} | {c['exit_code']} | `{c['command']}` |")
          PY
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rahp-execution-benchmark-${{ matrix.profile }}
          path: |
            build/execution-benchmark-baseline-${{ matrix.profile }}.json
            build/execution-benchmark-${{ matrix.profile }}.json
            build/execution-benchmark-comparison-${{ matrix.profile }}.json
          if-no-files-found: error


  profile:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - core-validation
          - cross-spec-dtg-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Profile representative execution path
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python3 tools/profile_execution.py
          "$PROFILE"
          --output-dir "build/performance-profile-$PROFILE"
      - name: Publish runtime budget
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          report="build/performance-profile-$PROFILE/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rahp-runtime-profile-${{ matrix.profile }}
          path: build/performance-profile-${{ matrix.profile }}/
          if-no-files-found: error


  scaling:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - cross-spec-dtg-scale-small
          - cross-spec-dtg-scale-medium
          - cross-spec-dtg-scale-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Measure bounded scaling workload
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python3 tools/benchmark_execution.py
          "$PROFILE"
          --output "build/execution-benchmark-$PROFILE.json"
      - uses: actions/upload-artifact@v7
        with:
          name: rahp-scaling-${{ matrix.profile }}
          path: build/execution-benchmark-${{ matrix.profile }}.json
          if-no-files-found: error
