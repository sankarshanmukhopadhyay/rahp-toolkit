name: vti-assessment-profile

on:
  pull_request:
    paths:
      - 'schemas/vti-assessment.schema.json'
      - 'profiles/dtg/vti-assessment-profile.yaml'
      - 'examples/cross-spec/vti-assessment/**'
      - 'tools/validate_vti_assessment_profile.py'
      - 'docs/vti-assessment-profile.md'
      - 'docs/vti-pre-specification-evidence-pack.md'
      - '.github/workflows/vti-assessment-profile.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/vti-assessment.schema.json'
      - 'profiles/dtg/vti-assessment-profile.yaml'
      - 'examples/cross-spec/vti-assessment/**'
      - 'tools/validate_vti_assessment_profile.py'
      - 'docs/vti-assessment-profile.md'
      - 'docs/vti-pre-specification-evidence-pack.md'
      - '.github/workflows/vti-assessment-profile.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate VTI assessment profile
        run: python3 tools/validate_vti_assessment_profile.py
