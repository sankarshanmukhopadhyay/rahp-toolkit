portability:
  invariant: >-
    Portable RAHP method and engine contracts MUST remain independent of any deployment,
    repository host, specification family, implementation, or governance community.
  demonstration_policy: >-
    DTG, OpenVTC, ARPA, CAWG/C2PA, A2A, and other project-specific assessments MAY
    demonstrate portable capabilities but MUST NOT become dependencies of the portable method.
release_naming:
  applies_from: 1.5.0
  convention: west-bengal-butterfly
  source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selection: random-at-release-time
  candidate_rule: governed-random-unused-candidate
release_intent: >-
  v2.4.0 VTI Composition Assessment and Evidence-Conservative Reconciliation packages
  the version-pinned VTI assessment profile, machine-readable assessment submissions,
  multi-family validation, deterministic programme reconciliation, explicit privacy
  indeterminacy, and the component-substitution evidence gate as a stable additive
  toolkit capability without broadening claims beyond evidence.
development_posture: >-
  Post-v2.4 work uses materiality-bounded reassessment as the default operating model:
  select the smallest assurance/evidence scope that completely covers materially affected
  propositions, preserve explicit uncertainty and evidence freshness outside that scope,
  and retain full campaign/rebaseline execution for cases where bounded assurance cannot
  be defended. Continue deepening realization conformance, non-DTG portability, specialist
  interoperability and longitudinal observability while preserving the v1 engine contract,
  result schema 1 and evidence-retention contract.
