portability:
  invariant: >-
    Portable RAHP method and engine contracts MUST remain independent of any
    deployment, repository host, specification family, implementation, or
    governance community.
  demonstration_policy: >-
    DTG, OpenVTC, ARPA, CAWG/C2PA, A2A, and other project-specific assessments MAY
    demonstrate portable capabilities but MUST NOT become dependencies of the
    portable method or core conformance contract.
release_naming:
  applies_from: 1.5.0
  convention: west-bengal-butterfly
  source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selection: random-at-release-time
  candidate_rule: governed-random-unused-candidate
release_intent: >-
  v2.2.0 Evidence Production and Realization Assurance packages semantic assurance
  obligations, deterministic evidence-producer ownership and dispatch, provenance
  routing, bounded assurance invariants, current-portfolio clean-room execution and
  explicit normative-versus-realization separation. The DTG current-portfolio AMBER
  result is qualification evidence, not a claim that the consumer portfolio is GREEN.
