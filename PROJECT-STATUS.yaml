release_intent: >-
  v2.8.0 packages comparative assurance, adversarial assurance qualification,
  agent authority and continuity, lifecycle-continuation authority, consumer-interaction
  evidence integration, observability harm analysis and release-publication hardening as
  additive capabilities while preserving the stable v1 engine/result/evidence contracts.
development_posture: >-
  v2.8 remains evidence-conservative and materiality-bounded. Comparative or UI evidence
  cannot manufacture authority or terminal PASS; missing, stale, contradictory or external
  runtime evidence remains explicit. Research-only fiduciary work and deployment-specific
  runtime residuals remain outside the stable capability boundary unless separately qualified.
