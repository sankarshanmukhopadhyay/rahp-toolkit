release_intent: >-
  v2.6.0 Full-Stack Assurance Orchestration and Explicit Evidence State packages
  independent process/assurance/evidence dimensions, explicit material-lens disposition,
  attributable required-evidence attempts, composition/version-skew reasoning, privacy
  catalogue advances and measured execution engineering as stable additive capabilities
  without changing the v1 engine/result/evidence compatibility families.
development_posture: >-
  v2.6 preserves evidence-conservative materiality-bounded assurance while making full-stack
  orchestration explicit. Process completion is not assurance success; every material lens
  must be dispositioned; required evidence attempts must be attributable; and applicable
  unexecuted work remains INDETERMINATE. Experimental policy-as-subject and decision-resolution
  research remain outside the stable boundary.
