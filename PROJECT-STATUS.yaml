project: rahp-toolkit
stable_release: 1.9.0
development_target: 1.9.0
release_status: released
qualification_status: qualified
qualification_contract: method/v1.9-release-qualification.yaml
release_name:
  common_name: Lesser Mime
  scientific_name: Papilio epycides
  source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selected_on: '2026-08-30'
compatibility:
  engine_contract: rahp-engine-contract-v1
  normalized_result_schema: 1
  evidence_retention_contract: rahp-evidence-retention-v1
portability:
  invariant: >-
    Portable RAHP method and engine contracts MUST remain independent of any
    deployment, repository host, specification family, implementation, or
    governance community.
  demonstration_policy: >-
    DTG, OpenVTC, ARPA, CAWG/C2PA, and other project-specific assessments MAY
    demonstrate portable capabilities but MUST NOT become dependencies of the
    portable method or core conformance contract.
release_naming:
  applies_from: 1.5.0
  convention: west-bengal-butterfly
  source: https://en.wikipedia.org/wiki/List_of_butterflies_of_West_Bengal
  selection: random-at-release-time
  policy: >-
    Each v1.5.x and later release receives a release name selected at random
    from the governed pinned pool sourced from the recorded butterfly list. The
    selected common name and scientific name are persisted before release.
release_intent: >-
  v1.9.0 Portable Clean-Room Assurance is the stable release. It preserves the
  stable v1 contracts while qualifying declarative clean-room execution,
  immutable target/resource pinning, attributable runtime evidence, explicit
  positive-control versus pressure-test semantics, fresh RAHP-to-DPIP lineage,
  and workflow governance that prevents target-specific clean-room regression.
