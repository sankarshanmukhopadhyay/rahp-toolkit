release_intent: >-
  v2.9.0 packages evidence-qualified people-impact methodology, source-qualified corpus
  evidence, lifecycle/control-consequence assurance, source-pinned runtime and witness
  evidence, derived assurance-registry discovery, and reproducible release/contribution
  controls while preserving the stable v1 engine/result/evidence contracts.
development_posture: >-
  v2.9 remains evidence-conservative and materiality-bounded. Method capability does not
  manufacture qualified causal pathways; derived registry discovery does not become catalogue
  authority; missing, stale, contradictory, external or administratively inaccessible evidence
  remains explicit rather than becoming PASS.
