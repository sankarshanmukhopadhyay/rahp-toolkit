release_intent: >-
  v2.1.0 Qualified Autonomous Assurance Plane packages the post-#311 canonical
  machine-owned assurance lifecycle, multi-granularity subject model, autonomous
  controller, watchdog, citable human+machine terminal records, durable specialist
  return semantics, engine-owned clean-room execution and multi-target zero-touch
  qualification. Valid autonomous outcomes include adverse and indeterminate states;
  missing evidence never becomes PASS and component PASS never implies composition PASS.
