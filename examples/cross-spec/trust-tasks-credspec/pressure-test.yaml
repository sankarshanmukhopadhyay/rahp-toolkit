  method:
    workflow: docs/cross-spec-pressure-testing.md
    rule: A component-level pass does not imply a composition-level pass.
  summary:
    finding_count: 3
    open_count: 3
    overall_assessment: 'At current 2026-08-30 pins, Trust Tasks adds framework 0.5 lifecycle, mandatory consequential
      issuedAt, duplicate-execution defence, request/response binding, fail-closed transport handling and explicit
      Security & Privacy declarations; Credential Spec adds bidirectional membership consent and updated DID role
      semantics. These changes materially reduce the older findings but do not by themselves define one cross-spec
      action-time authority model, one credential-to-task outcome closure, or one composed privacy/contestability
      boundary. Three narrowed residual findings therefore remain open.'
  findings:
