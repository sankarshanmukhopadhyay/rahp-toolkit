    evidence:
    - source: https://github.com/trustoverip/dtgwg-cred-spec/commit/b89f389abbdae77ba60b673c0836c781c2b54169
      observation: The VWC digest is now required and strengthens edge binding, but it does not itself prove task
        completion or one-time execution.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-003
      observation: A valid credential and valid task can still be replayed together unless the composition binds
        freshness, task identity, credential use and side-effect execution.
    - source: trustoverip/dtgwg-trust-tasks-tf@4937c70df95e56ed6404b8c004106ecb121a23cf:specs/consent/decision/1.0/spec.md
      observation: Current consent decisions provide stronger challenge binding, authorization and consumption semantics,
        weakening any claim that Trust Tasks lacks approval machinery.
    - source: trustoverip/dtgwg-cred-spec@b89f389abbdae77ba60b673c0836c781c2b54169:spec/body.md
      observation: VWC digest binding now requires the referenced VRC to identify the witnessed edge, sharpening
        the evidence-closure boundary rather than eliminating it.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-015-xsp-017
      observation: Residual composition concerns are mixed-version quorum/decision binding and incomplete referenced
        evidence, not absence of generic approval or integrity primitives.
    harm: A credential can be correctly bound to an edge yet still be misinterpreted as proof of successful task
      completion, or reused with a duplicate consequential task to repeat an effect authorized only once.
    recommendation: Retain task-level replay and outcome controls, but define reusable decision/evidence-closure
      composition rules for canonical transaction binding, threshold policy, authoritative approver state, freshness
      and referenced credential evidence.
    retest_when:
    - A normative profile defines outcome evidence and one-time or idempotent execution binding across the two specifications.
