    evidence:
    - source: https://github.com/trustoverip/dtgwg-cred-spec/commit/2b403b607aaec9d84f78189a55337c677f3cd2ed
      observation: The VWC digest is now required and strengthens edge binding, but it does not itself prove task
        completion or one-time execution.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-003
      observation: A valid credential and valid task can still be replayed together unless the composition binds
        freshness, task identity, credential use and side-effect execution.
    - source: trustoverip/dtgwg-trust-tasks-tf@134733ff934775db522522dc26cb79836da29256:specs/consent/decision/1.0/spec.md
      observation: Current Trust Tasks now combines consent decision binding with framework 0.5 mandatory issuedAt
        and duplicate-execution defence, materially reducing replay risk. The residual question is cross-spec
        credential-to-task outcome/effect closure rather than absence of task-level replay controls.
    - source: trustoverip/dtgwg-cred-spec@2b403b607aaec9d84f78189a55337c677f3cd2ed:spec/body.md
      observation: Current Credential Spec retains VWC/VRC binding and now specifies both VMC directions so membership
        requires member consent. These are stronger component facts, but neither alone proves that a credential
        represents one completed consequential task or its side effect.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-015-xsp-017
      observation: Residual composition concerns are mixed-version quorum/decision binding and incomplete referenced
        evidence, not absence of generic approval or integrity primitives.
    harm: Even with task-level duplicate-execution defence, a credential can be correctly bound to an edge yet be
      over-read across the specification seam as evidence of successful task completion or of the authoritative
      outcome/effect that another system owns.
    recommendation: Retain task-level replay and outcome controls, but define reusable decision/evidence-closure
      composition rules for canonical transaction binding, threshold policy, authoritative approver state, freshness
      and referenced credential evidence.
    retest_when:
    - A normative profile defines outcome evidence and one-time or idempotent execution binding across the two specifications.
