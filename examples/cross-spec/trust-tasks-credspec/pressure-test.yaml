      - EVP-AUTH-01
    evidence:
    - source: instances/dtg/reviews/2026-08-trust-tasks.md
      observation: Trust Tasks through 2a40f6bd explicitly separates proof from role/scope authorization and strengthens
        lifecycle semantics, but does not define a universal cross-system delegation model or synchronized credential/status
        policy.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-002
      observation: Individually valid task and credential facts can still be combined beyond a principal's current
        mandate unless delegated authority is evaluated at action time.
    - source: trustoverip/dtgwg-trust-tasks-tf@4937c70df95e56ed6404b8c004106ecb121a23cf:specs/acl/grant/0.1/spec.md
      observation: Current Trust Tasks supplies scoped, expiring and authoritative ACL post-state mechanics, but
        role/scope semantics remain profile-defined and cross-artifact authority must still be evaluated at action
        time.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-013-xsp-020
      observation: Expanded seam cases show authority revocation, restoration, removal and fiduciary non-inference
        can diverge across otherwise valid task and credential evidence.
    harm: A consumer can execute a consequential task using valid component evidence while relying on stale, revoked
      or out-of-scope delegated authority, especially when credential, registry and task lifecycle views diverge.
    recommendation: Define the narrowest cross-spec authority/lifecycle profile needed to align current task authority,
      credential/governance state, effective-time precedence and non-inference at consequential action time; reuse
      existing ACL/credential primitives rather than adding a parallel base authority object.
    retest_when:
    - A companion profile or normative specification defines current delegated-authority verification across Trust
      Tasks and credentials.
    - The profile defines lifecycle synchronization, offline status-as-of semantics and safe degradation.
