    gate_reason: Three cross-specification obligations remain after the v1.9 current-pin retest; substantial
      replay, freshness, membership-consent, privacy and transport hardening narrows them but does not yet define
      a complete cross-spec authority/outcome/privacy closure contract.
    assurance_delta:
      disposition: refined
      summary: Trust Tasks advanced by 73 commits and Credential Spec by 3 commits from the prior assessment pins.
        Duplicate-execution defence, required issuedAt, response/request binding, fail-closed transport handling,
        privacy declarations and bidirectional membership consent materially strengthen the seam. The remaining
        findings are therefore narrower composition obligations, not claims that those primitives are absent.
      finding_lineage:
        F-001: refined
        F-002: refined
        F-003: refined
  scope:
    included:
    - Authority and delegation at the Trust Task + credential seam.
    - Execution/outcome binding, replay and idempotency.
    - Lifecycle skew across task, credential, registry and policy state.
    - Privacy composition across task, credential, transport and error evidence.
    - Cross-boundary redress and contestability.
    excluded:
