    evidence:
    - source: instances/dtg/reviews/2026-08-trust-tasks.md
      observation: New VTA lifecycle and HTTPS discovery surfaces improve explicitness but add observable artifacts
        whose combined privacy impact is not bounded by either component specification alone.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-012
      observation: Adverse outcomes can still span task policy, credential status and registry governance without
        a single accountable contestability boundary.
    - source: trustoverip/dtgwg-trust-tasks-tf@134733ff934775db522522dc26cb79836da29256:specs/vtc/members/removal-notice/0.1/spec.md
      observation: The new removal notice materially improves adverse-decision evidence and appealability, narrowing
        but not eliminating cross-system redress obligations.
    - source: corpora/trust-tasks-credspec-composed.yaml#xsp-018-xsp-020
      observation: Composed status lookup/task metadata can still create correlation, and technical authorization
        evidence must not be over-read as retained-agency or fiduciary-propriety proof.
    harm: Individually minimal proofs, task identifiers, endpoint metadata, status checks, errors and retained evidence
      can compose into durable correlation, while an affected person may lack a single evidence package and accountable
      path for contesting a cross-spec decision.
    recommendation: 'Define privacy and contestability requirements across the complete evidence closure: minimize
      stable correlation surfaces, retain portable adverse-decision evidence, and preserve explicit non-inference
      between authorization proof and broader governance judgments.'
    retest_when:
    - A privacy profile bounds disclosure and correlation across the composed exchange.
    - A governance profile defines the accountable decision owner, evidence package and contest/remedy path.
  closure:
    issue: 15
    disposition: reassessed-and-consolidated
    rationale: 'The dependency on issue #20 is satisfied by DTG-AR-2026-001 at Trust Tasks revision 2a40f6bd. The
      six original findings remain substantively relevant but are consolidated into three actionable cross-specification
      findings with explicit owners and retest conditions.'
    downstream_work: Issue closure records completion of the RAHP assessment cycle, not acceptance or resolution
      of the residual risks.
