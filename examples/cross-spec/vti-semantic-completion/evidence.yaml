evidence:
  id: VTI-COMP-SEM-001
  title: Protocol completion is not semantic trust completion
  issue: 185
  evidence_class: composition-fixture
  proposition: >-
    Successful technical execution must not be promoted to successful completion
    of a composed trust outcome unless every required semantic precondition is
    affirmatively established at the consequential-action boundary.
  source_lineage:
    - examples/cross-spec/trust-tasks--zkp/pressure-test.yaml#F-001
    - corpora/trust-tasks-zkp-composed.yaml#XSP-TZ-004
    - examples/cross-spec/trust-tasks-credspec/pressure-test.yaml#F-001
  boundary: >-
    These vectors test composition semantics, not a specific upstream VTI normative
    requirement. Technical completion and cryptographic validity are inputs; current
    authority, relationship state, and required human authorization are separate
    semantic preconditions.
  vectors:
    - id: technical-success-current-authority
      description: "Legitimate counter-case: all technical and semantic conditions are established."
      protocol:
        completed: true
        credential_verified: true
        proof_verified: true
      semantic_preconditions:
        current_authority: satisfied
        relationship_state: satisfied
        human_authorization: satisfied
      expected:
        technical_outcome: COMPLETE
        semantic_outcome: SATISFIED

    - id: technical-success-revoked-authority
      description: >-
        Falsifier: protocol and proof complete successfully, but delegated authority
        is revoked before consequential execution.
      protocol:
        completed: true
        credential_verified: true
        proof_verified: true
      semantic_preconditions:
        current_authority: failed
        relationship_state: satisfied
        human_authorization: satisfied
      expected:
        technical_outcome: COMPLETE
        semantic_outcome: FAILED

    - id: technical-success-authority-unknown
      description: >-
        Missing authority evidence must remain indeterminate rather than becoming
        success merely because the protocol completed.
      protocol:
        completed: true
        credential_verified: true
        proof_verified: true
      semantic_preconditions:
        current_authority: indeterminate
        relationship_state: satisfied
        human_authorization: satisfied
      expected:
        technical_outcome: COMPLETE
        semantic_outcome: INDETERMINATE

    - id: technical-success-invalid-relationship-state
      description: >-
        A completed exchange cannot establish the intended trust outcome where the
        required relationship-state transition is not valid.
      protocol:
        completed: true
        credential_verified: true
        proof_verified: true
      semantic_preconditions:
        current_authority: satisfied
        relationship_state: failed
        human_authorization: satisfied
      expected:
        technical_outcome: COMPLETE
        semantic_outcome: FAILED

    - id: technical-success-human-authorization-unknown
      description: >-
        Required principal authorization that is unavailable remains indeterminate;
        machine completion is not a substitute for it.
      protocol:
        completed: true
        credential_verified: true
        proof_verified: true
      semantic_preconditions:
        current_authority: satisfied
        relationship_state: satisfied
        human_authorization: indeterminate
      expected:
        technical_outcome: COMPLETE
        semantic_outcome: INDETERMINATE
  convergence_extension:
    vti_source:
      repository: trustoverip/dtgwg-vti-spec
      document_status: Working Draft 0.2.0
      commit: 3cbd7300a4f46bb2518e2b4b485609e7b5432b58
    requirements: [VTI-CMP-022, VTI-CMP-023]
    coordination_issue: 690
    evidence_boundary: >-
      These vectors establish the completion non-inference rule for the newly
      adopted VTI requirements. They are semantic assurance evidence, not proof
      that a target runtime implements the newer citation/digest path.
    source_evidence:
      - sankarshanmukhopadhyay/trust-protocol-interop-lab#233
    completion_evidence_vectors:
      - id: valid-credential-missing-outcome-evidence
        credential_valid: true
        citation_binding: exact
        outcome_evidence: missing
        expected: INDETERMINATE
      - id: valid-credential-mismatched-outcome-evidence
        credential_valid: true
        citation_binding: exact
        outcome_evidence: mismatched
        expected: CONTRADICTED
      - id: valid-credential-matching-outcome-evidence
        credential_valid: true
        citation_binding: exact
        outcome_evidence: matching
        expected: ESTABLISHED
      - id: valid-credential-unknown-binding
        credential_valid: true
        citation_binding: unknown
        outcome_evidence: matching
        expected: INDETERMINATE
