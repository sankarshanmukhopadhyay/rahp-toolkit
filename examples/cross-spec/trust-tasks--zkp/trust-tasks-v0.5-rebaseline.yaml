review:
  id: SR-XSP-004-TT050
  status: complete
  title: Trust Tasks v0.5.0 × ZKP assurance delta
  reviewed_on: '2026-08-27'
  target:
    repository: trustoverip/dtgwg-trust-tasks-spec + trustoverip/dtgwg-zkp-tf
    version: Composition of Trust Tasks Framework 0.5.0 and ZKP upstream current main
    commit: 6425a74136c1d2dfa7115889abe0b3521700e887
    companion_commit: 3b6b3f2e76005d6f579d076ee2833ef56d599b65
  lineage:
    prior_assessment: examples/cross-spec/trust-tasks--zkp/pressure-test.yaml
    prior_issue: 35
    trigger_issue: 89
    transition: reassessed
    evidence_freshness: re-evaluated
  reviewed_against:
    repository: sankarshanmukhopadhyay/rahp-toolkit
    rahp_version: v1.5.0
    reassessed_on: '2026-08-27'
  proposition: >-
    Determine whether Trust Tasks Framework v0.5.0 and the current upstream ZKP requirements change the prior authority, replay, provenance and privacy conclusions at their seam.
  assurance:
    residual_state: finding
    policy_gate: FAIL
    gate_reason: v0.5.0 narrows avoidable correlation and lifecycle ambiguity, while the current ZKP specification strengthens composition requirements; neither alone proves action-time authority or privacy of the complete task wrapper and retained evidence.
    assurance_delta:
      disposition: weakened
      summary: >-
        F-001 remains substantively unchanged because proof freshness is not mandate freshness. F-002 is weakened and split: raw identifier hygiene is materially improved, while task-context commitment and end-to-end retained-evidence correlation remain open.
      finding_lineage:
        F-001: unchanged
        F-002: split
  credited_controls:
    - id: TT050-PAIRWISE-01
      effect: Relationship-scoped VIDs and fresh, non-derived task correlation handles materially reduce stable cross-context identifiers.
    - id: TT050-ENACT-01
      effect: Ceremony enactment privacy is explicit; flows requiring unlinkable participation can declare blinded enactment semantics.
    - id: TT050-LIFE-01
      effect: Explicit lifecycle states and no inference from silence reduce semantic upgrading from transport success to task success.
    - id: ZKP04-COMP-01
      effect: Current upstream ZKP requirements explicitly strengthen composed-presentation privacy, context binding and separation between proof validity and authorization.
  findings:
    - id: F-001
      prior_disposition: unchanged
      delta: unchanged
      title: Action-time authority, lifecycle and reuse binding remains open
      status: open
      severity: Critical
      rationale: >-
        A proof can remain cryptographically valid and task-fresh while delegated authority changes before the side effect. Trust Tasks freshness and ZKP transcript freshness constrain different propositions and cannot be substituted for an authoritative execution-time mandate decision.
      falsified_if:
        - Negative vectors reject a fresh valid proof and fresh valid task after mandate revocation, expiry, scope reduction or supersession.
        - The composition contract binds principal, delegate, action, constraints and current authority state immediately before the effect.
    - id: F-002A
      prior_finding: F-002
      delta: weakened
      title: Stable task-identifier correlation is materially mitigated
      status: controlled
      severity: Medium
      rationale: >-
        Framework v0.5.0 now directly constrains issuer/recipient scope and requires fresh unguessable non-derived correlation handles, addressing an important part of the previous correlation hypothesis.
      falsified_if:
        - A conforming v0.5.0 flow can still reuse or deterministically derive its task/thread/enactment identifiers without violating the framework.
    - id: F-002B
      prior_finding: F-002
      delta: split
      title: Task-context commitment and retained-evidence privacy remain incomplete
      status: open
      severity: High
      rationale: >-
        Pairwise identifiers do not by themselves prove that a ZK transcript is bound to the intended task, action, purpose and audience, and retained task/proof/status evidence can still create a cross-context correlation surface even when each identifier is locally well scoped.
      falsified_if:
        - Cross-task and cross-audience negative vectors reject proof reuse outside the authorized task and purpose.
        - A composed privacy vector demonstrates that provenance and outcome evidence can be retained without an unnecessary durable cross-context correlator.
  human_judgment:
    accepted_conclusion: >-
      The prior privacy finding should not be copied forward unchanged. Trust Tasks v0.5.0 closes a meaningful identifier-hygiene subproblem, but the deeper composition/privacy obligation survives as a narrower finding.
    residual_uncertainty: >-
      Whether blinded enactments and retention declarations are sufficient in real multi-party deployments requires implementation/profile evidence beyond these normative sources.