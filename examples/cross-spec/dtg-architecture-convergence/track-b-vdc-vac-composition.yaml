    - id: VDV-NEG-004
      expected: deny
      result: deny
      reason: principal authority withdrawal takes effect independently of VDC validity
    - id: VDV-NEG-005
      expected: deny
      result: deny
      reason: VDC revocation takes effect independently of principal authority
    - id: VDV-NEG-006
      expected: deny
      result: deny
      reason: independently required delegate eligibility remains governance-owned and non-substitutable
    - id: VDV-NEG-007
      expected: deny
      result: deny
      reason: task/invocation mismatch is not repaired by otherwise valid standing artifacts

  terminal_disposition:
    result: SUPPORTED_WITH_BOUNDED_RESIDUALS
    supported:
      - DTG-371-P06
      - DTG-371-P07
      - DTG-371-P09
    partial:
      - DTG-371-P14
    conclusion: >-
      Track B materially supports the proposed VDC/VAC separation and intersection model. No executed
      case permits delegation to synthesize authority or authority to synthesize representation. The
      remaining obligations are not a semantic contradiction in the pair; they are native credential,
      cryptographic/current-state and complete actuation evidence that belong to later tracks.
