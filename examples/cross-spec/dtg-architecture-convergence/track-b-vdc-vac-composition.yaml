  summary:
    overall_assessment: SUPPORTED_WITH_BOUNDED_RESIDUALS
    assurance_posture: AMBER
    rationale: >-
      The pinned VDC and VAC proposals establish a coherent semantic boundary: delegation answers
      whether an actor may act in a principal's name, while authority answers whether the relevant
      party may perform the requested action. Deterministic Interop Lab execution demonstrates that
      the proposed composition can fail closed across all required non-substitution cases. The result
      remains semantic experimental evidence rather than proof of final DTG wire interoperability or
      a complete actuation contract.

  proposition_results:
    - proposition_id: DTG-371-P06
      result: supported-by-proposed-source-and-semantic-execution
      evidence_class: specification-plus-composition-test
      evidence:
        - trustoverip/dtgwg-cred-spec#19@ad5876f1b96e2149adec84d37d6595b4a212db9c
        - trustoverip/dtgwg-cred-spec#29@84650749afd48798e1c8919a95be359c0367a1c9
        - sankarshanmukhopadhyay/trust-protocol-interop-lab#92
      judgment: >-
        VDC and VAC remain non-substitutable in every executed vector. Authority without delegation
        cannot authorize acting in another's name, and delegation without principal authority cannot
        authorize the requested act.
      residual: final-upstream-adoption-and-wire-evidence

    - proposition_id: DTG-371-P07
      result: supported-by-semantic-execution
      evidence_class: specification-plus-runtime-composition
      evidence:
        - trustoverip/dtgwg-cred-spec#19@ad5876f1b96e2149adec84d37d6595b4a212db9c
        - sankarshanmukhopadhyay/trust-protocol-interop-lab#92
      judgment: >-
        The executable decision is the intersection of current delegation scope and principal authority
        scope. A write request is rejected when the principal may write but the delegation appoints only read.
      residual: cryptographic-and-native-artifact-realization

    - proposition_id: DTG-371-P09
      result: supported-at-semantic-current-state-boundary
      evidence_class: runtime-current-state
      evidence:
        - sankarshanmukhopadhyay/trust-protocol-interop-lab#92
        - examples/cross-spec/credential-zkp-trust-tasks/pressure-test.yaml
      judgment: >-
        Withdrawal of principal authority fails the request while delegation remains otherwise valid,
        and revocation of delegation fails the request while principal authority remains valid. The test
        therefore preserves lifecycle-state independence rather than relying on standing artifact validity.
      residual: native-status-and-revocation-evidence-for-final-credential-constructions

    - proposition_id: DTG-371-P14
      result: partial-support
      evidence_class: end-to-end-executable-composition
      evidence:
        - sankarshanmukhopadhyay/trust-protocol-interop-lab#92
      judgment: >-
        The experiment establishes the delegation/authority/eligibility/invocation slice of the broader
        actuation invariant and rejects invocation mismatch despite otherwise valid standing predicates.
        It does not yet establish the complete identity, relationship, privacy, policy, replay and side-effect
        boundary reserved for Track G.
      action_owner:
        surface: interop-test-harness
        repository: sankarshanmukhopadhyay/trust-protocol-interop-lab
      artifact_to_produce:
        kind: runtime-evidence
        description: Complete Track G actuation composition using the bounded evidence from Tracks A-F.

  executed_vectors:
    - id: VDV-POS-001
      expected: allow
      result: allow
      proposition_ids: [DTG-371-P06, DTG-371-P07, DTG-371-P09]
