manifest:
  schema: rahp-experimental-wave-rollback/v1
  id: DTG-ARCH-CONVERGENCE-371-ROLLBACK
  title: Discussion 371 architecture-convergence rollback and reversibility manifest
  status: active
  created_on: '2026-09-02'
  parent_discussion: https://github.com/sankarshanmukhopadhyay/rahp-toolkit/discussions/371
  purpose: >-
    Record the exact repository baselines, merged work, dependency order and preservation rules
    needed to unwind or selectively invalidate the DTG architecture-convergence experiment if
    upstream rejects, supersedes or materially redesigns the proposed correlation-scope, VDC or VAC semantics.

  non_destructive_rule: >-
    Do not reset shared repository history to a historical SHA. Perform rollback through explicit
    revert/reconciliation PRs so unrelated work merged after the baseline is preserved and the
    experiment/reversal remains auditable.

  restoration_targets:
    semantic_pre_371:
      preferred: true
      description: >-
        Remove or disable abandoned #371-specific semantics and executable fixtures while preserving
        generic assurance capabilities and historical assessment evidence that remain valid independently
        of the rejected upstream proposal.
    exact_historical_snapshot:
      preferred: false
      description: >-
        The baseline SHAs identify exact pre-wave repository snapshots for forensic comparison or a
        temporary reconstruction branch. They are not the recommended target for rewriting main history.

  upstream_dependencies:
    - id: correlation-scope
      repository: trustoverip/dtgwg-cred-spec
      pull_request: 30
      pinned_head: b3840f430f5bd01addab95881350a7f860e763e2
      authority_at_assessment: proposed-upstream
    - id: vdc
      repository: trustoverip/dtgwg-cred-spec
      pull_request: 19
      pinned_head: ad5876f1b96e2149adec84d37d6595b4a212db9c
      authority_at_assessment: proposed-upstream
    - id: vac
