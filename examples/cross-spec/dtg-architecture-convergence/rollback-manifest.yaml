        - {repository: sankarshanmukhopadhyay/dtg-privacy-implementation-profile, pr: 185, track: A}
        - {repository: sankarshanmukhopadhyay/rahp-toolkit, pr: 381, track: proposition-matrix}

  selective_invalidation:
    rule: >-
      Prefer dependency-scoped invalidation over a full reversal. Mark affected proposition evidence stale
      or superseded, identify dependent tracks from the canonical proposition matrix, revert only executable
      or normative-assumption artifacts that no longer represent current upstream semantics, and rerun the
      remaining unaffected evidence against current pins.
    examples:
      correlation_scope_rejected:
        invalidate_propositions: [DTG-371-P01, DTG-371-P02, DTG-371-P03, DTG-371-P04, DTG-371-P05, DTG-371-P13]
        primary_tracks: [A, F, G]
        specialist_prs: [185]
      vdc_rejected_or_redesigned:
        invalidate_propositions: [DTG-371-P06, DTG-371-P07, DTG-371-P09, DTG-371-P14]
        primary_tracks: [B, D, F, G]
        interop_prs: [92, 94, 96]
      vac_rejected_or_redesigned:
        invalidate_propositions: [DTG-371-P06, DTG-371-P08, DTG-371-P09, DTG-371-P10, DTG-371-P11, DTG-371-P12, DTG-371-P14]
        primary_tracks: [B, C, D, E, F, G]
        interop_prs: [92, 93, 94, 95, 96]

  preservation_policy:
    preserve_historical_evidence: true
    historical_transition:
      authority_status: superseded-upstream
      assurance_status: historical
      rule: >-
        Preserve the source-pinned assessment as evidence of what was tested against the historical proposal.
        Do not present it as applicable to current DTG semantics after upstream supersession.
    retain_generic_capabilities:
      - component PASS does not imply composition PASS
      - immutable source pinning and explicit source-authority status
      - stale-source invalidation rather than silent PASS carry-forward
      - semantic assurance obligation identity and owned residual artifacts
      - separation of generic RAHP assessment from specialist DPIP and Interop evidence production
      - evidence provenance and evidence-class discipline
    do_not_retain_if_upstream_rejected:
      - DTG-specific executable fixtures whose semantics depend on rejected proposal text
      - #371-specific specialist bindings that no longer correspond to a live proposition
      - CI invocations whose only purpose is executing superseded #371 fixtures
      - active assurance conclusions that imply superseded upstream semantics remain current

  execution_protocol:
    - Open a rollback/reconciliation issue linked to Discussion #371 and this manifest.
    - Record the upstream decision and immutable source proving rejection, supersession or redesign.
    - Compute affected proposition IDs and dependent tracks before changing code.
    - Create rollback branches from current main; never force-reset shared main.
    - Revert/remove dependent consumer artifacts before foundational proposition artifacts.
    - Preserve historical assessment records or move them to an explicitly historical/superseded state.
    - Run each repository's full required CI after every bounded rollback PR.
    - Rerun unaffected propositions against current upstream source pins.
    - Reconcile RAHP terminal states and ensure no superseded proposition remains active evidence.
    - Close the rollback issue only after all three repositories are internally green and cross-repository references are coherent.

  acceptance_criteria:
    - Exact pre-wave baselines are recorded for all three repositories.
    - Every merged #371 PR is listed exactly once in its owning repository.
    - Superseded but unmerged PRs are explicitly excluded from rollback execution.
    - Full rollback order is reverse dependency ordered.
    - Partial upstream reversal can be handled without reverting unrelated tracks.
    - Historical source-pinned assessments are preserved without being represented as current assurance.
    - Generic RAHP/DPIP/Interop capabilities are not removed merely because a DTG proposal is abandoned.
    - A rollback never requires rewriting shared repository history.
