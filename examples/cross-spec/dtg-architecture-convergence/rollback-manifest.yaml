      pull_request: 29
      pinned_head: 84650749afd48798e1c8919a95be359c0367a1c9
      authority_at_assessment: proposed-upstream
    - id: data-rooms
      url: https://docs.fpp.storm.ws/data-rooms-concept.html
      authority_at_assessment: informative-design
      rollback_effect: pressure-test-only

