version: 1
profile: rahp-decision-resolution-assurance-experimental
status: experimental
branch_constraint: research/decision-resolution-assurance
stable_release_boundary: false
propositions:
  - id: RAHP-DR-01
    title: Authority non-amplification
    pass_requires:
      - competent-authority-provenance
      - applicable-scope
      - current-lifecycle-state
      - governing-policy
    prohibited_substitutes:
      - peer-influence
      - repetition
      - consensus
      - reputation
      - discovery
      - unrelated-authority
  - id: RAHP-DR-02
    title: Decision-basis separation
    basis_categories:
      - authority_change
      - evidence_change
      - policy_change
      - lifecycle_change
      - correction
      - evaluation_context_change
    missing_basis_outcome: INDETERMINATE
    non_authority_categories_must_not_imply_authority_change: true
  - id: RAHP-DR-03
    title: Explicit resolution
    admissible_resolution_categories:
      - authority_change
      - evidence_change
      - policy_change
      - lifecycle_change
      - correction
    non_resolution_events:
      - peer_pressure
      - repetition
      - confidence
      - reputation
      - workflow_progression
    missing_resolution_evidence_outcome: INDETERMINATE
research_provenance:
  normative_dependency: false
  sources:
    - https://github.com/JessHines360/protocol-of-care-for-agents
    - https://github.com/JessHines360/protocol-of-care-for-agents/blob/main/BRIEF.md
    - https://github.com/JessHines360/protocol-of-care-for-agents/blob/main/experiments/SIMULATION_01_RUNBOOK.md
